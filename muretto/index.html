<title>Muretto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Box (scrolling team garage) / Gara (full-bleed canvas + HUD overlay) / Risultati.
   Look: 1970s endurance-racing poster meets pit-wall timing screen — chalk paper, navy, signal orange, condensed caps. */
:root{
  --bg:#EFEDE7; --surface:#FFFFFF; --surface2:#E6E3DA; --ink:#121826; --muted:#59616F; --line:rgba(18,24,38,.13);
  --navy:#14213D; --on-navy:#F4F2EC; --accent:#E8502A; --accent2:#B83A1B; --on-accent:#FFFFFF;
  --good:#1D8A5A; --warn:#C33A2E; --gold:#E3A332;
  --soft:#E23D3D; --med:#F2C230; --hard:#E9E9E9; --inter:#2FA35B;
  --shadow:0 1px 0 rgba(18,24,38,.05),0 10px 26px -16px rgba(18,24,38,.5);
  --scrim:rgba(10,14,24,.5);
  --f-display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#151C2E; --surface2:#1D2640; --ink:#EEF0F5; --muted:#9BA4B7; --line:rgba(238,240,245,.12);
    --navy:#0A0F1C; --on-navy:#EEF0F5; --accent:#FF6B3D; --accent2:#FF8B66; --on-accent:#14110F;
    --good:#4CC28A; --warn:#FF6B5E; --gold:#F2B84B;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.9);
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2E; --surface2:#1D2640; --ink:#EEF0F5; --muted:#9BA4B7; --line:rgba(238,240,245,.12);
  --navy:#0A0F1C; --on-navy:#EEF0F5; --accent:#FF6B3D; --accent2:#FF8B66; --on-accent:#14110F;
  --good:#4CC28A; --warn:#FF6B5E; --gold:#F2B84B;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Box ---------- */
.box{flex:1;overflow-y:auto;scrollbar-width:none}
.box::-webkit-scrollbar{display:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.mast .wrap{padding-block:16px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.mast .stripe{position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,var(--team) 0 60%,var(--accent) 60% 75%,var(--on-navy) 75%)}
.kicker{margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.mast h1{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:38px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.cr{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-family:var(--f-mono);font-weight:700;font-size:14px;white-space:nowrap}
.cr i{width:10px;height:10px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.sect{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.h2{margin:8px 0 0;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.gp{display:grid;grid-template-columns:1fr 120px;gap:6px 14px;align-items:center}
.gp h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase}
.gp .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;white-space:nowrap}
.gp svg{width:120px;height:auto;grid-row:1 / span 2;grid-column:2}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface2);border-radius:12px}
.seg button{border:0;border-radius:9px;padding:10px 8px;background:transparent;font-weight:800;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:58px}
.seg button small{font-weight:600;color:var(--muted);font-size:12px;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt.col{flex-direction:column;align-items:stretch;gap:8px}
.opt.col .pills{justify-content:flex-start;flex-wrap:nowrap}
.opt .lab{font-weight:700}
.opt .lab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tyre{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1b1b1b;border:3px solid var(--c);color:#fff;font-family:var(--f-mono);font-size:9px;font-weight:700;flex:none}
.toggle{width:52px;height:30px;border-radius:999px;border:0;background:var(--surface2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{transform:translateX(22px)}
.go{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.04em;min-height:58px;box-shadow:0 4px 0 var(--accent2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1D05}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drv{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.drv .nm{display:flex;align-items:center;gap:8px}
.drv .nm b{font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1;text-transform:uppercase}
.drv .no{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 5px;border-radius:6px;background:var(--team);color:#fff;font-family:var(--f-mono);font-weight:700;font-size:13px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.drv p{margin:0;font-size:12px;color:var(--muted);line-height:1.35}
.stat{display:grid;grid-template-columns:62px 1fr 26px;gap:6px;align-items:center;font-size:12px;font-weight:600}
.stat .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ink)}
.stat .mono{text-align:right;font-size:11px}
.stat.mor .bar i{background:var(--good)}
.parts{display:flex;flex-direction:column}
.part{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.part:first-child{border-top:0;padding-top:0}
.part b{font-weight:800}
.part small{display:block;color:var(--muted);font-size:12px}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{width:22px;height:6px;border-radius:2px;background:var(--surface2)}
.lv i.on{background:var(--accent)}
.sponsor{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.sponsor .logo{grid-row:1 / span 2;width:52px;height:52px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px}
.sponsor b{font-weight:800}
.sponsor span{font-size:13px;color:var(--muted)}
.livery{display:flex;gap:10px;flex-wrap:wrap}
.livery button{width:40px;height:40px;border-radius:10px;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.livery button[aria-pressed="true"]{border-color:var(--ink)}
.namefield{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:700}
table.std{width:100%;border-collapse:collapse;font-size:13px}
table.std td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.std td.p{width:28px;font-family:var(--f-mono);font-weight:700;color:var(--muted)}
table.std td.pt{text-align:right;font-family:var(--f-mono);font-weight:700}
table.std tr.me td{font-weight:800}
.sw{display:inline-block;width:6px;height:14px;border-radius:2px;background:var(--c);vertical-align:-2px;margin-right:8px}
.foot{height:24px}

/* ---------- Gara ---------- */
.race{position:relative;flex:1;min-height:0;overflow:hidden;background:#2F6B3E;touch-action:none;user-select:none;-webkit-user-select:none}
.race canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff;font-family:var(--f-body)}
.hud button{pointer-events:auto}
.htop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tower{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 0;width:132px;flex:none;font-family:var(--f-mono);font-size:12px;backdrop-filter:blur(4px)}
.tower div{display:grid;grid-template-columns:16px 4px 30px 1fr;gap:4px;align-items:center;padding:1px 7px;line-height:16px;white-space:nowrap}
.tower div.me{background:rgba(255,255,255,.16)}
.tower .ps{color:#aab;text-align:right}
.tower .tc{width:4px;height:12px;border-radius:1px;background:var(--c)}
.tower .gp{color:#c8cdd8;text-align:right;font-size:11px}
.tower .pit{color:var(--gold)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lapb{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 10px;text-align:right;line-height:1}
.lapb small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:#aab}
.lapb b{font-family:var(--f-display);font-size:26px;font-weight:800;font-style:italic}
.wx{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.hbtn{border:0;border-radius:10px;background:rgba(10,14,24,.82);color:#fff;padding:7px 11px;font-weight:800;font-size:12px}
.radio{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 270px);min-width:150px;background:var(--gold);color:#1E1503;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:pop .25s ease}
.radio small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.lights{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;gap:10px;padding:12px 14px;background:#0B0E15;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lights i{width:30px;height:30px;border-radius:50%;background:#2A2E38}
.lights i.on{background:#FF2B2B;box-shadow:0 0 16px #FF2B2B}
.hint{position:absolute;left:50%;top:56%;transform:translateX(-50%);background:rgba(10,14,24,.82);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;text-align:center;width:max-content;max-width:calc(100% - 40px);line-height:1.5}
.hbot{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.drive{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end}
.spd{background:rgba(10,14,24,.82);border-radius:12px;padding:7px 12px;min-width:112px}
.spd b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:40px;line-height:.9}
.spd small{font-size:10px;font-weight:800;letter-spacing:.12em;color:#aab;margin-left:4px}
.spd .lim{height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden}
.spd .lim i{display:block;height:100%;background:#4CC28A}
.spd .lim i.over{background:#FF4B3E}
.cue{justify-self:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tag{border-radius:8px;padding:4px 10px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.tag.brake{background:#FF3B30;color:#fff;animation:blink .35s steps(2) infinite}
.tag.slip{background:#3DA5FF;color:#04121F}
.tag.off{background:var(--gold);color:#1E1503}
.tyrebox{background:rgba(10,14,24,.82);border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tyrebox .w{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.boxbtn{border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.boxbtn.on{background:var(--gold);color:#1E1503}
.compsel{display:flex;gap:5px;background:rgba(10,14,24,.9);border-radius:12px;padding:6px;flex-wrap:wrap;justify-content:flex-end}
.compsel button{border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;padding:6px 8px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
.wall{display:flex;flex-direction:column;gap:8px}
.dp{background:rgba(10,14,24,.86);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px;backdrop-filter:blur(4px)}
.dp .r1{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.dp .r1 b{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1}
.dp .pos{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;line-height:1}
.dp .gap{font-family:var(--f-mono);font-size:12px;color:#c8cdd8}
.dp .wear{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.wbar{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.wbar i{display:block;height:100%}
.dp .r2{display:grid;grid-template-columns:1fr auto;gap:8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
.modes button{border:0;border-radius:7px;background:transparent;color:#dfe3ea;padding:7px 2px;font-weight:800;font-size:12px}
.modes button[aria-pressed="true"]{background:#fff;color:#0B0E15}
.walltop{display:flex;justify-content:flex-end;gap:6px}
.order{border:0;border-radius:10px;padding:8px 12px;background:#3DA5FF;color:#04121F;font-weight:800;font-size:12px}

.posbox{background:rgba(10,14,24,.82);border-radius:12px;padding:6px 10px;display:flex;gap:10px;align-items:center;backdrop-filter:blur(4px)}
.pbig{line-height:1}
.pbig small{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;color:#aab;text-transform:uppercase}
.pbig b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px}
.pbig span{font-family:var(--f-display);font-weight:700;font-size:16px;color:#aab}
.near{display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.near div{display:flex;align-items:center;gap:6px}
.near em{font-style:normal;color:#c8cdd8;font-weight:500}
.near .lead{color:var(--gold)}
.near .tc{width:4px;height:12px;border-radius:1px;background:var(--c)}
.spd .w{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;margin-top:6px}
.tag.warn{background:#F2B84B;color:#1E1503}
.ers{position:relative;overflow:hidden;width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.3);background:rgba(10,14,24,.85);color:#fff;display:grid;place-items:center;padding:0}
.ers .ersfill{position:absolute;left:0;right:0;bottom:0;background:rgba(61,165,255,.45);transition:height .1s}
.ers b{position:relative;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.ers.ready{border-color:#3DA5FF;box-shadow:0 0 0 4px rgba(61,165,255,.25)}
.ers.on{border-color:#fff;background:#3DA5FF;color:#04121F}
.flash{position:absolute;left:50%;top:30%;transform:translateX(-50%);padding:8px 16px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;white-space:nowrap;animation:pop .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.flash.good{background:#4CC28A;color:#06200F}
.flash.bad{background:#FF6B5E;color:#2A0703;font-size:16px}
.prompt{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 20px));background:#F6F3EA;color:#121826;border-radius:16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);pointer-events:auto;animation:pop .2s ease}
.prompt small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B83A1B}
.prompt b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05;margin-top:2px}
.prompt p{margin:4px 0 10px;font-size:14px;color:#3F4756}
.pbtns{display:flex;flex-direction:column;gap:6px}
.pbtns button{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:11px;background:#FFFFFF;box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1px rgba(18,24,38,.1);padding:9px 12px;font-weight:800;font-size:15px;color:#121826}
.pbtns button small{display:block;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:#59616F}
.pbtns button:last-child{background:transparent;box-shadow:0 0 0 1px rgba(18,24,38,.15)}
.pw .prompt{bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 90px);overflow-y:auto}
.ptime{height:4px;border-radius:2px;background:rgba(18,24,38,.1);margin-top:10px;overflow:hidden}
.ptime i{display:block;height:100%;background:#E8502A}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const app = $('#app');

/* =====================  Circuito  ===================== */
const CTRL = [[240,608],[550,605],[900,600],[1040,575],[1090,490],[1050,400],[950,370],[860,330],[840,240],[900,170],[960,135],[1008,92],[1010,45],[965,15],[880,10],[700,24],[560,40],[420,90],[330,60],[200,50],[100,110],[80,230],[165,315],[218,375],[212,432],[165,475],[115,500],[72,535],[65,580],[100,608],[160,612]];
const START = [600, 606];
function buildTrack(ctrl) {
  const pts = [], n = ctrl.length;
  for (let i = 0; i < n; i++) {
    const p0 = ctrl[(i-1+n)%n], p1 = ctrl[i], p2 = ctrl[(i+1)%n], p3 = ctrl[(i+2)%n];
    for (let q = 0; q < 80; q++) {
      const t = q/80, t2 = t*t, t3 = t2*t;
      const f = k => .5*(2*p1[k] + (-p0[k]+p2[k])*t + (2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2 + (-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3);
      pts.push([f(0), f(1)]);
    }
  }
  const cum = [0];
  for (let i = 1; i <= pts.length; i++) { const a = pts[i-1], b = pts[i % pts.length]; cum.push(cum[i-1] + Math.hypot(b[0]-a[0], b[1]-a[1])); }
  const L0 = cum[pts.length], N = Math.round(L0 / 2), ds = L0 / N;
  let x = new Float64Array(N), y = new Float64Array(N), j = 0;
  for (let i = 0; i < N; i++) {
    const s = i * ds; while (cum[j+1] < s) j++;
    const u = (s - cum[j]) / (cum[j+1] - cum[j]), a = pts[j], b = pts[(j+1) % pts.length];
    x[i] = a[0] + (b[0]-a[0])*u; y[i] = a[1] + (b[1]-a[1])*u;
  }
  // il via è sul rettilineo dei box
  let best = 0, bd = 1e9;
  for (let i = 0; i < N; i++) { const d = Math.hypot(x[i]-START[0], y[i]-START[1]); if (d < bd) { bd = d; best = i; } }
  const rot = a => { const o = new Float64Array(N); for (let i = 0; i < N; i++) o[i] = a[(i + best) % N]; return o; };
  x = rot(x); y = rot(y);
  const th = new Float64Array(N), tx = new Float64Array(N), ty = new Float64Array(N);
  for (let i = 0; i < N; i++) { const a = (i-1+N)%N, b = (i+1)%N; th[i] = Math.atan2(y[b]-y[a], x[b]-x[a]); tx[i] = Math.cos(th[i]); ty[i] = Math.sin(th[i]); }
  const w = 5, k0 = new Float64Array(N), k = new Float64Array(N);
  for (let i = 0; i < N; i++) { let d = th[(i+w)%N] - th[(i-w+N)%N]; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; k0[i] = -d / (2*w*ds); }
  for (let i = 0; i < N; i++) { let s = 0; for (let q = -6; q <= 6; q++) s += k0[(i+q+N)%N]; k[i] = s / 13; }
  return { N, ds, L:N*ds, x, y, th, tx, ty, k };
}
const T = buildTrack(CTRL);
const TW = 46, PIT_D = -40, PIT_HALF = 150, PIT_V = 70, LAPS = 3;
const A_LAT = 115, BRAKE = 130, VTOP = 225, ACC = 95;
const TS = 3.5, KMH = 1.45;                 // tempi e velocità mostrati in scala "reale"
const idx = s => { let i = Math.floor(s / T.ds) % T.N; return i < 0 ? i + T.N : i; };
const posAt = (s, d) => { const i = idx(s); return [T.x[i] + T.ty[i]*d, T.y[i] - T.tx[i]*d]; };   // d>0 = sinistra
function offPath(s0, s1, d) { const p = new Path2D(); let first = true; for (let s = s0; s <= s1; s += 4) { const [px, py] = posAt(s, d); if (first) { p.moveTo(px, py); first = false; } else p.lineTo(px, py); } return p; }
const PATHS = (() => {
  const center = new Path2D(); for (let i = 0; i < T.N; i += 2) { if (!i) center.moveTo(T.x[i], T.y[i]); else center.lineTo(T.x[i], T.y[i]); } center.closePath();
  const kerbs = [];
  let inC = false, st = 0;
  for (let i = 0; i <= T.N; i++) {
    const c = i < T.N && Math.abs(T.k[i]) > 1/170;
    if (c && !inC) { inC = true; st = i; }
    if (!c && inC) { inC = false; const sg = Math.sign(T.k[Math.floor((st+i)/2)]); kerbs.push(offPath(st*T.ds - 10, i*T.ds + 10, sg * (TW/2 + 2))); kerbs.push(offPath(st*T.ds + 30, i*T.ds - 30, -sg * (TW/2 + 2))); }
  }
  const pit = offPath(-PIT_HALF - 60, PIT_HALF + 60, PIT_D);
  const pitWall = offPath(-PIT_HALF + 10, PIT_HALF - 10, (PIT_D - TW/2) / 2 - 2);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (let i = 0; i < T.N; i++) { minX = Math.min(minX, T.x[i]); maxX = Math.max(maxX, T.x[i]); minY = Math.min(minY, T.y[i]); maxY = Math.max(maxY, T.y[i]); }
  return { center, kerbs, pit, pitWall, bb:[minX - 60, minY - 60, maxX + 60, maxY + 60] };
})();
function trackSvg(cls) {
  const [a, b, c, d] = PATHS.bb; let p = '';
  for (let i = 0; i < T.N; i += 8) p += (i ? 'L' : 'M') + T.x[i].toFixed(0) + ' ' + T.y[i].toFixed(0);
  const [sx, sy] = posAt(0, 0);
  return '<svg class="' + (cls || '') + '" viewBox="' + a + ' ' + b + ' ' + (c - a) + ' ' + (d - b) + '" aria-hidden="true"><path d="' + p + 'Z" fill="none" stroke="var(--ink)" stroke-width="22" stroke-linejoin="round"/><path d="' + p + 'Z" fill="none" stroke="var(--surface)" stroke-width="8" stroke-linejoin="round"/><circle cx="' + sx + '" cy="' + sy + '" r="20" fill="var(--accent)"/></svg>';
}

/* =====================  Squadre e stato  ===================== */
const LIVERIES = ['#E8502A','#7B4DE0','#F2B705','#12A4B5','#E0457B','#2D3142'];
const RIVAL_TEAMS = [
  { id:'falco', name:'Falco Motorsport', color:'#D7263D', power:1.0,  corner:1.0  },
  { id:'nord',  name:'Nordwind GP',      color:'#9EA9B6', power:1.0,  corner:.99  },
  { id:'atlas', name:'Atlas Racing',     color:'#2B59E0', power:.99,  corner:.985 },
  { id:'verde', name:'Verdeoro',         color:'#1E9E5A', power:.98,  corner:.98  }
];
const RIVALS = [
  { n:'Kai Andersen',  no:3,  t:'falco', vel:90, cos:84, gom:78 },
  { n:'Sofia Brandt',  no:12, t:'falco', vel:87, cos:88, gom:85 },
  { n:'Jonas Keller',  no:5,  t:'nord',  vel:88, cos:80, gom:80 },
  { n:'Amélie Roux',   no:21, t:'nord',  vel:84, cos:86, gom:88 },
  { n:'Ryo Tanaka',    no:9,  t:'atlas', vel:85, cos:78, gom:76 },
  { n:'Nina Kowalska', no:17, t:'atlas', vel:83, cos:84, gom:82 },
  { n:'Diego Prates',  no:30, t:'verde', vel:81, cos:76, gom:80 },
  { n:'Hana Okafor',   no:8,  t:'verde', vel:82, cos:82, gom:79 }
];
const PARTS = [
  { k:'engine', n:'Motore',        d:'Velocità di punta e accelerazione' },

  { k:'crew',   n:'Squadra box',   d:'Pit stop più rapidi' }
];
const PART_COST = [0, 350, 600, 900, 1300];
const SPONSOR = { n:'Lumen Energy', mark:'LE' };
const OBJECTIVES = [
  { t:'Entrambe le auto a punti', r:300, test:(res) => res.mine.every(c => c.pos <= 8) },
  { t:'Un’auto nei primi 5',      r:400, test:(res) => res.mine.some(c => c.pos <= 5) },
  { t:'Guadagna 3 posizioni con un pilota', r:300, test:(res) => res.mine.some(c => c.grid - c.pos >= 3) }
];
const POINTS = [25, 18, 15, 12, 10, 8, 6, 4];
const RACES = 8;
const COMP = {
  S:{ n:'Morbide',    c:'var(--soft)',  hex:'#E23D3D', grip:1.0,  wear:.40 },
  M:{ n:'Medie',      c:'var(--med)',   hex:'#F2C230', grip:.94,  wear:.27 },
  H:{ n:'Dure',       c:'var(--hard)',  hex:'#E9E9E9', grip:.88,  wear:.17 },
  I:{ n:'Intermedie', c:'var(--inter)', hex:'#2FA35B', grip:.86,  wear:.30 }
};
const fresh = () => ({
  v:1, teamName:'Scuderia Aurora', livery:LIVERIES[0], credits:500, race:1,
  parts:{ engine:1, aero:1, crew:1 },
  drivers:[
    { n:'Giulia Rinaldi', no:44, vel:85, cos:72, gom:76, mor:70, trait:'Talento giovane: velocissima, ogni tanto sbaglia.' },
    { n:'Leo Marchetti',  no:7,  vel:79, cos:88, gom:87, mor:70, trait:'Veterano: costante e attento alle gomme.' }
  ],
  setup:{ mode:'drive', driver:0, assist:true, start:['M','M'] },
  standings:{}, history:[], events:[]

let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem('muretto.v1') || 'null') || {}); } catch (e) { S = fresh(); }
const save = () => { try { localStorage.setItem('muretto.v1', JSON.stringify(S)); } catch (e) {} };
function track(n, p) { S.events.push({ t:Date.now(), n, p:p || {} }); if (S.events.length > 200) S.events.shift(); try { window.NATIVE && window.NATIVE.track && window.NATIVE.track(n, p || {}); } catch (e) {} save(); }
const code = n => n.split(' ').pop().normalize('NFD').replace(/[̀-ͯ]/g, '').slice(0, 3).toUpperCase();
const fmtCr = n => Math.round(n).toLocaleString('it-IT');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function lapStr(t) { t *= TS; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const tyreIco = c => '<span class="tyre" style="--c:' + COMP[c].c + '">' + c + '</span>';
const objective = () => OBJECTIVES[(S.race - 1) % OBJECTIVES.length];
const rainChance = () => [0.4, 0.25, 0.6, 0.3, 0.5, 0.2, 0.45, 0.7][(S.race - 1) % 8];

/* =====================  Box  ===================== */
let screen = 'box';
function renderBox() {
  screen = 'box'; stopRace();
  const st = S.setup, ob = objective();
  const stand = Object.entries(S.standings).sort((a, b) => b[1] - a[1]);
  const mine = S.drivers.map(d => d.n);
  const statRow = (lab, v, cls) => '<div class="stat ' + (cls || '') + '"><span>' + lab + '</span><span class="bar"><i style="width:' + v + '%"></i></span><span class="mono">' + v + '</span></div>';
  let h = '<div class="box" style="--team:' + S.livery + '">' +
    '<header class="mast"><div class="wrap"><div><p class="kicker">Gara ' + Math.min(S.race, RACES) + ' di ' + RACES + ' · Campionato Mondiale Gran Turismo</p><h1>' + esc(S.teamName) + '</h1></div><span class="cr" aria-label="Crediti"><i></i>' + fmtCr(S.credits) + '</span></div><div class="stripe"></div></header>' +
    '<div class="wrap sect">' +
    '<div class="card gp"><div><p class="kicker" style="color:var(--muted);opacity:1">Prossima gara</p><h2>Circuito del Lago</h2>' +
      '<div class="meta"><span class="chip">' + LAPS + ' giri</span><span class="chip">' + (T.L / 1000 * 1.6).toFixed(2).replace('.', ',') + ' km</span><span class="chip">Pioggia ' + Math.round(rainChance() * 100) + '%</span></div></div>' + trackSvg() + '</div>' +

    '<h3 class="h2">Monoposto</h3><div class="card parts">' + PARTS.map(p => {
      const lv = S.parts[p.k], cost = PART_COST[lv];
      return '<div class="part"><div><b>' + p.n + '</b><small>' + p.d + '</small><div class="lv" aria-label="Livello ' + lv + ' di 5">' + [1,2,3,4,5].map(k => '<i class="' + (k <= lv ? 'on' : '') + '"></i>').join('') + '</div></div>' +

    }).join('') + '</div>' +

    '<h3 class="h2">Livrea e nome</h3><div class="card" style="display:flex;flex-direction:column;gap:12px"><input class="namefield" id="tname" maxlength="26" value="' + esc(S.teamName) + '" aria-label="Nome della scuderia"><div class="livery" role="group" aria-label="Colore livrea">' +

function teamColorOf(name) {

  ctx.fillRect(7.6, -4.2, 1.6, 8.4);

function drawLabel(c, z, rot) {

function draw() {
  if (!ctx || !R) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = R.wet > .2 ? '#2A5C37' : '#2F6B3E'; ctx.fillRect(0, 0, W, H);
  const me = R.cars.find(c => c.driven);
  if (R.mode === 'drive' && me) {
    const th = T.th[idx(me.s + 60)], [x, y] = posAt(me.s, me.d * .5);
    if (!R.cam.init) R.cam = { th, init:true };
    let dth = th - R.cam.th; while (dth > Math.PI) dth -= 2 * Math.PI; while (dth < -Math.PI) dth += 2 * Math.PI;
    R.cam.th += dth * .05;
    const z = clamp(H / 340, 1.5, 2.6);
    ctx.save(); ctx.translate(W / 2, H * .68); ctx.scale(z, z); ctx.rotate(-R.cam.th - Math.PI / 2); ctx.translate(-x, -y);
    drawTrack(z, true);
    for (const c of order().reverse()) drawCar(c);
    for (const c of R.cars) if (c !== me && !c.finished) { const [cx, cy] = posAt(c.s, c.d); if (Math.hypot(cx - x, cy - y) < 240) drawLabel(c, z, R.cam.th + Math.PI / 2); }

    const [px, py] = posAt(me.s, me.d);
    ctx.save(); ctx.translate(px, py); ctx.rotate(R.cam.th + Math.PI / 2); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(0, -24 / z * 1.2); ctx.lineTo(-5 / z * 1.4, -32 / z * 1.2); ctx.lineTo(5 / z * 1.4, -32 / z * 1.2); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.restore();
    drawMini(W - 104, 158, 94);
  } else {
    const [a, b, c2, d] = PATHS.bb, top = 70, bottom = 240;
    const z = Math.min((W - 24) / (c2 - a), (H - top - bottom) / (d - b));
    ctx.save(); ctx.translate((W - (c2 - a) * z) / 2 - a * z, top + ((H - top - bottom) - (d - b) * z) / 2 - b * z); ctx.scale(z, z);

      const [x, y] = posAt(c.s, c.d);

      ctx.beginPath(); ctx.arc(x, y, (c.mine ? 9 : 7) / z, 0, 7); ctx.fill(); ctx.stroke();
      if (c.mine) { ctx.font = '700 ' + (11 / z) + 'px "JetBrains Mono",monospace'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(c.code, x, y - 13 / z); }
    }
    ctx.restore();
  }
  if (R.wet > .15) {
    ctx.strokeStyle = 'rgba(200,215,235,' + (R.wet * .35) + ')'; ctx.lineWidth = 1;
    ctx.beginPath(); for (let q = 0; q < 70 * R.wet; q++) { const x = Math.random() * W, y = Math.random() * H; ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14); } ctx.stroke();
  }
}
function drawMini(x0, y0, size) {
  const [a, b, c, d] = PATHS.bb, z = size / Math.max(c - a, d - b);

let last = 0;
function loop(now) {

  let dt = real * R.speed * (R.prompt ? .25 : 1);
  if (R.prompt) { R.prompt.left -= real; if (R.prompt.left <= 0) closePrompt(R.prompt.def); }

  draw();

/* =====================  Fine gara  ===================== */
function finishRace() {
  if (!R) return;
  stopRace();
  const ord = order();
  const res = { pos:[], mine:[] };
  ord.forEach((c, p) => {
    const pos = p + 1, pts = POINTS[p] || 0;
    S.standings[c.n] = (S.standings[c.n] || 0) + pts;
    const row = { c, pos, pts, grid:c.grid };
    res.pos.push(row); if (c.mine) res.mine.push(row);
  });
  const ob = objective(), obOk = ob.test(res);
  const prize = res.mine.reduce((s, r) => s + 80 + r.pts * 15, 0);
  const total = prize + (obOk ? ob.r : 0);
  S.credits += total;
  const raceNo = S.race; S.race++;
  S.history.push({ race:raceNo, mode:R.mode, pos:res.mine.map(r => r.pos), credits:total });
  track('race_finish', { race:raceNo, mode:R.mode, pos:res.mine.map(r => r.pos).join(','), grid:res.mine.map(r => r.grid).join(','), credits:total, objective:obOk, offs:res.mine.reduce((s, r) => s + r.c.offs, 0) });
  save();
  const ctxR = { mode:R.mode, order:R.orderUsed, mine:res.mine, wet:R.wet > .3 };
  R = null;
  renderResults(res, raceNo, prize, ob, obOk, total, ctxR);
}
function pressEvent(cx) {

    return { who:'Conferenza stampa', q:'«' + y + ' è furioso per l’ordine di scuderia. Era giusto farlo passare?»', ch:[
      { t:'Era la scelta migliore per la squadra.', s:y + ' −8 morale · ' + g + ' +4', f:() => { D(cx.order.yielded).mor -= 8; D(cx.order.gained).mor += 4; } },
      { t:'La prossima volta la priorità sarà sua.', s:y + ' +6 morale · ' + g + ' −4', f:() => { D(cx.order.yielded).mor += 6; D(cx.order.gained).mor -= 4; } }
    ]};

function renderResults(res, raceNo, prize, ob, obOk, total, cx) {

  const lead = res.pos[0].c;
  const ev = pressEvent(cx);
  app.innerHTML = '<div class="res" style="--team:' + S.livery + '"><header class="mast"><div class="wrap"><div><p class="kicker">Gara ' + raceNo + ' · Circuito del Lago' + (cx.wet ? ' · bagnato' : '') + '</p><h1>' + title + '</h1></div><span class="cr"><i></i>' + fmtCr(S.credits) + '</span></div><div class="stripe"></div></header>' +
    '<div class="wrap sect">' +
    '<div class="card"><table class="cls"><tbody>' + res.pos.map(r => '<tr class="' + (r.c.mine ? 'me' : '') + '"><td class="p">' + r.pos + '</td><td class="n"><span class="sw" style="--c:' + r.c.color + '"></span>' + esc(r.c.n) + (r.c.mine ? ' <span class="chip">' + (r.grid > r.pos ? '+' + (r.grid - r.pos) : r.grid < r.pos ? '−' + (r.pos - r.grid) : '=') + '</span>' : '') + '</td><td class="t">' + (r.c === lead ? lapStr(r.c.finT) : r.c.finished ? '+' + (TS * (r.c.finT - lead.finT)).toFixed(3) : 'non arrivato') + '</td><td class="pt">' + (r.pts ? '+' + r.pts : '') + '</td></tr>').join('') + '</tbody></table></div>' +
    '<div class="card earn"><div><span>Premi gara</span><span class="mono">+' + fmtCr(prize) + '</span></div><div><span>' + SPONSOR.n + ': ' + ob.t + '</span><span class="mono" style="color:' + (obOk ? 'var(--good)' : 'var(--muted)') + '">' + (obOk ? '+' + fmtCr(ob.r) : 'mancato') + '</span></div><div class="tot"><span>Totale</span><span class="mono" id="tot">+' + fmtCr(total) + '</span></div>' +
      '<button class="btn gold wide" id="dbl">▶ Raddoppia i premi gara con un annuncio</button></div>' +
    '<div class="card press"><span class="who">' + esc(ev.who) + '</span><p class="q">' + esc(ev.q) + '</p><div class="choices" id="choices">' + ev.ch.map((c, k) => '<button data-ch="' + k + '">' + esc(c.t) + '<small>' + esc(c.s) + '</small></button>').join('') + '</div></div>' +
    '<div class="foot"></div></div>' +
    '<div class="go"><div class="wrap"><button class="btn primary wide" id="back">Torna al box</button></div></div></div>';
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    const c = ev.ch[+b.dataset.ch]; c.f(); S.drivers.forEach(d => d.mor = Math.max(30, Math.min(100, d.mor))); save();
    track('press_choice', { q:ev.who, choice:+b.dataset.ch });
    $('#choices').outerHTML = '<p class="outcome">' + esc(c.s) + '</p>';
  });
  $('#dbl').onclick = async e => {
    const b = e.currentTarget; b.disabled = true;
    if (await rewarded('double_prize')) { S.credits += prize; save(); $('#tot').textContent = '+' + fmtCr(total + prize); b.textContent = 'Premi raddoppiati'; document.querySelector('.res .cr').innerHTML = '<i></i>' + fmtCr(S.credits); }
    else b.disabled = false;
  };
  $('#back').onclick = () => renderBox();
}
function rewarded(placement) {
  track('ad_rewarded_request', { placement });
  if (window.NATIVE) return window.NATIVE.rewarded().then(ok => { if (ok) track('ad_rewarded_complete', { placement }); return ok; });
  return new Promise(resolve => {
    const el = document.createElement('div'); el.className = 'ad'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Annuncio di prova');
    el.innerHTML = '<div class="in"><p class="kicker">Video con premio · prova</p><div class="art">Qui nell’app va in onda un annuncio AdMob da 15–30 secondi</div><div class="bar"><i></i></div><button class="btn wide" id="adok" disabled>Attendi 5 s</button><button class="btn wide" id="adno" style="background:transparent;color:#aaa;border-color:#333">Chiudi senza premio</button></div>';
    document.body.appendChild(el);
    el.querySelector('.bar i').animate([{ width:'0%' }, { width:'100%' }], { duration:5000, fill:'forwards' });
    let n = 5; const ok = el.querySelector('#adok');
    const iv = setInterval(() => { n--; if (n > 0) ok.textContent = 'Attendi ' + n + ' s'; else { clearInterval(iv); ok.disabled = false; ok.textContent = 'Ritira il premio'; } }, 1000);
    ok.onclick = () => { el.remove(); track('ad_rewarded_complete', { placement }); resolve(true); };
    el.querySelector('#adno').onclick = () => { clearInterval(iv); el.remove(); resolve(false); };
  });
}

window.__muretto = { T, PROFI, IDEAL, closePrompt:k => closePrompt(k), boost:() => boost(), get R() { return R; }, step: dt => step(dt), order:() => order(), startRace, S:() => S };
renderBox();
})();
</script>
