<title>Muretto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Box (scrolling career hub) / Sessione (full-bleed canvas + HUD) / Risultati / Fine stagione.
   Look: 1970s endurance-racing poster meets pit-wall timing screen — chalk paper, navy, signal orange, condensed caps. */
:root{
  --bg:#EFEDE7; --surface:#FFFFFF; --surface2:#E6E3DA; --ink:#121826; --muted:#59616F; --line:rgba(18,24,38,.13);
  --navy:#14213D; --on-navy:#F4F2EC; --accent:#E8502A; --accent2:#B83A1B; --on-accent:#FFFFFF;
  --good:#1D8A5A; --warn:#C33A2E; --gold:#E3A332;
  --soft:#E23D3D; --med:#F2C230; --hard:#E9E9E9; --inter:#2FA35B;
  --shadow:0 1px 0 rgba(18,24,38,.05),0 10px 26px -16px rgba(18,24,38,.5);
  --scrim:rgba(10,14,24,.55);
  --f-display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1220; --surface:#151C2E; --surface2:#1D2640; --ink:#EEF0F5; --muted:#9BA4B7; --line:rgba(238,240,245,.12);
    --navy:#0A0F1C; --on-navy:#EEF0F5; --accent:#FF6B3D; --accent2:#C9461F; --on-accent:#14110F;
    --good:#4CC28A; --warn:#FF6B5E; --gold:#F2B84B;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.9);
    --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#151C2E; --surface2:#1D2640; --ink:#EEF0F5; --muted:#9BA4B7; --line:rgba(238,240,245,.12);
  --navy:#0A0F1C; --on-navy:#EEF0F5; --accent:#FF6B3D; --accent2:#C9461F; --on-accent:#14110F;
  --good:#4CC28A; --warn:#FF6B5E; --gold:#F2B84B;
  --shadow:0 1px 0 rgba(0,0,0,.25),0 12px 30px -16px rgba(0,0,0,.9);
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Pagine con scorrimento ---------- */
.page{flex:1;overflow-y:auto;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.mast .wrap{padding-block:16px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.mast .stripe{position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,var(--team) 0 60%,var(--accent) 60% 75%,var(--on-navy) 75%)}
.kicker{margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.mast h1{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:36px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.mast .sub{margin:4px 0 0;font-weight:600;font-size:13px;opacity:.85}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cr{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-family:var(--f-mono);font-weight:700;font-size:14px;white-space:nowrap;border:0;color:inherit}
.cr i{width:10px;height:10px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.cr .plus{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;font-family:var(--f-body)}
.sect{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.h2{margin:8px 0 0;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.gp{display:grid;grid-template-columns:1fr 112px;gap:6px 14px;align-items:center}
.gp h2{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px;line-height:.95;text-transform:uppercase}
.gp .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gp svg{width:112px;height:auto;grid-row:1 / span 2;grid-column:2}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;white-space:nowrap}
.chip.hot{background:var(--accent);color:var(--on-accent)}
.sessions{display:flex;flex-direction:column;margin-top:4px}
.sess{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sess .ix{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-family:var(--f-display);font-weight:800;font-size:16px}
.sess.done .ix{background:var(--good);color:#fff}
.sess.now .ix{background:var(--accent);color:var(--on-accent)}
.sess b{display:block;font-weight:800}
.sess small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.sess .acts{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.04em;min-height:56px;box-shadow:0 4px 0 var(--accent2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}
.btn.go2{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1D05}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface2);border-radius:12px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;border-radius:9px;padding:10px 8px;background:transparent;font-weight:800;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button small{font-weight:600;color:var(--muted);font-size:12px;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt.col{flex-direction:column;align-items:stretch;gap:8px}
.opt .lab{font-weight:700}
.opt .lab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.opt.col .pills{justify-content:flex-start}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tyre{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1b1b1b;border:3px solid var(--c);color:#fff;font-family:var(--f-mono);font-size:9px;font-weight:700;flex:none}
.go{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drv{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.drv .nm{display:flex;align-items:center;gap:8px}
.drv .nm b{font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1;text-transform:uppercase}
.no{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 5px;border-radius:6px;background:var(--team);color:#fff;font-family:var(--f-mono);font-weight:700;font-size:13px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.drv p{margin:0;font-size:12px;color:var(--muted);line-height:1.35}
.stat{display:grid;grid-template-columns:62px 1fr 26px;gap:6px;align-items:center;font-size:12px;font-weight:600}
.stat .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ink)}
.stat .mono{text-align:right;font-size:11px}
.stat.mor .bar i{background:var(--good)}
.train{display:grid;grid-template-columns:72px 1fr 34px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-weight:700;font-size:14px}
.train:first-of-type{border-top:0}
.train .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.train .bar i{display:block;height:100%;background:var(--accent)}
.parts{display:flex;flex-direction:column}
.part{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.part:first-child{border-top:0;padding-top:0}
.part b{font-weight:800}
.part small{display:block;color:var(--muted);font-size:12px}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{width:22px;height:6px;border-radius:2px;background:var(--surface2)}
.lv i.on{background:var(--accent)}
.rule{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.rule .ico{grid-row:1 / span 2;width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.rule b{font-weight:800}
.rule span{font-size:13px;color:var(--muted)}
.sponsor{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.sponsor .logo{grid-row:1 / span 2;width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:17px}
.sponsor b{font-weight:800}
.sponsor span{font-size:13px;color:var(--muted)}
.livery{display:flex;gap:10px;flex-wrap:wrap}
.livery button{position:relative;width:40px;height:40px;border-radius:10px;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.livery button[aria-pressed="true"]{border-color:var(--ink)}
.livery button.locked::after{content:"★";position:absolute;right:-6px;top:-8px;font-size:13px;color:var(--gold);text-shadow:0 0 2px #000}
.field{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:0;border-radius:999px;padding:6px 12px;background:var(--surface2);font-weight:800;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
table.std{width:100%;border-collapse:collapse;font-size:13px}
table.std td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.std td.p{width:28px;font-family:var(--f-mono);font-weight:700;color:var(--muted)}
table.std td.pt{text-align:right;font-family:var(--f-mono);font-weight:700}
table.std tr.me td{font-weight:800}
.sw{display:inline-block;width:6px;height:14px;border-radius:2px;background:var(--c);vertical-align:-2px;margin-right:8px}
.foot{height:24px}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;padding:8px 0}
.role{display:grid;grid-template-columns:1fr;gap:10px}
.role button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.role button b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:26px;text-transform:uppercase;line-height:1}
.role button span{color:var(--muted);font-size:14px}
.role button[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--shadow)}
.role button[aria-pressed="true"] b{color:var(--accent)}
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero .wrap{padding-block:34px 26px}
.hero h1{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:64px;line-height:.85;text-transform:uppercase}
.hero p{margin:10px 0 0;max-width:34ch;opacity:.85}
.hero .stripe{position:absolute;inset:auto 0 0 0;height:8px;background:linear-gradient(90deg,var(--accent) 0 55%,var(--gold) 55% 70%,var(--on-navy) 70%)}

/* ---------- Sessione ---------- */
.race{position:relative;flex:1;min-height:0;overflow:hidden;background:#2F6B3E;touch-action:none;user-select:none;-webkit-user-select:none}
.race canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff}
.hud button{pointer-events:auto}
.htop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tower{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 0;width:132px;flex:none;font-family:var(--f-mono);font-size:12px}
.tower div{display:grid;grid-template-columns:16px 4px 30px 1fr;gap:4px;align-items:center;padding:1px 7px;line-height:16px;white-space:nowrap}
.tower div.me{background:rgba(255,255,255,.16)}
.tower .ps{color:#aab;text-align:right}
.tc{width:4px;height:12px;border-radius:1px;background:var(--c);display:inline-block}
.tower .gp{color:#c8cdd8;text-align:right;font-size:11px}
.tower .pit{color:var(--gold)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lapb{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 10px;text-align:right;line-height:1}
.lapb small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:#aab}
.lapb b{font-family:var(--f-display);font-size:26px;font-weight:800;font-style:italic}
.wx{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700}
.hbtn{border:0;border-radius:10px;background:rgba(10,14,24,.82);color:#fff;padding:7px 11px;font-weight:800;font-size:12px}
.posbox{background:rgba(10,14,24,.82);border-radius:12px;padding:6px 10px;display:flex;gap:10px;align-items:center}
.pbig{line-height:1}
.pbig small{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;color:#aab;text-transform:uppercase}
.pbig b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px}
.pbig span{font-family:var(--f-display);font-weight:700;font-size:16px;color:#aab}
.near{display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.near div{display:flex;align-items:center;gap:6px}
.near em{font-style:normal;color:#c8cdd8;font-weight:500}
.near .lead{color:var(--gold)}
.timer{font-family:var(--f-mono);font-size:13px;line-height:1.45}
.timer b{font-size:20px}
.timer .dl.good{color:#4CC28A}.timer .dl.bad{color:#FF6B5E}
.radio{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 270px);min-width:150px;background:var(--gold);color:#1E1503;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:pop .25s ease}
.radio small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.lights{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);display:flex;gap:10px;padding:12px 14px;background:#0B0E15;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lights i{width:30px;height:30px;border-radius:50%;background:#2A2E38}
.lights i.on{background:#FF2B2B;box-shadow:0 0 16px #FF2B2B}
.hbot{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.drive{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end}
.spd{background:rgba(10,14,24,.82);border-radius:12px;padding:7px 12px;min-width:112px}
.spd b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:40px;line-height:.9}
.spd small{font-size:10px;font-weight:800;letter-spacing:.12em;color:#aab;margin-left:4px}
.spd .w{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;margin-top:6px}
.wbar{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.wbar i{display:block;height:100%}
.cue{justify-self:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tag{border-radius:8px;padding:4px 10px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:17px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag.bad{background:#FF3B30;color:#fff}
.tag.blue{background:#3DA5FF;color:#04121F}
.tag.warn{background:#F2B84B;color:#1E1503}
.tag.good{background:#4CC28A;color:#06200F}
.late{border:0;border-radius:14px;padding:10px 16px;background:#FF3B30;color:#fff;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 0 0 4px rgba(255,59,48,.35),0 8px 20px rgba(0,0,0,.4);animation:throb .6s ease-in-out infinite}
.late small{display:block;font-family:var(--f-body);font-style:normal;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;opacity:.9}
.ers{position:relative;overflow:hidden;width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.3);background:rgba(10,14,24,.85);color:#fff;display:grid;place-items:center;padding:0}
.ers .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(61,165,255,.45)}
.ers b{position:relative;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;text-transform:uppercase}
.ers.ready{border-color:#3DA5FF;box-shadow:0 0 0 4px rgba(61,165,255,.25)}
.ers.on{border-color:#fff;background:#3DA5FF;color:#04121F}
.flash{position:absolute;left:50%;top:28%;transform:translateX(-50%);padding:8px 16px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;white-space:nowrap;animation:pop .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.flash.good{background:#4CC28A;color:#06200F}
.flash.bad{background:#FF6B5E;color:#2A0703;font-size:16px}
.wall{display:flex;flex-direction:column;gap:8px}
.dp{background:rgba(10,14,24,.86);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.dp .r1{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.dp .r1 b{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1}
.dp .pos{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;line-height:1}
.dp .gap{font-family:var(--f-mono);font-size:12px;color:#c8cdd8}

// giro di un'auto perfetta: base per i tempi simulati
function refLap(power, corner, pace) {
  let s = -T.L, v = 120, t = 0; const dt = 1 / 60, vt = VTOP * power;   // un giro di lancio, poi si misura
  while (s < T.L) { if (s < 0 && s + v * dt >= 0) t = 0; const i = idx(s), tg = Math.min(PROFI[i] * Math.sqrt(corner) * pace, vt); if (v < tg) v = Math.min(tg, v + ACC * power * Math.max(.05, 1 - v / (vt * 1.02)) * dt); else v = Math.max(tg, v - BRAKE * dt); s += v * dt; t += dt; }
  return t;
}

let last = 0;
function loop(now) {
  if (!R) return;
  const real = Math.min(.05, (now - last) / 1000); last = now;
  let dt = real * R.speed * (R.prompt ? .25 : 1);
  if (R.prompt) { R.prompt.left -= real; if (R.prompt.left <= 0) closePrompt(R.prompt.def); }
  if (document.visibilityState === 'visible') { while (dt > 0) { const h = Math.min(dt, 1 / 120); step(h); dt -= h; if (!R) return; } }

}
function stopRace() { cancelAnimationFrame(raf); }

    track('fp_done', { offs:me.offs });

    const ideal = STYLE[GP.style].setup;
    renderPage('Prove libere finite', '<p>Miglior giro <b class="mono">' + (w.fp.best ? lapStr(w.fp.best) : '—') + '</b>. Conoscenza della pista: <b>' + w.know + '%</b>' + (me.offs ? ' (sarebbe stata più alta senza uscite di pista)' : '') + '. Vale qualche decimo in qualifica e in gara.</p><p style="margin:0">L’ingegnere ha capito l’assetto giusto per ' + esc(GP.n) + ': <b>' + SETUPS[ideal].n + '</b>. ' + (w.setup === ideal ? 'È già quello che hai scelto.' : 'Puoi cambiarlo dal box prima della qualifica.') + '</p>', [{ t:'Torna al box', primary:true, fn:renderBox }]);

    R = null; save();
    const rows = q.grid.map((id, p) => { const d = drvOf(id), t = teamOf(d.team); return '<tr class="' + (id === me.id ? 'me' : '') + '"><td class="p">' + (p + 1) + '</td><td class="n"><span class="sw" style="--c:' + t.color + '"></span>' + esc(d.n) + '</td><td class="t">' + (p ? '+' + ((q.times[id] - pole) * TS).toFixed(3) : lapStr(pole)) + '</td></tr>'; }).join('');
    renderPage(pos === 1 ? 'Pole position!' : 'Qualifica: P' + pos, '<table class="cls"><tbody>' + rows + '</tbody></table>', [

function finishRace() {
  const c = C();
  if (hasRule('pit')) R.cars.forEach(x => { if (x.finished && !x.pits) { x.finT += 10 / TS; x.pen = true; } });
  const fin = order();
  const res = { pos:[], mine:[] };
  fin.forEach((x, p) => {
    let pts = POINTS[p] || 0;
    if (hasRule('giro') && R.fast && R.fast.id === x.id && p < 10) pts++;
    c.standings.d[x.id] = (c.standings.d[x.id] || 0) + pts;
    c.standings.t[x.team] = (c.standings.t[x.team] || 0) + pts;
    const row = { c:x, pos:p + 1, pts, grid:x.grid }; res.pos.push(row); if (x.mine) res.mine.push(row);

  else { const r = res.mine[0], rank = c.teams.slice().sort((a, b) => teamStrength(b) - teamStrength(a)).indexOf(teamOf(myTeamId())); prize = salaryOfRank(rank) + r.pts * 20 + Math.max(0, r.grid - r.pos) * 15; }

  const total = prize + (objOk ? obj.r : 0);

  // le squadre rivali sviluppano la macchina
  const dev = hasRule('budget') ? .6 : 1;
  c.teams.forEach(t => { if (!(t.id === 'aurora' && c.role === 'manager')) { t.power += rnd(0, .0016) * dev; t.corner += rnd(0, .0016) * dev; } });

  c.history.push({ s:c.season, r:raceNo, gp:GP.n, pos:res.mine.map(r => r.pos) });
  const drv = R.cars.find(x => x.driven);
  track('race_finish', { gp:GP.n, laps:R.laps, mode:R.mode, pos:res.mine.map(r => r.pos).join(','), grid:res.mine.map(r => r.grid).join(','), credits:total, passes:drv ? drv.passes : 0 });
  const cx = { order:R.orderUsed, wet:R.wet > .3, fast:R.fast };

  renderResults(res, raceNo, prize, obj, objOk, total, cx);
}

    '<h3 class="h2">Classifica piloti</h3><div class="card"><table class="std"><tbody>' + dRows.map(([d, p], i) => '<tr class="' + ((c.role === 'driver' ? d.id === 'me' : d.team === 'aurora') ? 'me' : '') + '"><td class="p">' + (i + 1) + '</td><td><span class="sw" style="--c:' + teamOf(d.team).color + '"></span>' + esc(d.n) + '</td><td class="pt">' + p + '</td></tr>').join('') + '</tbody></table></div><div class="foot"></div></div>' +
    (c.role === 'driver' ? '' : '<div class="go"><div class="wrap"><button class="btn primary wide" id="nextS">Stagione ' + (c.season + 1) + '</button></div></div>') + '</div>';
  app.querySelectorAll('[data-offer]').forEach(b => b.onclick = () => { signWith(b.dataset.offer); startNextSeason(); });
  const ns = $('#nextS'); if (ns) ns.onclick = startNextSeason;
}
function signWith(teamId) {
  const c = C(), me = drvOf('me');
  if (teamId === me.team) return;
  const out = c.drivers.filter(d => d.team === teamId).sort((a, b) => (c.standings.d[a.id] || 0) - (c.standings.d[b.id] || 0))[0];
  out.team = me.team; me.team = teamId;
  track('sign', { team:teamId });
  toast('Firmato con ' + teamOf(teamId).name);
}
function startNextSeason() {
  const c = C();
  c.season++; c.round = 1; c.standings = { d:{}, t:{} }; c.weekend = null; c.seasonPaid = false; c.pass = false; c.hype = 0;
  c.calendar = pickCalendar(c.seasonLen);
  c.drivers.forEach(d => { if (d.id !== 'me') d.vel = clamp(d.vel + Math.round(rnd(-1, 2)), 70, 96); d.mor = 70; });
  newSeasonRules();
  save(); renderBox(); setTimeout(showRuleSheet, 300);
}
function showRuleSheet() {
  const c = C(); if (!c) return;
  const rl = RULES.find(r => r.id === c.rules[0]);
  let h = '<h2>Regolamento stagione ' + c.season + '</h2>' + (c.revolution ? '<p><b>Rivoluzione tecnica.</b> Nuove regole aerodinamiche: le differenze tra le squadre si riducono' + (c.role === 'manager' ? ' e la tua aerodinamica perde due livelli' : '') + '. Chi interpreta meglio le regole può fare il salto.</p>' : '') +
    '<div class="rule" style="margin-bottom:14px"><span class="ico">' + rl.ico + '</span><b>' + rl.n + '</b><span>' + rl.d + '</span></div>';
  if (c.role === 'manager') h += '<h3>Dove concentri lo sviluppo?</h3><p>La priorità costa il 30% in meno per tutta la stagione.</p>' + PARTS.map(p => '<button class="prod" data-focus="' + p.k + '"><span class="pi">' + p.n[0] + '</span><div><b>' + p.n + '</b><span>' + p.d + '</span></div><span class="p">Scegli</span></button>').join('');
  else h += '<button class="btn primary wide" id="okRule">Si parte</button>';
  openSheet(h, true);
  document.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => { c.focus = b.dataset.focus; track('focus', { part:c.focus }); save(); renderBox(); });
  const ok = $('#okRule'); if (ok) ok.onclick = closeSheet;

/* =====================  Negozio, acquisti, annunci  ===================== */
function openSheet(html, sticky) {
  closeSheet();
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + (sticky ? '' : '<button class="x" id="sx" aria-label="Chiudi">✕</button>') + html + '</div>';
  document.body.appendChild(sc);
  if (!sticky) { sc.addEventListener('click', e => { if (e.target === sc) closeSheet(); }); $('#sx').onclick = closeSheet; }
}
function closeSheet() { const s = $('#scrim'); if (s) s.remove(); }
function prodRow(key, icon, feature) { const k = SKU[key]; return '<button class="prod' + (feature ? ' feature' : '') + '" data-buy="' + key + '"><span class="pi">' + icon + '</span><div><b>' + k.n + (k.tag ? '<span class="ribbon">' + k.tag + '</span>' : '') + '</b><span>' + (k.d || 'Per aggiornamenti, allenamenti e livree') + '</span></div><span class="p">' + eur(k.price) + '</span></button>'; }
function openShop(source) {
  track('shop_view', { source });
  const c = C(), live = S.starterAt && !S.starterBought && Date.now() < S.starterAt + 48 * 3600e3;
  const today = new Date().toDateString(); if (S.freeDay !== today) { S.freeDay = today; S.freeN = 0; }
  let h = '<h2>Negozio</h2><p>Hai ' + fmtCr(c.credits) + ' crediti.</p>';
  if (live) h += '<h3>Solo per poco</h3>' + prodRow('starter', '★', true);
  h += '<h3>Gratis</h3><button class="prod" id="free"' + (S.freeN < 3 ? '' : ' disabled') + '><span class="pi">▶</span><div><b>+250 crediti</b><span>Guarda un annuncio · ' + (S.freeN < 3 ? 'ancora ' + (3 - S.freeN) + ' oggi' : 'torna domani') + '</span></div><span class="p free">Gratis</span></button>';
  h += '<h3>Stagione</h3>' + (c.pass ? '<p class="outcome">Pass stagionale attivo.</p>' : prodRow('pass', 'P', true));
  h += '<h3>Crediti</h3>' + prodRow('c1', '◆') + prodRow('c2', '◆') + prodRow('c3', '◆', true) + prodRow('c4', '◆');
  h += '<h3>Senza pubblicità</h3>' + (S.noAds ? '<p class="outcome">Pubblicità già rimossa.</p>' : prodRow('noads', '✕'));
  h += '<p class="legal">Prezzi IVA inclusa. Nessun acquisto casuale: sai sempre cosa compri. Nel browser gli acquisti sono simulati.</p>';
  openSheet(h);
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy, 'shop'));
  const fr = $('#free'); if (fr && S.freeN < 3) fr.onclick = async () => { closeSheet(); if (await rewarded('free_credits')) { S.freeN++; c.credits += 250; save(); toast('+250 crediti'); } renderBox(); openShop(source); };
}
function buy(key, source) {
  const k = SKU[key], c = C();
  track('iap_click', { sku:k.id, source });
  const done = ok => {
    if (!ok) { track('iap_cancel', { sku:k.id }); return; }
    track('iap_purchase', { sku:k.id, price:k.price, source });
    if (k.cr) c.credits += k.cr;
    if (key === 'starter') { c.credits += 5000; S.starterBought = true; if (!S.unlocked.includes('#C9A227')) S.unlocked.push('#C9A227'); }
    if (key === 'pass') { c.pass = true; LIVERIES.filter(l => l.p).forEach(l => { if (!S.unlocked.includes(l.c)) S.unlocked.push(l.c); }); }
    if (key === 'noads') S.noAds = true;
    save(); toast('Acquisto completato'); renderBox();
  };
  if (window.NATIVE) { window.NATIVE.buy(k.id, !!k.cr).then(done); return; }
  openSheet('<h2>Acquisto di prova</h2><p>Nel browser non paghi nulla. Nell’app per Play Store e App Store qui si apre il pagamento dello store.</p><p><b>' + k.n + '</b> · ' + eur(k.price) + '</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary wide" id="simOk">Simula acquisto</button><button class="btn wide" id="simNo">Annulla</button></div>', true);
  $('#simOk').onclick = () => done(true);
  $('#simNo').onclick = () => { closeSheet(); done(false); };
}
function adOverlay(kind) {
  return new Promise(resolve => {
    const secs = kind === 'rewarded' ? 5 : 3;
    const el = document.createElement('div'); el.className = 'ad'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Annuncio di prova');
    el.innerHTML = '<div class="in"><p class="kicker">' + (kind === 'rewarded' ? 'Video con premio · prova' : 'Annuncio tra le gare · prova') + '</p><div class="art">Qui nell’app va in onda un annuncio AdMob</div><div class="bar"><i></i></div><button class="btn wide" id="adok" disabled>Attendi ' + secs + ' s</button>' + (kind === 'rewarded' ? '<button class="btn wide" id="adno" style="background:transparent;color:#aaa;border-color:#333">Chiudi senza premio</button>' : '') + '</div>';
    document.body.appendChild(el);
    el.querySelector('.bar i').animate([{ width:'0%' }, { width:'100%' }], { duration:secs * 1000, fill:'forwards' });
    let n = secs; const ok = el.querySelector('#adok');
    const iv = setInterval(() => { n--; if (n > 0) ok.textContent = 'Attendi ' + n + ' s'; else { clearInterval(iv); ok.disabled = false; ok.textContent = kind === 'rewarded' ? 'Ritira il premio' : 'Chiudi'; } }, 1000);
    ok.onclick = () => { el.remove(); resolve(true); };
    const no = el.querySelector('#adno'); if (no) no.onclick = () => { clearInterval(iv); el.remove(); resolve(false); };
    if (kind !== 'rewarded') track('ad_interstitial', {});
  });
}
async function rewarded(placement) {
  track('ad_rewarded_request', { placement });
  const ok = window.NATIVE ? await window.NATIVE.rewarded() : await adOverlay('rewarded');
  if (ok) track('ad_rewarded_complete', { placement });
  return ok;
}

  step:dt => step(dt), order:() => order(), startSession, closePrompt:k => closePrompt(k), boost, lateBrake, S:() => S, newCareer, draft, loadTrack, CALENDAR, refLap, simQuali, renderBox, endSession };
