<title>Muretto</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#070B16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app a schermo unico per telefono. Box (carriera a schede) / Sessione (pista a tutto schermo + HUD) / Risultati / Fine stagione.
   Look: "notte di gara", grafica TV da corsa. Asfalto blu notte, carbonio, cordoli bianco-rossi, semafori di partenza,
   colori del cronometraggio (verde = migliore personale, viola = più veloce). Un solo mondo scuro, scelto apposta. */
:root{
  --bg:#0A0E1A; --surface:#121A2C; --surface2:#1C2742; --ink:#F3F6FC; --muted:#97A3BE; --line:rgba(151,163,190,.16);
  --navy:#060912; --on-navy:#F3F6FC; --accent:#FF4B2B; --accent2:#C2290F; --on-accent:#FFFFFF;
  --cyan:#2FD4FF; --purple:#B26BFF; --kerb:#E8352A;
  --good:#2EE59D; --warn:#FF5A5F; --gold:#FFC83D;
  --soft:#FF3B3B; --med:#FFD02E; --hard:#EDEFF4; --inter:#2EC26A;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 14px 30px -18px rgba(0,0,0,.95);
  --scrim:rgba(2,4,10,.72);
  --f-display:'Exo 2','Arial Black',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-label:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:12px;
  --carbon:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 3px,transparent 3px 6px),repeating-linear-gradient(-45deg,rgba(0,0,0,.25) 0 3px,transparent 3px 6px);
  --kerbs:repeating-linear-gradient(90deg,var(--kerb) 0 18px,#F3F6FC 18px 36px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- Pagine con scorrimento ---------- */
.page{flex:1;overflow-y:auto;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.mast .wrap{padding-block:16px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.mast .stripe{position:absolute;inset:auto 0 0 0;height:6px;background:linear-gradient(90deg,var(--team) 0 60%,var(--accent) 60% 75%,var(--on-navy) 75%)}
.kicker{margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.mast h1{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:36px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.mast .sub{margin:4px 0 0;font-weight:600;font-size:13px;opacity:.85}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cr{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-family:var(--f-mono);font-weight:700;font-size:14px;white-space:nowrap;border:0;color:inherit}
.cr i{width:10px;height:10px;border-radius:2px;background:var(--gold);transform:rotate(45deg)}
.cr .plus{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:13px;font-family:var(--f-body)}
.sect{padding-block:14px 0;display:flex;flex-direction:column;gap:12px}
.h2{margin:8px 0 0;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.gp{display:grid;grid-template-columns:1fr 112px;gap:6px 14px;align-items:center}
.gp h2{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px;line-height:.95;text-transform:uppercase}
.gp .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gp svg{width:112px;height:auto;grid-row:1 / span 2;grid-column:2}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;font-weight:700;white-space:nowrap}
.chip.hot{background:var(--accent);color:var(--on-accent)}
.sessions{display:flex;flex-direction:column;margin-top:4px}
.sess{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sess .ix{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);font-family:var(--f-display);font-weight:800;font-size:16px}
.sess.done .ix{background:var(--good);color:#fff}
.sess.now .ix{background:var(--accent);color:var(--on-accent)}
.sess b{display:block;font-weight:800}
.sess small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.sess .acts{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-size:22px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.04em;min-height:56px;box-shadow:0 4px 0 var(--accent2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}
.btn.go2{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1D05}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface2);border-radius:12px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;border-radius:9px;padding:10px 8px;background:transparent;font-weight:800;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button small{font-weight:600;color:var(--muted);font-size:12px;line-height:1.3}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt.col{flex-direction:column;align-items:stretch;gap:8px}
.opt .lab{font-weight:700}
.opt .lab small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.opt.col .pills{justify-content:flex-start}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tyre{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#1b1b1b;border:3px solid var(--c);color:#fff;font-family:var(--f-mono);font-size:9px;font-weight:700;flex:none}
.go{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drv{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.drv .nm{display:flex;align-items:center;gap:8px}
.drv .nm b{font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1;text-transform:uppercase}
.no{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 5px;border-radius:6px;background:var(--team);color:#fff;font-family:var(--f-mono);font-weight:700;font-size:13px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.drv p{margin:0;font-size:12px;color:var(--muted);line-height:1.35}
.stat{display:grid;grid-template-columns:62px 1fr 26px;gap:6px;align-items:center;font-size:12px;font-weight:600}
.stat .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--ink)}
.stat .mono{text-align:right;font-size:11px}
.stat.mor .bar i{background:var(--good)}
.train{display:grid;grid-template-columns:72px 1fr 34px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-weight:700;font-size:14px}
.train:first-of-type{border-top:0}
.train .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.train .bar i{display:block;height:100%;background:var(--accent)}
.parts{display:flex;flex-direction:column}
.part{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.part:first-child{border-top:0;padding-top:0}
.part b{font-weight:800}
.part small{display:block;color:var(--muted);font-size:12px}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{width:22px;height:6px;border-radius:2px;background:var(--surface2)}
.lv i.on{background:var(--accent)}
.lv i.wip{background:repeating-linear-gradient(45deg,var(--accent) 0 3px,var(--surface2) 3px 6px)}
.mtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface2);border-radius:14px;position:sticky;top:0;z-index:5}
.mtabs button{border:0;border-radius:10px;padding:10px 4px;background:transparent;font-weight:800;font-size:14px;position:relative}
.mtabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.mtabs .dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.news{border-left:4px solid var(--gold)}.news ul{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.45}.news .linkbtn{padding-bottom:0}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0;padding-top:0}
.lrow .ico{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-family:var(--f-mono);font-size:14px}
.lrow .ico.sw2{background:var(--surface2);color:var(--muted)}
.lrow b{display:block;font-weight:800;font-size:15px}.lrow small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px;white-space:nowrap}.stars i{font-style:normal;color:var(--surface2)}
.meter{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}
.meter i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) calc(var(--f)*100%),var(--surface2) calc(var(--f)*100%))}
.wbar2{display:inline-block;width:46px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;vertical-align:1px}.wbar2 i{display:block;height:100%}
.sub2{margin:14px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lab2{font-weight:800;font-size:13px;margin-top:6px}
.warnc{color:var(--warn)}
.setsrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700;font-size:13px}
.plan[disabled]{opacity:.4}
.tut{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;max-width:540px;margin:0 auto;display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:14px;border-radius:16px;background:#F6F7FB;color:#0E1424;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 2px var(--gold);animation:pop2 .25s ease}
.tut .tav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:22px}
.tut small{display:block;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5B6479}
.tut p{margin:2px 0 8px;font-size:15px;line-height:1.4;font-weight:600}
.tut{pointer-events:none}.tut button{pointer-events:auto}
.tut.top{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
.tut .tbt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.tut .linkbtn{color:#5B6479;padding:4px 0}
.tut-hl{position:relative;z-index:2;animation:tuthl 1.1s ease-in-out infinite;outline:3px solid var(--gold);outline-offset:3px}
@keyframes tuthl{0%,100%{outline-color:rgba(255,200,61,1)}50%{outline-color:rgba(255,200,61,.25)}}
@media (prefers-reduced-motion: reduce){.tut-hl{animation:none}}
.vcard{display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,rgba(255,200,61,.16),transparent 60%),var(--surface)}
.vhead{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}.vhead b{display:block;font-family:var(--f-display);font-style:italic;font-weight:900;font-size:22px;text-transform:uppercase}.vhead small{color:var(--muted);font-size:13px}
.vleft{font-size:20px;font-weight:700;color:var(--gold)}
.vsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.vsteps span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:8px;background:var(--surface2);font-family:var(--f-label);font-weight:700;font-size:14px;color:var(--muted)}
.vsteps span i{font-style:normal;font-size:12px}.vsteps span.ok{color:var(--good)}.vsteps span.next{color:#1E1503;background:var(--gold)}
.buyrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:linear-gradient(90deg,rgba(255,200,61,.12),transparent 70%),var(--surface)}.buyrow b{display:block;font-weight:800}.buyrow small{display:block;color:var(--muted);font-size:12px;line-height:1.35}.buyrow.done{background:var(--surface)}
.radmenu .tbtns{justify-content:flex-start}.radmenu .tbtns .btn{text-align:center}
.suctl{display:grid;grid-template-columns:40px 1fr 40px 74px;gap:8px;align-items:center}
.sustep{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:22px;font-weight:700;line-height:1}
.sutrack{position:relative;height:40px;display:flex;align-items:center}
.sutrack input{position:relative;z-index:1;width:100%;margin:0;accent-color:var(--cyan);height:28px;background:transparent}
.suband{position:absolute;top:50%;height:16px;transform:translateY(-50%);border-radius:4px;background:color-mix(in srgb,var(--good) 35%,transparent);box-shadow:inset 0 0 0 1px var(--good)}
.suval{font-size:20px;font-weight:700;text-align:right;color:var(--cyan)}
.sulock{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.suband2{position:relative;height:12px;border-radius:6px;background:rgba(255,255,255,.08)}.suband2 b{position:absolute;top:0;bottom:0;border-radius:6px;background:repeating-linear-gradient(45deg,var(--good) 0 6px,color-mix(in srgb,var(--good) 55%,transparent) 6px 12px)}
.fpgo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fpgo .btn{min-height:64px;flex-direction:column;gap:2px;font-size:17px}
.fpgo .btn small{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;opacity:.75}
.tbest{color:var(--purple)!important;font-weight:700}.tgood{color:var(--good)}.tbad{color:var(--warn)}
.sunote{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.qnm{display:flex;align-items:center;gap:10px;margin-bottom:6px}.qnm b{font-family:var(--f-display);font-style:italic;font-weight:900;font-size:22px;text-transform:uppercase}
.cls tr.qnew td{animation:qnew 1.1s ease}
@keyframes qnew{0%{background:color-mix(in srgb,var(--cyan) 35%,transparent)}100%{background:transparent}}
.stratinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stratinfo .lab{display:block;font-family:var(--f-label);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stratinfo b{font-family:var(--f-display);font-style:italic;font-size:24px}
.suline{display:flex;flex-direction:column;gap:6px}.suline .suv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.suline .suv span{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:8px 10px;background:var(--surface2);border-radius:8px}
.suline .suv small{font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.suline .suv b{font-size:20px}.suline > small{color:var(--muted);font-size:12px}
.tbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.drv .tbtns{justify-content:flex-start}
.daily{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-left:4px solid var(--accent)}.daily b{display:block;font-weight:800}.daily small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:2px}
.promo{border:2px solid var(--gold);background:linear-gradient(135deg,rgba(242,184,75,.18),transparent)}.promo b{font-family:var(--f-display);font-size:22px;font-style:italic;text-transform:uppercase}
.rule{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.rule .ico{grid-row:1 / span 2;width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.rule b{font-weight:800}
.rule span{font-size:13px;color:var(--muted)}
.sponsor{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.sponsor .logo{grid-row:1 / span 2;width:46px;height:46px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:17px}
.sponsor b{font-weight:800}
.sponsor span{font-size:13px;color:var(--muted)}
.livery{display:flex;gap:10px;flex-wrap:wrap}
.livery button{position:relative;width:40px;height:40px;border-radius:10px;border:3px solid transparent;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.livery button[aria-pressed="true"]{border-color:var(--ink)}
.livery button.locked::after{content:"★";position:absolute;right:-6px;top:-8px;font-size:13px;color:var(--gold);text-shadow:0 0 2px #000}
.field{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{border:0;border-radius:999px;padding:6px 12px;background:var(--surface2);font-weight:800;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
table.std{width:100%;border-collapse:collapse;font-size:13px}
table.std td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.std td.p{width:28px;font-family:var(--f-mono);font-weight:700;color:var(--muted)}
table.std td.pt{text-align:right;font-family:var(--f-mono);font-weight:700}
table.std tr.me td{font-weight:800}
.sw{display:inline-block;width:6px;height:14px;border-radius:2px;background:var(--c);vertical-align:-2px;margin-right:8px}
.foot{height:24px}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline;padding:8px 0}
.role{display:grid;grid-template-columns:1fr;gap:10px}
.role button{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.role button b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:26px;text-transform:uppercase;line-height:1}
.role button span{color:var(--muted);font-size:14px}
.role button[aria-pressed="true"]{border-color:var(--accent);box-shadow:var(--shadow)}
.role button[aria-pressed="true"] b{color:var(--accent)}
.hero{background:var(--navy);color:var(--on-navy);position:relative;overflow:hidden}
.hero .wrap{padding-block:34px 26px}
.hero h1{margin:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:64px;line-height:.85;text-transform:uppercase}
.hero p{margin:10px 0 0;max-width:34ch;opacity:.85}
.hero .stripe{position:absolute;inset:auto 0 0 0;height:8px;background:linear-gradient(90deg,var(--accent) 0 55%,var(--gold) 55% 70%,var(--on-navy) 70%)}

/* ---------- Sessione ---------- */
.race{position:relative;flex:1;min-height:0;overflow:hidden;background:#2F6B3E;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
.race canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;color:#fff}
.hud button{pointer-events:auto}
.htop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tower{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 0;width:132px;flex:none;font-family:var(--f-mono);font-size:12px}
.tower div{display:grid;grid-template-columns:16px 4px 30px 1fr;gap:4px;align-items:center;padding:1px 7px;line-height:16px;white-space:nowrap}
.tower div.me{background:rgba(255,255,255,.16)}
.tower .ps{color:#aab;text-align:right}
.tc{width:4px;height:12px;border-radius:1px;background:var(--c);display:inline-block}
.tower .gp{color:#c8cdd8;text-align:right;font-size:11px}
.tower .pit{color:var(--gold)}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lapb{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 10px;text-align:right;line-height:1}
.lapb small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:#aab}
.lapb b{font-family:var(--f-display);font-size:26px;font-weight:800;font-style:italic}
.wx{background:rgba(10,14,24,.82);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700}
.hbtn{border:0;border-radius:10px;background:rgba(10,14,24,.82);color:#fff;padding:7px 11px;font-weight:800;font-size:12px}
.posbox{background:rgba(10,14,24,.82);border-radius:12px;padding:6px 10px;display:flex;gap:10px;align-items:center}
.pbig{line-height:1}
.pbig small{display:block;font-size:9px;font-weight:800;letter-spacing:.14em;color:#aab;text-transform:uppercase}
.pbig b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:34px}
.pbig span{font-family:var(--f-display);font-weight:700;font-size:16px;color:#aab}
.near{display:flex;flex-direction:column;gap:3px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.near div{display:flex;align-items:center;gap:6px}
.near em{font-style:normal;color:#c8cdd8;font-weight:500}
.near .lead{color:var(--gold)}
.timer{font-family:var(--f-mono);font-size:13px;line-height:1.45}
.timer b{font-size:20px}
.timer .dl.good{color:#4CC28A}.timer .dl.bad{color:#FF6B5E}
.radio{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 270px);min-width:150px;background:var(--gold);color:#1E1503;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.35);animation:pop .25s ease}
.radio small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.lights{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);display:flex;gap:10px;padding:12px 14px;background:#0B0E15;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.lights i{width:30px;height:30px;border-radius:50%;background:#2A2E38}
.lights i.on{background:#FF2B2B;box-shadow:0 0 16px #FF2B2B}
.hbot{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.drive{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end}
.spd{background:rgba(10,14,24,.82);border-radius:12px;padding:7px 12px;min-width:112px}
.spd b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:40px;line-height:.9}
.spd small{font-size:10px;font-weight:800;letter-spacing:.12em;color:#aab;margin-left:4px}
.spd .w{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;margin-top:6px}
.wbar{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.wbar i{display:block;height:100%}
.cue{justify-self:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.tag{border-radius:8px;padding:4px 10px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:17px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.tag.bad{background:#FF3B30;color:#fff}
.tag.blue{background:#3DA5FF;color:#04121F}
.tag.warn{background:#F2B84B;color:#1E1503}
.tag.good{background:#4CC28A;color:#06200F}
.late{border:0;border-radius:14px;padding:10px 16px;background:#FF3B30;color:#fff;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 0 0 4px rgba(255,59,48,.35),0 8px 20px rgba(0,0,0,.4);animation:throb .6s ease-in-out infinite}
.late small{display:block;font-family:var(--f-body);font-style:normal;font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;opacity:.9}
.ers{position:relative;overflow:hidden;width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.3);background:rgba(10,14,24,.85);color:#fff;display:grid;place-items:center;padding:0}
.ers .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(61,165,255,.45)}
.ers b{position:relative;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:18px;text-transform:uppercase}
.ers.ready{border-color:#3DA5FF;box-shadow:0 0 0 4px rgba(61,165,255,.25)}
.ers.on{border-color:#fff;background:#3DA5FF;color:#04121F}
.flash{position:absolute;left:50%;top:28%;transform:translateX(-50%);padding:8px 16px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;text-transform:uppercase;white-space:nowrap;animation:pop .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.flash.good{background:#4CC28A;color:#06200F}
.flash.bad{background:#FF6B5E;color:#2A0703;font-size:16px}
.wall{display:flex;flex-direction:column;gap:8px}
.dp{background:rgba(10,14,24,.86);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.dp .r1{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.dp .r1 b{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;line-height:1}
.dp .pos{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:22px;line-height:1}
.dp .gap{font-family:var(--f-mono);font-size:12px;color:#c8cdd8}
.dp .wear{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700}
.dp .r2{display:grid;grid-template-columns:1fr auto;gap:8px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:rgba(255,255,255,.08);border-radius:9px;padding:3px}
.modes button{border:0;border-radius:7px;background:transparent;color:#dfe3ea;padding:7px 2px;font-weight:800;font-size:12px}
.modes button[aria-pressed="true"]{background:#fff;color:#0B0E15}
.boxbtn{border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:17px;text-transform:uppercase}
.boxbtn.on{background:var(--gold);color:#1E1503}
.prompt{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(420px,calc(100% - 20px));background:#F6F3EA;color:#121826;border-radius:16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.5);pointer-events:auto;animation:pop .2s ease}
.pw .prompt{bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 90px);overflow-y:auto}
.prompt small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#B83A1B}
.prompt > b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05;margin-top:2px}
.prompt p{margin:4px 0 10px;font-size:14px;color:#3F4756}
.pbtns{display:flex;flex-direction:column;gap:6px}
.pbtns button{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:11px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(18,24,38,.1);padding:9px 12px;font-weight:800;font-size:15px;color:#121826}
.pbtns button small{display:block;font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:#59616F}
.pbtns button:last-child{background:transparent;box-shadow:0 0 0 1px rgba(18,24,38,.15)}
.ptime{height:4px;border-radius:2px;background:rgba(18,24,38,.1);margin-top:10px;overflow:hidden}
.ptime i{display:block;height:100%;background:#E8502A}
.coach{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;background:#F6F3EA;color:#121826;border-radius:18px;padding:16px;pointer-events:auto;box-shadow:0 16px 40px rgba(0,0,0,.5);z-index:5;max-height:calc(100% - 100px);overflow-y:auto}
.coach > b{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase}
.coach ol{list-style:none;margin:10px 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.coach li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;font-size:14px;line-height:1.35}
.coach .ic{width:34px;height:34px;border-radius:10px;background:#14213D;color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800;grid-auto-flow:column;gap:3px}
.coach .ln{display:block;width:5px;height:18px;border-radius:3px}
.coach .ln.g{background:#50DC82}.coach .ln.r{background:#FF5040}

.dtop{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start}
.dpos{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:4px;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.dpos b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:46px}
.dpos b.sm{font-size:30px;font-family:var(--f-mono);font-style:normal}
.dpos span{font-family:var(--f-display);font-weight:700;font-size:20px;opacity:.75}
.dpos em{grid-column:1 / -1;font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:700;opacity:.85;margin-top:4px}
.dright{display:flex;gap:8px;align-items:flex-start}
.dlap{text-align:right;line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.dlap small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.dlap b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px}
.dbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(10,14,24,.55);color:#fff;font-size:13px;font-weight:800;backdrop-filter:blur(6px)}
.dbot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end}
.dspd{line-height:1;text-shadow:0 2px 8px rgba(0,0,0,.55)}
.dspd b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:48px}
.dspd small{font-size:11px;font-weight:800;letter-spacing:.12em;opacity:.8;margin-left:4px}
.dspd .w{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;margin-top:6px}
#msg{position:absolute;left:0;right:0;top:24%;display:flex;justify-content:center;pointer-events:none}
.mpill{padding:7px 16px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:20px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop2 .22s ease}
.mpill.big{font-size:28px;padding:9px 22px}
.mpill.gold{background:#F2B84B;color:#1E1503}.mpill.good{background:#4CC28A;color:#06200F}.mpill.bad{background:#FF5A4E;color:#fff}.mpill.warn{background:#F2B84B;color:#1E1503}.mpill.blue{background:#3DA5FF;color:#04121F}
.pause{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.6);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;pointer-events:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.pause > b{font-family:var(--f-display);font-weight:800;font-size:30px;text-transform:uppercase}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;padding:6px 0;border-top:1px solid var(--line)}
.prow small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.prow .toggle{width:52px;height:30px;border-radius:999px;border:0;background:var(--surface2);position:relative;flex:none}
.prow .toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.prow .toggle[aria-pressed="true"]{background:var(--accent)}
.prow .toggle[aria-pressed="true"]::after{transform:translateX(22px)}
.pause .btn{color:var(--ink)}
.pause .btn.primary{color:#fff}
@keyframes pop2{from{transform:scale(.85);opacity:0}}

.pilot{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.feed{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.feed p{margin:0;max-width:94%;background:rgba(10,14,24,.78);border-radius:12px 12px 12px 4px;padding:6px 10px;font-size:13px;line-height:1.35;font-weight:600;backdrop-filter:blur(6px);opacity:.75}
.feed p.new{opacity:1;animation:pop2 .25s ease}
.feed p small{display:block;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#F2B84B}
.feed p.f-me{align-self:flex-end;border-radius:12px 12px 4px 12px;background:rgba(232,80,42,.85)}
.feed p.f-me small{color:#fff}
.feed p.f-warn{box-shadow:inset 3px 0 0 #FF6B5E}
.feed p.f-go{box-shadow:inset 3px 0 0 #3DA5FF}
.pctl{display:grid;grid-template-columns:86px 1fr;gap:8px;background:rgba(10,14,24,.86);border-radius:16px;padding:8px;pointer-events:auto;backdrop-filter:blur(6px)}
.drsbtn{border:2px solid rgba(255,255,255,.15);border-radius:12px;background:#1c2233;color:#8b93a6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.drsbtn b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:26px;line-height:1}
.drsbtn small{font-size:10px;font-weight:700}
.drsbtn.ready{background:#3DA5FF;border-color:#fff;color:#04121F;animation:throb .5s ease-in-out infinite}
.drsbtn.open{background:#1D8A5A;border-color:#4CC28A;color:#fff}
.pgrps{display:flex;flex-direction:column;gap:6px;min-width:0}
.plab{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#aab;margin-bottom:3px}
.plab b{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:0;text-transform:none;color:#fff}
.plab i{font-style:normal}.plab i.ok{color:#4CC28A}.plab i.warn{color:#F2B84B}.plab i.bad{color:#FF6B5E}
.pgrp .modes button{padding:8px 2px;font-size:12px}
.pd .prompt{top:calc(64px + env(safe-area-inset-top,0px));bottom:auto}

.duel{display:grid;grid-template-columns:1fr 74px;gap:8px;pointer-events:auto}
.duel.r3{grid-template-columns:1fr 74px 64px}
.radbtn{border:0;border-radius:16px;background:rgba(10,14,24,.86);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px;backdrop-filter:blur(6px)}
.radbtn small{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#F2B84B}
.radbtn[aria-expanded="true"]{background:#F2B84B;color:#1E1503}.radbtn[aria-expanded="true"] small{color:#1E1503}
#radMenu{position:relative;pointer-events:auto}
.radmenu{position:absolute;right:0;bottom:6px;display:flex;flex-direction:column;gap:6px;background:rgba(10,14,24,.94);border-radius:16px;padding:10px;min-width:220px;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:pop2 .2s ease;z-index:5}
.radmenu small{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#F2B84B;padding:0 4px}
.radmenu button{border:0;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:14px;padding:10px 12px;text-align:left}
.radmenu button:active{background:rgba(255,255,255,.2)}
.plans{display:grid;gap:8px;margin-top:6px}
.plan{border:1.5px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.04);color:inherit;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;align-items:center}
.plan b{font-size:15px}.plan small{grid-column:1/-1;font-size:12px;opacity:.75}
.plan .stints{display:flex;align-items:center;gap:4px}.plan .stints i{font-style:normal;opacity:.5;font-size:11px}
.plan[aria-pressed="true"]{border-color:#F2B84B;background:rgba(242,184,75,.12)}
.atkbtn{position:relative;overflow:hidden;border:0;border-radius:16px;min-height:64px;background:rgba(10,14,24,.86);color:#8b93a6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;backdrop-filter:blur(6px)}
.atkbtn b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.atkbtn small{font-size:12px;font-weight:700}
.atkbtn.ready{background:linear-gradient(180deg,#FF7A45,#E8502A);color:#fff;box-shadow:0 0 0 3px rgba(255,140,80,.35),0 10px 24px rgba(232,80,42,.45);animation:throb .7s ease-in-out infinite}
.atkbtn.busy{background:#F2B84B;color:#1E1503}
.atkbtn.def{background:linear-gradient(180deg,#4A8BFF,#2B59E0);color:#fff;box-shadow:0 0 0 3px rgba(120,170,255,.45);animation:throb .45s ease-in-out infinite}
.atkbar{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.85);width:0}
.batt{background:rgba(10,14,24,.86);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(6px)}
.batt small{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#aab}
.batt span{display:flex;gap:4px}
.batt i{width:12px;height:22px;border-radius:3px;background:linear-gradient(to top,#4CC28A calc(var(--f,0)*100%),rgba(255,255,255,.12) calc(var(--f,0)*100%))}
#tip{display:flex;justify-content:center}

// Chiusura dei conti dopo ogni GP: entrate, uscite, sponsor, progetti, strutture, motori, accademia.
function settleGP(c, res, prize, info) {
  const rows = [['Premi gara' + (c.pass ? ' (pass +30%)' : ''), prize]], news = [];
  for (const sp of c.sponsors) {
    rows.push([sp.n + ' · quota', sp.fee]);
    const ok = goalOk(sp.goal, res); sp.lastOk = ok; if (ok) { progress('spon'); if (sp.tier === 'bold') unlock('bold'); }
    if (ok) rows.push([sp.n + ' · ' + goalTxt(sp.goal), sp.bonus]);
    sp.sat = clamp(sp.sat + (ok ? 12 : -TIER[sp.tier].miss), 0, 100); sp.gp--;
  }
  const fc = fixedCosts(c);
  rows.push(['Stipendi piloti', -fc.drv], ['Staff', -fc.st]);
  if (fc.ac) rows.push(['Accademia', -fc.ac]);
  rows.push(['Strutture', -fc.fac]);
  const cheap = (1 - .08 * (c.staff.mech.lv - 1)) * (1 - .15 * (c.fac.fact.lv - 1)) * costMul(c);
  const rep = Math.round(res.mine.reduce((s, r) => s + 50 + (r.c.hadDmg || Math.random() < .15 ? 150 : 0) + (r.c.engBroke ? 250 : 0), 0) * cheap);
  rows.push(['Ricambi e trasferta', -rep]);
  const net = rows.reduce((s, r) => s + r[1], 0);
  c.credits += net; c.fin.inc += rows.filter(r => r[1] > 0).reduce((s, r) => s + r[1], 0); c.fin.exp -= rows.filter(r => r[1] < 0).reduce((s, r) => s + r[1], 0);
  c.fin.last = { rows, net, gp:info.gp };
  // sponsor: rinnovo o addio
  c.sponsors = c.sponsors.filter(sp => {
    if (sp.sat <= 0) { news.push(sp.n + ' ha rescisso il contratto: troppi obiettivi mancati.'); c.offers[sp.slot] = sponsorOffers(sp.slot); return false; }
    if (sp.gp <= 0) {
      if (sp.sat >= 50) { sp.gp = 6; sp.fee = Math.round(sp.fee * 1.1 / 10) * 10; news.push(sp.n + ' rinnova per altri 6 GP, con la quota alzata a ' + fmtCr(sp.fee) + '.'); return true; }
      news.push(sp.n + ' non rinnova: il contratto è finito.'); c.offers[sp.slot] = sponsorOffers(sp.slot); return false;
    }
    return true;
  });
  // progetti di sviluppo
  c.projects = c.projects.filter(p => { if (--p.gp > 0) return true; news.push(finishProject(c, p)); return false; });
  // strutture in costruzione
  for (const [k, f] of Object.entries(c.fac)) if (f.b > 0 && --f.b === 0) news.push(finishFac(c, k));
  news.push(...rivalTurn(c, res));
  // motori
  const life = c.seasonLen / engAllow(c);
  for (const r of res.mine) { const e = engOf(r.c.id); e.w += (1 + .35 * (r.c.richF || 0)) / life * (r.c.engBroke ? 1.6 : 1); if (e.w > .85) news.push('Il motore di ' + first(r.c.n) + ' è usurato al ' + Math.round(e.w * 100) + '%: rischio di guasto.'); }
  // piloti: preparatore e accademia
  mineDrivers().forEach(d => { d.mor = clamp(d.mor + c.staff.coach.lv - 2, 30, 100); });
  for (const j of c.academy) {
    const g = .18 + .05 * c.staff.coach.lv + .06 * (c.fac.sim.lv - 1);
    ['vel', 'cos', 'gom'].forEach(k => { if (j[k] < j.pot && Math.random() < g) j[k]++; });
  }
  if (c.credits < 0) news.push('Conti in rosso: niente sviluppo finché la cassa non torna positiva. Cerca sponsor o taglia i costi.');
  c.news.push(...news);
  return { rows, net, news };
}

  else h += '<button class="btn primary wide" id="okRule">Si parte</button>';
  openSheet(h, true);
  document.querySelectorAll('[data-focus]').forEach(b => b.onclick = () => { c.focus = b.dataset.focus; track('focus', { part:c.focus }); save(); renderBox(); });
  const ok = $('#okRule'); if (ok) ok.onclick = closeSheet;
}

/* =====================  Negozio, acquisti, annunci  ===================== */
function openSheet(html, sticky) {
  closeSheet();
  const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
  sc.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + (sticky ? '' : '<button class="x" id="sx" aria-label="Chiudi">✕</button>') + html + '</div>';
  document.body.appendChild(sc);
  if (!sticky) { sc.addEventListener('click', e => { if (e.target === sc) closeSheet(); }); $('#sx').onclick = closeSheet; }
}
function closeSheet() { const s = $('#scrim'); if (s) s.remove(); }
function prodRow(key, icon, feature) { const k = SKU[key]; return '<button class="prod' + (feature ? ' feature' : '') + '" data-buy="' + key + '"><span class="pi">' + icon + '</span><div><b>' + k.n + (k.tag ? '<span class="ribbon">' + k.tag + '</span>' : '') + '</b><span>' + (k.d || 'Per sviluppo, mercato, strutture e livree') + '</span></div><span class="p">' + eur(k.price) + '</span></button>'; }
function openShop(source) {
  track('shop_view', { source });
  const c = C(), live = S.starterAt && !S.starterBought && Date.now() < S.starterAt + 48 * 3600e3;
  const today = new Date().toDateString(); if (S.freeDay !== today) { S.freeDay = today; S.freeN = 0; }
  let h = '<h2>Negozio</h2><p>Hai ' + fmtCr(c.credits) + ' crediti.</p>';
  if (live) h += '<h3>Solo per poco</h3>' + prodRow('starter', '★', true);
  h += '<h3>Crediti gratis</h3>' + videoCard(c);
  h += '<h3>Stagione</h3>' + (c.pass ? '<p class="outcome">Pass stagionale attivo.</p>' : prodRow('pass', 'P', true));
  h += '<h3>Crediti</h3>' + prodRow('c1', '◆') + prodRow('c2', '◆') + prodRow('c3', '◆', true) + prodRow('c4', '◆');
  h += '<h3>Muretto Pro</h3>' + (S.pro ? '<p class="outcome">Muretto Pro attivo.</p>' : prodRow('pro', 'P+', true) + (S.noAds ? '' : prodRow('noads', '✕')));
  h += '<p class="legal">Prezzi IVA inclusa. Nessun acquisto casuale: sai sempre cosa compri. Nel browser gli acquisti sono simulati.</p>';
  openSheet(h);
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => buy(b.dataset.buy, 'shop'));
  bindVC(() => { renderBox(); openShop(source); });
}
function buy(key, source) {
  const k = SKU[key], c = C();
  track('iap_click', { sku:k.id, source });
  const done = ok => {
    if (!ok) { track('iap_cancel', { sku:k.id }); return; }
    track('iap_purchase', { sku:k.id, price:k.price, source });
    if (k.cr) c.credits += k.cr;
    if (key === 'starter') { c.credits += 3000; S.starterBought = true; if (!S.unlocked.includes('#C9A227')) S.unlocked.push('#C9A227'); }
    if (key === 'pass') { c.pass = true; LIVERIES.filter(l => l.p).forEach(l => { if (!S.unlocked.includes(l.c)) S.unlocked.push(l.c); }); }
    if (key === 'noads') S.noAds = true;
    if (key === 'pro') { S.pro = true; S.noAds = true; c.freeScout = true; }
    save(); toast('Acquisto completato'); renderBox();
  };
  if (window.NATIVE) { window.NATIVE.buy(k.id, !!k.cr).then(done); return; }
  openSheet('<h2>Acquisto di prova</h2><p>Nel browser non paghi nulla. Nell’app per Play Store e App Store qui si apre il pagamento dello store.</p><p><b>' + k.n + '</b> · ' + eur(k.price) + '</p><div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary wide" id="simOk">Simula acquisto</button><button class="btn wide" id="simNo">Annulla</button></div>', true);
  $('#simOk').onclick = () => done(true);
  $('#simNo').onclick = () => { closeSheet(); done(false); };
}
function adOverlay(kind) {
  return new Promise(resolve => {
    const secs = kind === 'rewarded' ? 5 : 3;
    const el = document.createElement('div'); el.className = 'ad'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Annuncio di prova');
    el.innerHTML = '<div class="in"><p class="kicker">' + (kind === 'rewarded' ? 'Video con premio · prova' : 'Annuncio tra le gare · prova') + '</p><div class="art">Qui nell’app va in onda un annuncio AdMob</div><div class="bar"><i></i></div><button class="btn wide" id="adok" disabled>Attendi ' + secs + ' s</button>' + (kind === 'rewarded' ? '<button class="btn wide" id="adno" style="background:transparent;color:#aaa;border-color:#333">Chiudi senza premio</button>' : '') + '</div>';
    document.body.appendChild(el);
    el.querySelector('.bar i').animate([{ width:'0%' }, { width:'100%' }], { duration:secs * 1000, fill:'forwards' });
    let n = secs; const ok = el.querySelector('#adok');
    const iv = setInterval(() => { n--; if (n > 0) ok.textContent = 'Attendi ' + n + ' s'; else { clearInterval(iv); ok.disabled = false; ok.textContent = kind === 'rewarded' ? 'Ritira il premio' : 'Chiudi'; } }, 1000);
    ok.onclick = () => { el.remove(); resolve(true); };
    const no = el.querySelector('#adno'); if (no) no.onclick = () => { clearInterval(iv); el.remove(); resolve(false); };
    if (kind !== 'rewarded') track('ad_interstitial', {});
  });
}
async function rewarded(placement) {
  track('ad_rewarded_request', { placement });
  const ok = window.NATIVE ? await window.NATIVE.rewarded() : await adOverlay('rewarded');
  if (ok) track('ad_rewarded_complete', { placement });
  return ok;
}
