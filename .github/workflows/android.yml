name: Android build

on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK preinstalled on the runner
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME"

      - name: Install dependencies
        run: npm ci

      - name: Build web and sync Android
        run: npm run sync

      - name: Prepare signing key (only if secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (test) and AAB (Play Store)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: il-procuratore-apk-di-prova
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v5
        with:
          name: il-procuratore-aab-play-store
          path: android/app/build/outputs/bundle/release/*.aab
