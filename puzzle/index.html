<title>Confetteria</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#E4EFE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: one-screen phone app — top bar, one swappable screen (bottega / partita), bottom sheets for negozio, pass, dati.
   Look: an Italian confectioner's counter — pistachio ground, cocoa ink, raspberry accent, glass jars of sugared almonds. */
:root{
  --bg:#E4EFE3; --bg2:#D2E4D0; --surface:#FBFDF8; --surface2:#EEF5EC;
  --ink:#2B1D18; --muted:#66564E; --line:rgba(43,29,24,.14);
  --accent:#B8336A; --accent2:#9C2858; --on-accent:#FFFFFF;
  --coin:#D9971C; --coin-ink:#4A3206; --good:#2C7A4B;
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(43,29,24,.26); --lid:#7C4B33; --lid-done:#B8336A;
  --shadow:0 1px 0 rgba(43,29,24,.06),0 10px 24px -14px rgba(43,29,24,.45);
  --scrim:rgba(30,20,16,.45);
  --f-display:'Shrikhand',Georgia,'Times New Roman',serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1612; --bg2:#2A1F1A; --surface:#32261F; --surface2:#3B2E26;
    --ink:#F4EBE0; --muted:#C2B0A2; --line:rgba(244,235,224,.14);
    --accent:#F0739F; --accent2:#F59AB9; --on-accent:#2B1D18;
    --coin:#F2B840; --coin-ink:#3A2604; --good:#6FCB8F;
    --glass:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.30); --lid:#A9785C; --lid-done:#F0739F;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 28px -14px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1612; --bg2:#2A1F1A; --surface:#32261F; --surface2:#3B2E26;
  --ink:#F4EBE0; --muted:#C2B0A2; --line:rgba(244,235,224,.14);
  --accent:#F0739F; --accent2:#F59AB9; --on-accent:#2B1D18;
  --coin:#F2B840; --coin-ink:#3A2604; --good:#6FCB8F;
  --glass:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.30); --lid:#A9785C; --lid-done:#F0739F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 28px -14px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{background:none;border:0;padding:0;font-family:var(--f-display);font-size:24px;color:var(--accent);line-height:1;margin-right:auto;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:800;box-shadow:var(--shadow)}
.pill svg{width:22px;height:22px;flex:none}
.pill .plus{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:14px;line-height:1;margin-left:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- Bottega (home) ---------- */
.home{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:6px 20px;scrollbar-width:none}
.home::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.eyebrow{margin:0;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--surface) 0%,var(--surface2) 100%);padding:18px 18px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.hero h1{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(32px,10vw,44px);line-height:1;color:var(--ink);white-space:nowrap}
.hero .sub{margin:4px 0 14px;color:var(--muted);font-weight:600}
.hero .mini{grid-row:1;grid-column:2;display:flex;gap:4px;align-items:flex-end;padding-bottom:4px}
.hero .btn{grid-column:1 / -1}
.tag-hard{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:10px;letter-spacing:.1em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}
.btn.big{min-height:56px;font-size:19px}
.btn.ghost{background:transparent}
.btn.coin{background:var(--coin);border-color:var(--coin);color:var(--coin-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--coin) 70%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:20px;height:20px}
.btn.wide{width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

.daily{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.daily .cal{grid-row:1 / span 3;width:58px;border-radius:12px;overflow:hidden;border:1px solid var(--line);text-align:center;background:var(--surface2)}
.daily .cal b{display:block;background:var(--accent);color:var(--on-accent);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 0}
.daily .cal span{display:block;font-size:26px;font-weight:900;padding:4px 0 2px}
.daily h3{margin:0;font-size:18px;font-weight:900}
.daily p{margin:0;color:var(--muted);font-weight:600;font-size:14px}
.daily .btn{grid-column:1 / -1;margin-top:10px}
.done-chip{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:800}

.passcard{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.passcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.passcard h3{margin:0;font-size:17px;font-weight:900}
.bar{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--coin));border-radius:inherit}
.small{font-size:13px;color:var(--muted);font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:14px;position:relative}
.tile svg{width:30px;height:30px}
.dot{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}

.offer{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;box-shadow:var(--shadow)}
.offer b{display:block;font-size:16px}
.offer span{font-size:13px;opacity:.9;font-weight:700}
.offer .price{background:var(--on-accent);color:var(--accent);padding:6px 10px;border-radius:10px;font-weight:900}
.offer svg{width:34px;height:34px}
.notice{border:1px dashed var(--accent);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.notice p{margin:0;font-weight:700}

/* ---------- Partita ---------- */
.game{flex:1;min-height:0;display:flex;flex-direction:column}
.gbar{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding-block:4px 6px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.gbar h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05}
.moves{text-align:right;line-height:1}
.moves .num{display:block;font-size:28px;font-weight:900}
.moves small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.board{flex:1;min-height:0;display:grid;align-content:center;justify-content:center;row-gap:calc(var(--slot) * .5);column-gap:0;padding-block:28px 8px;--slot:60px}
.jar{position:relative;width:var(--slot);height:var(--jarh);background:none;border:0;padding:0;display:flex;justify-content:center;transition:transform .18s ease}
.jar .glass{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:var(--jarw);height:calc(var(--jarh) - 8px);border:2px solid var(--glass-edge);border-top-width:0;border-radius:6px 6px calc(var(--jarw) * .32) calc(var(--jarw) * .32);background:linear-gradient(90deg,transparent 0 12%,rgba(255,255,255,.35) 14% 20%,transparent 24%),var(--glass)}
.jar .lid{position:absolute;left:50%;top:0;transform:translateX(-50%);width:calc(var(--jarw) + 8px);height:10px;border-radius:5px;background:var(--lid);transition:background .3s,transform .3s}
.jar .stack{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:2px}
.jar.sel{transform:translateY(-12px)}
.jar.sel .glass{border-color:var(--accent)}
.jar.done .lid{background:var(--lid-done);transform:translateX(-50%) scaleX(1.06)}
.jar.done .glass{border-color:color-mix(in srgb,var(--lid-done) 60%,var(--glass-edge))}
.jar.hint-from .glass,.jar.hint-to .glass{border-color:var(--coin);box-shadow:0 0 0 4px color-mix(in srgb,var(--coin) 35%,transparent)}
.jar.hint-to::after{content:"";position:absolute;top:-22px;left:50%;width:0;height:0;border:8px solid transparent;border-top-color:var(--coin);transform:translateX(-50%);animation:bob .8s ease-in-out infinite}
.jar.shake{animation:shake .32s}
.jar.pop .stack{animation:pop .45s ease}
.pc{display:grid;place-items:center;width:var(--pw);height:var(--ph);border-radius:50%;background:radial-gradient(ellipse at 34% 28%,rgba(255,255,255,.8) 0 14%,rgba(255,255,255,0) 42%),var(--c);border:1px solid rgba(0,0,0,.2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.13);font-size:calc(var(--ph) * .46);line-height:1;color:rgba(0,0,0,.34);font-weight:900;transition:transform .16s ease}
.pc.dk{color:rgba(255,255,255,.6)}
.pc.lift{transform:translateY(-14px)}
.tip{min-height:42px;margin:0;padding:6px 4px 0;text-align:center;color:var(--muted);font-weight:700;font-size:14px;text-wrap:balance}
.tip.warn{color:var(--accent)}
.boosters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-block:6px 12px}
.bst{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);font-weight:800;font-size:12px}
.bst svg{width:26px;height:26px}
.bst[disabled]{opacity:.45}
.badge{position:absolute;top:-7px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.badge.get{background:var(--coin);color:var(--coin-ink);font-size:13px}

/* ---------- Sheets, ad, toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px -10px rgba(0,0,0,.4);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;text-wrap:balance}
.sheet h3{margin:16px 0 8px;font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0 0 10px}
.sheet .x{float:right;margin:-2px -6px 0 0}
.stack-v{display:flex;flex-direction:column;gap:10px}
.prod{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);text-align:left;width:100%}
.prod svg{width:40px;height:40px}
.prod b{display:block;font-size:16px}
.prod span{font-size:13px;color:var(--muted);font-weight:700}
.prod .p{min-width:78px;text-align:center;padding:8px 10px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:900}
.prod .p.c{background:var(--coin);color:var(--coin-ink)}
.prod .ribbon{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--coin);color:var(--coin-ink);font-size:11px;font-weight:900;vertical-align:2px}
.prod.feature{border:2px solid var(--accent)}
.prod[disabled]{opacity:.5}
.legal{font-size:12px;color:var(--muted);margin-top:14px}
.win{text-align:center}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars svg{width:46px;height:46px}
.stars .off{opacity:.2}
.reward{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:900;margin:6px 0 14px}
.reward svg{width:28px;height:28px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 14px}
.week div{border-radius:10px;border:1px solid var(--line);background:var(--surface2);padding:8px 0 6px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.week div b{display:block;font-size:14px;color:var(--ink)}
.week .got{background:var(--bg2);opacity:.6}
.week .now{border:2px solid var(--accent);background:var(--surface);color:var(--accent)}
.tier{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tier .n{font-weight:900;font-size:18px;text-align:center}
.tier.reached .n{color:var(--accent)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:800;min-height:46px}
.rw.prem{background:color-mix(in srgb,var(--coin) 16%,var(--surface2))}
.rw button{border:0;border-radius:9px;padding:6px 10px;background:var(--accent);color:var(--on-accent);font-weight:900;font-size:12px}
.rw .ok{color:var(--good)}
.rw .lock{opacity:.55}
.thead{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.kpi b{font-size:20px;font-weight:900}
.log{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.log table{width:100%;border-collapse:collapse;font-size:12px}
.log td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.log td:last-child{white-space:normal;color:var(--muted);min-width:140px}
.switch{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font-weight:800}
.copybox{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;padding:10px}

.ad{position:fixed;inset:0;z-index:40;background:#111;color:#f5f5f5;display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.ad-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.ad-card .eyebrow{color:#bbb}
.ad-art{aspect-ratio:9/12;max-width:100%;border-radius:18px;background:repeating-linear-gradient(45deg,#262626 0 14px,#1c1c1c 14px 28px);display:grid;place-items:center;font-weight:800;color:#9a9a9a;font-size:15px;padding:20px}
.ad-bar{height:6px;background:#333;border-radius:3px;overflow:hidden}
.ad-bar i{display:block;height:100%;width:0;background:#f5f5f5}
.ad .btn{background:#f5f5f5;color:#111;border-color:#f5f5f5}
.ad p{margin:0;color:#bbb;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;box-shadow:var(--shadow);animation:fade .2s ease;max-width:calc(100% - 32px);text-align:center}

@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes pop{40%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
@keyframes bob{50%{transform:translate(-50%,4px)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){.hero .mini{display:none}.tiles{gap:6px}}
</style>

<div id="app">
  <header class="top">
    <button class="brand" id="brand" aria-label="Torna alla bottega">Confetteria</button>
    <button class="pill" id="streakPill" aria-label="Serie della sfida del giorno"></button>
    <button class="pill" id="coinPill" aria-label="Monete, apri il negozio"></button>
  </header>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(() => {
'use strict';

/* =====================  Config  ===================== */
const CAP = 4;
const COLORS = [
  { n:'rosa',       v:'#F49AC1', s:'♥' },
  { n:'celeste',    v:'#8CC8F0', s:'●' },
  { n:'bianco',     v:'#FBF8F1', s:'✿' },
  { n:'giallo',     v:'#F6D55C', s:'★' },
  { n:'menta',      v:'#93DDBA', s:'◆' },
  { n:'lilla',      v:'#B9A0EA', s:'▲' },
  { n:'arancio',    v:'#F5A15B', s:'■' },
  { n:'rosso',      v:'#E0504B', s:'✚', d:1 },
  { n:'blu',        v:'#4170D6', s:'☾', d:1 },
  { n:'cioccolato', v:'#7C4B33', s:'♣', d:1 },
  { n:'verde',      v:'#3E9B57', s:'✦', d:1 }
];
// ID prodotto da creare uguali in Play Console / App Store Connect.
const SKU = {
  starter: { id:'starter_pack', price:1.99, give:{ coins:1500, hints:5, jars:3 } },
  noads:   { id:'remove_ads',   price:4.99 },
  pass:    { id:'season_pass',  price:4.99 },
  c300:    { id:'coins_300',    price:0.99,  give:{ coins:300 } },
  c1800:   { id:'coins_1800',   price:4.99,  give:{ coins:1800 }, tag:'+20%' },
  c4000:   { id:'coins_4000',   price:9.99,  give:{ coins:4000 }, tag:'Il più scelto' },
  c9000:   { id:'coins_9000',   price:19.99, give:{ coins:9000 }, tag:'+50%' }
};
const COST = { hint:40, jar:100 };            // prezzo in monete di un suggerimento / barattolo
const ECPM = { rewarded:18, inter:9 };       // $ per 1000 impression, stima Tier-1 per il calcolo ricavi di prova
const STORE_CUT = 0.15;                      // commissione store per sviluppatori sotto 1M $/anno
const INTER = { fromLevel:11, gapMs:180000, everyLevels:3 };

function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  for (let i = 0; i < ts.length; i++) {

    const run = topRun(a), mono = run === a.length;
    for (let j = 0; j < ts.length; j++) {
      if (!canMove(ts, i, j)) continue;
      const b = ts[j];
      if (!b.length) { if (mono || j !== firstEmpty) continue; }
      const cnt = Math.min(run, CAP - b.length);
      let score = 0;
      if (b.length) score += 2;
      if (b.length + cnt === CAP && (!b.length || b.every(c => c === a[a.length-1]))) score += 3;

}
function makeLevel(nc, ne, seed) {
  let best = null;
  for (let a = 0; a < 40; a++) {
    const r = rng(seed * 7919 + a * 104729 + 17), pool = [];
    for (let c = 0; c < nc; c++) for (let k = 0; k < CAP; k++) pool.push(c);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    // colori casuali dalla tavolozza, così i livelli non sono sempre rosa-celeste-bianco
    const pal = COLORS.map((_, i) => i); for (let i = pal.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pal[i], pal[j]] = [pal[j], pal[i]]; }

    if (ts.some(t => isFull(t)) || ts.some(t => t.length && topRun(t) >= 3)) continue;
    const sol = solve(ts, 120000);

function bootDay() {
  const d = today();
  S.stats.sessions++;
  if (!S.stats.days.includes(d)) S.stats.days.push(d);
  if (S.stats.days.length > 400) S.stats.days.shift();
  // regalo giornaliero: serie di accessi consecutivi
  if (S.login.last !== d) {
    S.login.streak = S.login.last && dayIndex(d) - dayIndex(S.login.last) === 1 ? S.login.streak + 1 : 1;
    S.login.last = d;
  }
  const idx = seasonIndex();
  if (S.pass.season !== idx) { S.pass = { season:idx, xp:0, premium:false, free:[], prem:[] }; }
  track('session_start', { session:S.stats.sessions, day:S.stats.days.length, level:S.level });
}

const SEASON_NAMES = ['Pistacchio','Nocciola','Amarena','Limone','Cannella','Mandorla'];

const giftPending = () => S.login.claimed !== today();
function dailyStatus() {
  const d = today(), last = S.daily.last;
  const done = last === d;
  const gap = last ? dayIndex(d) - dayIndex(last) : null;
  const alive = done || gap === 1;                                      // serie ancora valida se giochi oggi
  const savable = !done && gap === 2 && S.daily.streak >= 2 && S.daily.saved !== d;
  return { done, alive, savable, streak: alive ? S.daily.streak : 0 };
}
const dailySeed = () => Number(today().replace(/-/g, ''));
function starterActive() { return S.starter.unlockAt && !S.starter.bought && Date.now() < S.starter.unlockAt + 48 * 3600e3; }
function starterLeft() {
  const ms = S.starter.unlockAt + 48 * 3600e3 - Date.now(), h = Math.floor(ms / 3600e3), m = Math.floor(ms % 3600e3 / 60e3);
  return h + ' h ' + String(m).padStart(2,'0') + ' min';
}
function passTier() { return Math.min(TIERS, Math.floor(S.pass.xp / XP_TIER)); }
function passReward(track, tier) {
  if (track === 'free') return tier % 5 === 0 ? { hints:2 } : { coins:20 + tier * 5 };
  if (tier === TIERS) return { coins:1500, jars:3 };
  return tier % 4 === 0 ? { jars:1, hints:1 } : { coins:60 + tier * 10 };
}

function prodRow(key, icon, title, sub, feature) {
  const sku = SKU[key];
  return '<button class="prod' + (feature ? ' feature' : '') + '" data-buy="' + key + '">' + icon + '<div><b>' + title + (sku.tag ? '<span class="ribbon">' + sku.tag + '</span>' : '') + '</b><span>' + sub + '</span></div><span class="p num">' + eur(sku.price) + '</span></button>';
}
function openShop(source) {
  track('shop_view', { source });
  const d = today(); if (S.ads.coinDay !== d) { S.ads.coinDay = d; S.ads.coinCount = 0; }
  const adsLeft = FREE_COIN_ADS - S.ads.coinCount;
  let html = '<h2>Negozio</h2><p class="small">Hai ' + fmt(S.coins) + ' monete, ' + S.hints + ' suggerimenti e ' + S.jars + ' barattoli extra.</p>';
  if (starterActive()) html += '<h3>Solo per poco</h3>' + prodRow('starter', I.gift, 'Pacchetto di benvenuto', giveText(SKU.starter.give) + ' · scade tra ' + starterLeft(), true);
  html += '<h3>Gratis</h3><button class="prod" id="freeCoins"' + (adsLeft > 0 ? '' : ' disabled') + '>' + I.play + '<div><b>+40 monete</b><span>Guarda un annuncio · ' + (adsLeft > 0 ? 'ancora ' + adsLeft + ' oggi' : 'torna domani') + '</span></div><span class="p c">Gratis</span></button>';
  html += '<h3>Aiuti con le monete</h3><div class="stack-v">' +
    '<button class="prod" id="cHint">' + I.bulb + '<div><b>3 suggerimenti</b><span>Ti mostrano la mossa giusta</span></div><span class="p c num">' + fmt(COST.hint * 3) + '</span></button>' +
    '<button class="prod" id="cJar">' + I.jar + '<div><b>1 barattolo extra</b><span>Un barattolo vuoto in più per un livello</span></div><span class="p c num">' + fmt(COST.jar) + '</span></button></div>';
  html += '<h3>Monete</h3><div class="stack-v">' +
    prodRow('c300', I.coin, '300 monete', 'Una manciata') +
    prodRow('c1800', I.coin, '1.800 monete', 'Un sacchetto') +
    prodRow('c4000', I.coin, '4.000 monete', 'Una scatola', true) +
    prodRow('c9000', I.coin, '9.000 monete', 'Un vassoio da pasticceria') + '</div>';
  html += '<h3>Senza pubblicità</h3>' + (S.noAds ? '<p class="done-chip">Pubblicità a schermo intero già rimossa</p>' : prodRow('noads', I.noads, 'Rimuovi la pubblicità', 'Via gli annunci tra un livello e l’altro. I video con premio restano, se li vuoi.'));
  html += '<p class="legal">Prezzi IVA inclusa. Nessun acquisto casuale: sai sempre cosa compri. Nel browser gli acquisti sono simulati.</p>';
  openSheet(html);
  document.querySelectorAll('[data-buy]').forEach(b => b.onclick = async () => { const k = b.dataset.buy; closeSheet(true); await buy(k, 'shop'); if (screen === 'home') goHome(); else updateBar(); });
  const fc = $('#freeCoins'); if (fc && adsLeft > 0) fc.onclick = async () => {
    closeSheet(true);
    if (await showRewarded('free_coins')) { S.ads.coinCount++; grant({ coins:40 }); toast('+40 monete'); }
    openShop(source);
  };
  const spend = (cost, give, item) => {
    if (S.coins < cost) { toast('Ti mancano ' + fmt(cost - S.coins) + ' monete'); return; }
    S.coins -= cost; grant(give); track('coins_spend', { item, amount:cost }); toast('Fatto: ' + giveText(give)); openShop(source); if (screen === 'game') updateBar();
  };
  $('#cHint').onclick = () => spend(COST.hint * 3, { hints:3 }, 'hint');
  $('#cJar').onclick = () => spend(COST.jar, { jars:1 }, 'jar');
}
function openPass() {
  track('pass_view', { tier:passTier(), premium:S.pass.premium });
  const t = passTier();
  let html = '<h2>Stagione ' + seasonName() + '</h2><p class="small">Livello pass ' + t + ' di ' + TIERS + ' · ' + S.pass.xp + ' XP · finisce tra ' + seasonDaysLeft() + ' giorni. Ogni livello vale 20 XP (30 con tre stelle), la sfida del giorno 60.</p>';
  if (!S.pass.premium) html += '<div class="stack-v">' + prodRow('pass', I.ticket, 'Pass Premium', 'Sblocca la colonna dorata: circa 4.000 monete, 5 barattoli e 5 suggerimenti in tutto', true) + '</div>';
  html += '<h3>Premi</h3><div class="thead"><span></span><span>Gratis</span><span>Premium</span></div>';
  for (let i = 1; i <= TIERS; i++) {
    const reached = i <= t;
    const cell = (track, list) => {
      const g = passReward(track, i), has = list.includes(i), locked = track === 'prem' && !S.pass.premium;
      let act;
      if (has) act = '<span class="ok">Preso</span>';
      else if (locked) act = '<span class="lock">' + I.lock + '</span>';
      else if (reached) act = '<button data-claim="' + track + ':' + i + '">Ritira</button>';
      else act = '';
      return '<div class="rw' + (track === 'prem' ? ' prem' : '') + '"><span>' + giveText(g) + '</span>' + act + '</div>';
    };
    html += '<div class="tier' + (reached ? ' reached' : '') + '"><span class="n num">' + i + '</span>' + cell('free', S.pass.free) + cell('prem', S.pass.prem) + '</div>';
  }
  openSheet(html, () => { if (screen === 'home') goHome(); });
  document.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => {
    const [tr, n] = b.dataset.claim.split(':'), tier = +n;
    const list = tr === 'free' ? S.pass.free : S.pass.prem;
    if (list.includes(tier)) return;
    list.push(tier); const g = passReward(tr, tier); grant(g);
    track('pass_claim', { track:tr, tier }); toast('+' + giveText(g));
    b.outerHTML = '<span class="ok">Preso</span>';
  });
  const pb = document.querySelector('[data-buy="pass"]'); if (pb) pb.onclick = async () => { closeSheet(true); await buy('pass', 'pass'); openPass(); };
}
function openGift() {
  const pending = giftPending(), streak = S.login.streak, day = ((streak - 1) % 7) + 1, g = giftFor(streak);
  let week = '';
  for (let k = 1; k <= 7; k++) {
    const gg = k === 7 ? { coins:200, jars:1 } : { coins:20 + k * 10 };
    const cls = k < day || (k === day && !pending) ? 'got' : k === day ? 'now' : '';
    week += '<div class="' + cls + '">G' + k + '<b class="num">' + gg.coins + '</b>' + (gg.jars ? '+🫙' : 'monete') + '</div>';
  }
  week = week.replace('+🫙', '+1 bar.');
  const html = '<h2>Regalo del giorno</h2><p>' + (pending ? 'Giorno ' + day + ' di 7. Torna ogni giorno: il regalo cresce e al settimo arriva un barattolo extra.' : 'Già ritirato oggi. Domani c’è il giorno ' + ((day % 7) + 1) + '.') + '</p>' +
    '<div class="week">' + week + '</div>' +
    (pending ? '<div class="stack-v"><button class="btn primary big wide" id="gTake">Ritira ' + giveText(g) + '</button><button class="btn coin wide" id="gDbl">' + I.play + 'Raddoppia con un annuncio</button></div>' : '<p class="small">Accessi consecutivi: ' + streak + '</p>');
  openSheet(html, () => { if (screen === 'home') goHome(); });
  const take = mult => { S.login.claimed = today(); grant({ coins:(g.coins || 0) * mult, jars:g.jars || 0 }); track('daily_gift', { day, streak, doubled:mult > 1 }); toast('+' + giveText({ coins:(g.coins || 0) * mult, jars:g.jars })); closeSheet(true); if (screen === 'home') goHome(); };
  const t1 = $('#gTake'); if (t1) t1.onclick = () => take(1);
  const t2 = $('#gDbl'); if (t2) t2.onclick = async () => { closeSheet(true); if (await showRewarded('gift_double')) take(2); else openGift(); };
}
function openStats() {
  const st = S.stats, days = Math.max(1, st.days.length);
  const adsRev = (st.rewarded * ECPM.rewarded + st.inter * ECPM.inter) / 1000;
  const iapNet = st.iapGross * (1 - STORE_CUT);
  const ev = S.events.slice(-30).reverse();
  const evRows = ev.map(e => { const d = new Date(e.t); return '<tr><td class="num">' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + '</td><td><b>' + e.n + '</b></td><td>' + Object.entries(e.p).map(([k, v]) => k + '=' + v).join(' · ') + '</td></tr>'; }).join('');
  const html = '<h2>Dati di prova</h2><p class="small">Le metriche del soft launch, calcolate su questo dispositivo. Nell’app vera gli stessi eventi vanno a Firebase o GameAnalytics.</p>' +
    '<div class="kpis">' +
      '<div class="kpi"><span>Sessioni</span><b class="num">' + st.sessions + '</b></div>' +
      '<div class="kpi"><span>Giorni attivi</span><b class="num">' + st.days.length + '</b></div>' +
      '<div class="kpi"><span>Livelli completati</span><b class="num">' + st.levels + '</b></div>' +
      '<div class="kpi"><span>Minuti di gioco</span><b class="num">' + Math.round(st.playMs / 60000) + '</b></div>' +
      '<div class="kpi"><span>Video con premio</span><b class="num">' + st.rewarded + '</b></div>' +
      '<div class="kpi"><span>Annunci tra livelli</span><b class="num">' + st.inter + '</b></div>' +
      '<div class="kpi"><span>Acquisti simulati</span><b class="num">' + st.iapCount + ' · ' + eur(st.iapGross) + '</b></div>' +
      '<div class="kpi"><span>ARPDAU stimato</span><b class="num">' + usd((adsRev + iapNet * 1.08) / days) + '</b></div>' +
    '</div>' +
    '<p class="legal">Stima: video con premio a ' + ECPM.rewarded + ' $ e annunci tra livelli a ' + ECPM.inter + ' $ ogni 1.000 visualizzazioni (eCPM Tier-1 indicativo), acquisti al netto del 15% dello store. Pubblicità ' + usd(adsRev) + ' · acquisti netti ' + eur(iapNet) + '.</p>' +
    '<h3>Ultimi eventi</h3><div class="log"><table><tbody>' + (evRows || '<tr><td>Nessun evento</td></tr>') + '</tbody></table></div>' +
    '<h3>Impostazioni</h3><div class="switch"><span>Suoni</span><button class="btn" id="sndT">' + (S.sound ? 'Attivi' : 'Spenti') + '</button></div>' +
    '<div class="switch"><span>Ricomincia da zero</span><button class="btn" id="reset">Azzera progressi</button></div>';
  openSheet(html);
  $('#sndT').onclick = e => { S.sound = !S.sound; e.target.textContent = S.sound ? 'Attivi' : 'Spenti'; save(); };
  $('#reset').onclick = e => {
    if (e.target.dataset.armed) { try { localStorage.removeItem(SAVE_KEY); } catch (x) {} S = fresh(); bootDay(); closeSheet(true); goHome(); toast('Progressi azzerati'); return; }
    e.target.dataset.armed = '1'; e.target.textContent = 'Tocca ancora per confermare';
  };
}

/* =====================  Avvio  ===================== */
setInterval(() => { if (screen === 'game' && document.visibilityState === 'visible' && G && !G.won) { S.stats.playMs += 5000; save(); } }, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { track('session_pause', { screen }); saveNow(); } });
let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (screen === 'game') drawBoard(); }, 120); });

bootDay();
goHome();
if (giftPending()) setTimeout(openGift, 350);
})();
</script>
