<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Casa in Ordine</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5543A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Ricette, menù della settimana, lista della spesa e bollette della famiglia.">
<style>
/* Una colonna larga quanto un telefono: intestazione, contenuto che scorre, barra delle schede in basso.
   Tono: cucina di casa — carta color crema, terracotta, verde oliva. */
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --surface2:#EFE8DA; --ink:#2B2620; --muted:#6F665A; --line:rgba(43,38,32,.12);
  --accent:#B5543A; --accent-ink:#FFFFFF; --accent-soft:rgba(181,84,58,.12);
  --olive:#5E6B3A; --olive-soft:rgba(94,107,58,.14);
  --warn:#9A6212; --warn-soft:rgba(183,121,31,.15); --bad:#B23A2E; --bad-soft:rgba(178,58,46,.12); --good:#3F7A4A; --good-soft:rgba(63,122,74,.13);
  --shadow:0 1px 0 rgba(43,38,32,.04),0 8px 22px -14px rgba(43,38,32,.35);
  --r:14px; --nav:64px;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-title:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1815; --surface:#25211D; --surface2:#302A24; --ink:#F1EADF; --muted:#A99F92; --line:rgba(241,234,223,.12);
    --accent:#DE7E61; --accent-ink:#1B1815; --accent-soft:rgba(222,126,97,.16);
    --olive:#A9B77A; --olive-soft:rgba(169,183,122,.15);
    --warn:#E5AE55; --warn-soft:rgba(229,174,85,.15); --bad:#EC7B6D; --bad-soft:rgba(236,123,109,.15); --good:#86BE91; --good-soft:rgba(134,190,145,.15);
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1815; --surface:#25211D; --surface2:#302A24; --ink:#F1EADF; --muted:#A99F92; --line:rgba(241,234,223,.12);
  --accent:#DE7E61; --accent-ink:#1B1815; --accent-soft:rgba(222,126,97,.16);
  --olive:#A9B77A; --olive-soft:rgba(169,183,122,.15);
  --warn:#E5AE55; --warn-soft:rgba(229,174,85,.15); --bad:#EC7B6D; --bad-soft:rgba(236,123,109,.15); --good:#86BE91; --good-soft:rgba(134,190,145,.15);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 24px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}

.app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-family:var(--f-title);font-weight:600;font-size:28px;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{display:flex;gap:6px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;line-height:17px;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:active,.btn:active{transform:scale(.97)}
.top .icon-btn{background:var(--surface);box-shadow:var(--shadow)}
.top .btn{box-shadow:var(--shadow)}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}

.hello{font-size:15px;color:var(--muted);margin:2px 0 14px;text-transform:capitalize}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.card h2,.sec-t{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-t{margin:20px 2px 8px}
.empty-s{color:var(--muted);margin:6px 0 2px;font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.stat .l{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12.5px;color:var(--muted)}

/* righe */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.card .row:first-of-type{border-top:0}
.list>.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:44px}
.emo{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;font-size:13.5px;color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.st-bad{color:var(--bad)!important;font-weight:600}
.st-warn{color:var(--warn)!important;font-weight:600}
.st-good{color:var(--good)!important;font-weight:600}
.pill{min-height:36px;padding:0 12px;border-radius:18px;font-size:14px;font-weight:600;background:var(--good-soft);color:var(--good);display:inline-flex;align-items:center;gap:4px;flex:none}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:2px 14px}

/* oggi a tavola */
.meals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.meal{background:var(--surface2);border-radius:12px;padding:10px 12px;text-align:left;min-height:64px}
.meal span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.meal b{display:block;font-weight:600;margin-top:2px}
.meal b.none{color:var(--muted);font-weight:500}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ricette */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px 0 40px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rgrid{display:grid;gap:10px}
.rcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;position:relative}
.rcard h3{font-family:var(--f-title);font-size:19px;font-weight:600;margin:0 28px 4px 0;line-height:1.25}
.rcard .meta{font-size:13.5px;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rcard .meta span{display:inline-flex;align-items:center;gap:4px}
.rcard .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rcard .fav{position:absolute;top:14px;right:14px;color:var(--accent)}
.fav-on{fill:currentColor}

/* menù */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav b{font-size:16px;text-align:center}
.weeknav .icon-btn{background:var(--surface);box-shadow:var(--shadow)}
.day{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 12px 12px;margin-bottom:10px}
.day.today{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.day-h{font-weight:700;font-size:14px;margin:0 2px 8px;text-transform:capitalize;display:flex;justify-content:space-between}
.day-h em{font-style:normal;color:var(--accent);font-size:12.5px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{text-align:left;background:var(--surface2);border-radius:10px;padding:8px 10px;min-height:54px}
.slot span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.slot b{display:block;font-weight:600;font-size:14.5px;line-height:1.25;margin-top:1px}
.slot b.none{color:var(--muted);font-weight:500}
.slot.has-r b{color:var(--accent)}
.hint{font-size:13.5px;color:var(--muted);text-align:center;margin:8px 0 0}

/* spesa */
.quick{display:flex;gap:8px;margin-bottom:6px}
.quick input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.aisle h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.aisle h3 span{margin-left:auto;font-weight:600;letter-spacing:0}
.item{display:flex;align-items:center;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.check{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:50px;text-align:left}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.item.done .box{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.iname{flex:1;min-width:0}
.iqty{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .iname{text-decoration:line-through;color:var(--muted)}
.item .icon-btn{color:var(--muted);width:40px}
.shop-foot{display:flex;gap:8px;margin-top:16px}

/* bollette */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.bar-row .n{font-size:14.5px}
.bar-row .a{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.bar{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--olive)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;margin-top:8px}
.months div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.months i{display:block;width:100%;max-width:18px;border-radius:4px 4px 0 0;background:var(--accent);min-height:2px}
.months i.zero{background:var(--surface2)}
.months span{font-size:10.5px;color:var(--muted)}
.months div.cur span{color:var(--ink);font-weight:700}

/* fogli (bottom sheet) */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(20,16,12,.45);animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sh-h{display:flex;align-items:flex-start;gap:8px;position:sticky;top:-6px;background:var(--bg);padding:6px 0 8px;z-index:1}
.sh-h h2{flex:1;margin:6px 0 0;font-family:var(--f-title);font-weight:600;font-size:23px;line-height:1.2}
.sh-h .icon-btn{margin-right:-8px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}

.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 2px 6px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:11px 14px}
.field textarea{min-height:120px;resize:vertical;line-height:1.45}
.field small{display:block;font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.switch span b{display:block;font-weight:600}
.switch span small{color:var(--muted);font-size:13px}
.actions{display:grid;gap:10px;margin-top:8px}
.actions.two-c{grid-template-columns:1fr 1fr}
.adv{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.adv summary{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-height:28px;display:flex;align-items:center}
.tour{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.tour[hidden]{display:none}
.tour-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.tour-top{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;min-height:48px}
.tour-top .sp{width:44px}
.tour-top .link{justify-self:end}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{width:22px;background:var(--accent)}
.dots i.past{background:var(--accent-soft)}
.tour-body{flex:1;padding:14px 0 18px}
.tour-body h1{font-family:var(--f-title);font-weight:600;font-size:34px;line-height:1.15;margin:8px 0 12px;text-wrap:balance}
.tour-body h2{font-family:var(--f-title);font-weight:600;font-size:28px;line-height:1.2;margin:6px 0 8px;text-wrap:balance}
.tour-body .lead{font-size:16.5px;color:var(--muted);margin:0 0 18px}
.tour-hero{font-size:72px;margin-top:28px;line-height:1}
.tour-foot{display:grid;gap:10px}
.tour-time{margin:-4px 0 12px 54px}
.mod{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.mod[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mod .rt small{white-space:normal}
.mod .tick{width:26px;height:26px;border-radius:13px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.mod[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cmp{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
.cmp th,.cmp td{padding:10px 12px;border-top:1px solid var(--line);text-align:left;font-size:14.5px;vertical-align:middle}
.cmp th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.cmp .c{text-align:center;width:68px;font-weight:700}
.muted{color:var(--muted)}
.pbadge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:10px;background:var(--olive-soft);color:var(--olive);margin-left:4px;vertical-align:middle;text-transform:none}
.plist{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:10px}
.plist li{display:flex;gap:8px;align-items:flex-start}
.plist .ic{color:var(--good);margin-top:2px}
.idea{display:block;width:100%;text-align:left;margin-top:10px;background:var(--olive-soft);border-radius:12px;padding:10px 12px}
.idea span{display:block;font-size:12.5px;color:var(--olive);font-weight:700}
.idea b{display:block;font-weight:600;margin-top:2px}
.plan-btn{margin-bottom:12px}
.plan-row{gap:8px}
.plan-row .rt small{display:block;font-size:12.5px;color:var(--muted);text-transform:capitalize}
.plan-row .rt small+b+small{text-transform:none}
.stats.one{grid-template-columns:1fr}
.chip.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.chk input{accent-color:var(--accent)}
.rem-q{margin:2px 0 0}
.rem-q .mic{background:var(--surface2);padding:0 12px}
.rem-q .mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite ease-in-out}
.rem-prev{text-align:left;margin:6px 2px 4px;min-height:1.2em}
.item .iname small{display:block;font-size:13px;color:var(--muted)}
.item.done .iname small{text-decoration:none}
.actions.three-c{grid-template-columns:repeat(3,1fr)}
.actions.three-c .btn{padding:0 8px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.r-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:0 0 14px}
.r-meta span{display:inline-flex;align-items:center;gap:5px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:4px 4px 4px 14px;margin-bottom:14px;border:1px solid var(--line)}
.stepper b{font-weight:600}
.stepper div{display:flex;align-items:center;gap:4px}
.stepper output{min-width:28px;text-align:center;font-weight:700;font-size:17px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface2);font-size:20px;font-weight:600}
.ing{list-style:none;padding:0;margin:0 0 18px;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.ing li{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing li b{min-width:72px;font-variant-numeric:tabular-nums;color:var(--accent)}
.steps{padding-left:22px;margin:0 0 18px}
.steps li{margin-bottom:10px;line-height:1.5}
.note{background:var(--olive-soft);border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:15px;white-space:pre-wrap}
.h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 2px 8px}
.pick-day{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pick-day:first-child{border-top:0}
.pick-day span{text-transform:capitalize;font-weight:600}
.pick-day small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big-amt{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.kv{background:var(--surface);border-radius:12px;border:1px solid var(--line);margin-bottom:16px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;white-space:pre-wrap}

.empty{text-align:center;padding:36px 16px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty p{margin:0 0 16px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;font-size:15px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast[hidden]{display:none}
.toast button{color:var(--accent);font-weight:700;padding:6px 8px;filter:brightness(1.25)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:360px){.top h1{font-size:24px}.stat .v{font-size:19px}}
/* aggiunte: ricettario, frigo, assistente, conti */
.nav-in{grid-template-columns:repeat(6,1fr)}
.nav button{font-size:11px}
.stat{text-align:left;width:100%;display:block}
button.stat:active{transform:scale(.98)}
.stats.three{grid-template-columns:repeat(3,1fr);gap:8px}

.tag.nap{background:var(--accent-soft);color:var(--accent)}
.tag.mine{background:var(--olive-soft);color:var(--olive)}
.tag.ai{background:var(--olive-soft);color:var(--olive)}
.count{font-size:13px;color:var(--muted);margin:0 2px 8px}
.chipline.fridge{margin:4px 0 10px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:6px 10px;background:var(--ink);color:var(--bg)}
.sugg{font-size:13.5px;padding:6px 10px;background:var(--surface);border:1px solid var(--line)}
.ic.xs{width:14px;height:14px}
.match{display:grid;gap:8px}
.match .btn{justify-self:start}
.mt{margin:8px 0 0;font-size:14px;color:var(--muted)}
.ai-card{background:var(--olive-soft);box-shadow:none}
.ai-card h2{display:flex;align-items:center;gap:6px;color:var(--olive)}
.stepper b small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.serv-q{margin:-4px 0 16px}
.serv-q .chip{min-width:44px;padding:0 10px}
.sec-row{display:flex;justify-content:space-between}
.photo-btn{position:relative;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
.thinking{display:flex;gap:8px;justify-content:center;padding:28px 0 8px}
.thinking .dot{width:10px;height:10px;border-radius:50%;background:var(--olive);animation:pulse 1.2s infinite ease-in-out}
.thinking .dot:nth-child(2){animation-delay:.2s}.thinking .dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.thinking .dot{animation:none}}
@media (max-width:380px){.stats.three .v{font-size:15px}.nav button{font-size:10.5px}}

const UNITS = 'kg|gr|g|hg|mg|lt|l|dl|cl|ml|cucchiai|cucchiaio|cucchiaini|cucchiaino|pz|pezzi|pezzo|spicchi|spicchio|bicchieri|bicchiere|tazze|tazza|fette|fetta|confezioni|confezione|scatole|scatola|barattoli|barattolo|bottiglie|bottiglia|vasetti|vasetto|mazzi|mazzo|rametti|rametto|foglie|pizzico|pizzichi|bustine|bustina|panetti|panetto|vaschette|vaschetta|buste|busta|lattine|lattina|rotoli|rotolo|fiale|fiala|cespi|cespo|filetti|filetto|coste|costa|bacche|bacca|croste|crosta';

function parseQty(t) { if (!t) return null; t = String(t).replace(',', '.').replace(/\s/g, ''); if (t.includes('/')) { const [a, b] = t.split('/').map(Number); return b ? a / b : null; } const n = parseFloat(t); return isNaN(n) ? null : n; }
function parseIng(line) { const m = String(line).match(ING_RE); if (!m) return null; const name = (m[3] || '').trim(); if (!name) return null; const qty = parseQty(m[1]); return {qty, unit: qty == null ? '' : (m[2] || '').toLowerCase(), name}; }
const fmtQty = n => { if (n == null || n === '') return ''; if (Math.abs(n - 0.5) < 0.001) return '½'; const r = n >= 10 ? Math.round(n) : n >= 1 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100; return String(r).replace('.', ','); };
/* le cose che si contano (uova, zucchine, spicchi…) restano intere quando si ricalcolano le dosi */
const COUNT_UNITS = new Set(['', 'pz', 'pezzi', 'pezzo', 'spicchi', 'spicchio', 'fette', 'fetta', 'confezioni', 'confezione', 'scatole', 'scatola', 'barattoli', 'barattolo', 'bottiglie', 'bottiglia', 'vasetti', 'vasetto', 'mazzi', 'mazzo', 'bustine', 'bustina', 'panetti', 'panetto', 'vaschette', 'vaschetta', 'buste', 'busta', 'lattine', 'lattina', 'rotoli', 'rotolo', 'fiale', 'fiala', 'cespi', 'cespo', 'filetti', 'filetto', 'coste', 'costa', 'bacche', 'bacca', 'croste', 'crosta']);
const SPOON_UNITS = new Set(['cucchiai', 'cucchiaio', 'cucchiaini', 'cucchiaino', 'pizzico', 'pizzichi', 'foglie', 'rametti', 'rametto']);
const HALF_UNITS = new Set(['bicchieri', 'bicchiere', 'tazze', 'tazza']);
const scaleQty = (i, f, up) => {
  if (i.qty == null) return null; const q = i.qty * f;
  if (f === 1) return i.qty;
  if (COUNT_UNITS.has(i.unit || '')) return Math.max(1, up ? Math.ceil(q - 0.05) : Math.round(q));
  if (SPOON_UNITS.has(i.unit) || HALF_UNITS.has(i.unit)) return Math.max(0.5, Math.round(q * 2) / 2);
  if (['g', 'gr', 'ml'].includes(i.unit)) { const st = q >= 1000 ? 50 : q >= 200 ? 10 : q >= 50 ? 5 : 1; return Math.round(q / st) * st; }
  return Math.round(q * 100) / 100;
};
const ingText = (i, f = 1) => [i.qty != null ? fmtQty(scaleQty(i, f)) : '', i.unit, i.name].filter(Boolean).join(' ');

      const byC = CATS.map(c => [c, sum(inY.filter(b => catOf(b.cat)[0] === c[0]).map(b => b.amount))]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);

  },

  conti() {

    if (AI && isPremium() && unsorted.length) html += `<section class="card ai-card"><p style="margin:0 0 10px">${unsorted.length} ${unsorted.length === 1 ? 'movimento importato è' : 'movimenti importati sono'} senza categoria.</p><button class="btn primary wide" data-a="aiSort">${ic('spark','sm')} Classificali con l'assistente</button><p class="hint" id="aisort-st"></p></section>`;
    if (!mv.length) return html + empty('💶', `Nessun movimento a ${MESI[mm - 1]}`, 'Le bollette pagate finiscono qui da sole. Per avere tutte le spese, importa il file CSV dei movimenti scaricato dall\'app o dal sito della tua banca, oppure aggiungi le voci a mano.');
    const byC = MCATS.filter(c => c[3] === 'out').map(c => [`${c[2]} ${c[1]}`, sum(mv.filter(m => m.kind === 'out' && mcatOf(m.cat)[0] === c[0]).map(m => m.amount))]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
    if (byC.length) html += `<section class="card"><div class="card-h"><h2>Dove vanno i soldi</h2></div>${bars(byC)}</section>`;
    const days = {}; mv.forEach(m => (days[m.date] = days[m.date] || []).push(m));

    return html;
  }
};

function bars(rows) {

/* ---------- assistente: ricetta su misura ---------- */
let aiCtl = null;
function sheetAi() {
  const a = ui.ai; if (!a) return;
  if (a.status === 'loading') return openSheet('Ricetta su misura', `<div class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><p class="hint">L'assistente sta pensando a una ricetta con: ${esc(S.fridge.join(', '))}. Può volerci fino a un minuto.</p><div class="actions"><button class="btn ghost" data-a="aiStop">Interrompi</button></div>`);
  if (a.status === 'error') return openSheet('Ricetta su misura', `<p class="st-bad">${esc(a.msg)}</p><div class="actions"><button class="btn primary" data-a="aiRecipe">Riprova</button></div>`);
  const r = a.recipe;
  openSheet(esc(r.name), `<div class="r-meta">${r.time ? `<span>${ic('clock','sm')} ${r.time} minuti</span>` : ''}<span class="tag ai">Inventata dall'assistente</span></div>${recipeBody(r, 1, r.servings)}
    <div class="actions"><button class="btn primary" data-a="aiSave">${ic('check','sm')} Salva nelle mie ricette</button><div class="actions two-c" style="margin:0"><button class="btn" data-a="aiShop">${ic('cart','sm')} In spesa</button><button class="btn ghost" data-a="aiRecipe" data-again="1">${ic('spark','sm')} Un'altra idea</button></div></div>`);
}
async function aiRecipe(again) {
  if (!AI || !isPremium() || !S.fridge.length) return;
  const noteEl = $('#ainote'); if (noteEl) ui.aiNote = noteEl.value.trim();
  const people = S.settings.people;
  const prev = again && ui.ai && ui.ai.recipe ? `\nNon riproporre "${ui.ai.recipe.name}": serve un'idea diversa.` : '';
  const prompt = `Sei un cuoco di cucina casalinga italiana (anche napoletana). Inventa UNA ricetta per ${people} persone usando soprattutto questi ingredienti che ho in casa: ${S.fridge.join(', ')}.
Puoi aggiungere solo ingredienti di base che quasi tutti hanno (sale, pepe, olio, aglio, cipolla, farina, burro, zucchero, parmigiano, erbe aromatiche). Non serve usare tutti gli ingredienti.${ui.aiNote ? `\nPreferenze della famiglia: ${ui.aiNote}.` : ''}${prev}
Rispondi solo con un oggetto JSON in italiano, così:
{"name":"Nome del piatto","time":30,"servings":${people},"cat":"Primi","tags":["veloce"],"ingredients":["320 g spaghetti","2 spicchi aglio","sale q.b."],"steps":["Primo passaggio.","Secondo passaggio."],"notes":"un consiglio breve"}
Regole: in "ingredients" la quantità va prima del nome, con unità tra g, kg, ml, l, cucchiai, cucchiaini, spicchi, fette, oppure solo il numero per le cose che si contano; usa "q.b." per sale, pepe ed erbe. "cat" è uno tra ${LIB_CATS.join(', ')}. Da 3 a 7 passaggi chiari.`;
  if (aiCtl) aiCtl.abort();
  aiCtl = new AbortController(); const ctl = aiCtl;
  ui.ai = {status: 'loading'}; sheetAi();
  try {
    const d = await AI.json(prompt, {signal: ctl.signal, cache: again ? false : undefined});
    if (ctl !== aiCtl) return;
    const ings = Array.isArray(d && d.ingredients) ? d.ingredients.map(x => parseIng(String(x))).filter(Boolean) : [];
    if (!d || !d.name || !ings.length) throw {code: 'invalid_json'};
    ui.ai = {status: 'done', recipe: {id: 'ai', name: String(d.name).slice(0, 120), time: parseInt(d.time) || 0, servings: Math.max(1, parseInt(d.servings) || people), cat: LIB_CATS.includes(d.cat) ? d.cat : '', tags: Array.isArray(d.tags) ? d.tags.map(t => String(t).toLowerCase().slice(0, 30)).slice(0, 4) : [], ingredients: ings, steps: (Array.isArray(d.steps) ? d.steps : [String(d.steps || '')]).map(s => String(s).trim()).filter(Boolean).join('\n'), notes: String(d.notes || '').slice(0, 300)}};
  } catch (e) {
    if (ctl !== aiCtl) return;
    if (e && e.code === 'cancelled') { ui.ai = null; return; }
    ui.ai = {status: 'error', msg: aiErr(e)};
  }
  aiCtl = null;
  if (sheetOpen) sheetAi();
}

  const prompt = `Nella foto c'è una bolletta o un avviso di pagamento italiano. Leggi i dati e rispondi solo con un oggetto JSON:
{"name":"fornitore e servizio in breve, es. Enel luce","cat":"una tra ${CATS.map(c => c[0]).join(', ')}","amount":87.40,"due":"AAAA-MM-GG","rec":"una tra none, m1, m2, m3, m6, m12","auto":false,"notes":"codice cliente, POD o PDR se visibili"}
"amount" è il totale da pagare in euro (numero). "due" è la data di scadenza del pagamento. "rec" è la periodicità della fatturazione se indicata (mensile m1, bimestrale m2, trimestrale m3), altrimenti la più probabile per quel servizio. "auto" è true se il pagamento risulta domiciliato o con addebito diretto SDD. Usa null per i campi che non trovi.`;
  try {
    const d = await AI.json(prompt, {images: [file], modelTier: 'default'});
    if (d && typeof d === 'object') {
      if (d.name) draft.name = String(d.name).slice(0, 80);
      if (CATS.some(c => c[0] === d.cat)) draft.cat = d.cat;
      if (d.amount != null) draft.amount = typeof d.amount === 'number' ? Math.round(d.amount * 100) / 100 : parseMoney(d.amount);
      if (d.due && /^\d{4}-\d{2}-\d{2}$/.test(String(d.due))) draft.due = String(d.due);
      if (d.rec in REC) draft.rec = d.rec;
      draft.auto = d.auto === true;
      if (d.notes) draft.notes = String(d.notes).slice(0, 200);
    }
    if (sheetOpen) sheetBillForm(null, draft);
  } catch (e) {
    const s3 = $('#photo-st'); if (s3) { s3.textContent = aiErr(e); s3.className = 'hint st-bad'; }
  }
}

/* ---------- assistente: scontrino da foto ---------- */

{"store":"nome del negozio in breve","total":23.50,"date":"AAAA-MM-GG","cat":"una tra ${outCats}"}
"total" è il totale pagato in euro. Usa null per i campi che non trovi.`;

/* ---------- assistente: categorie dei movimenti importati ---------- */
async function aiSort() {
  if (!AI) return;
  const list = S.moves.filter(m => m.src === 'csv' && (m.cat === 'uscite' || m.cat === 'entrate')).slice(0, 150);
  if (!list.length) return;
  const st = $('#aisort-st'); if (st) st.textContent = 'L\'assistente sta classificando i movimenti…';
  const outC = MCATS.filter(c => c[3] === 'out').map(c => `${c[0]} (${c[1]})`).join(', '), inC = MCATS.filter(c => c[3] === 'in').map(c => `${c[0]} (${c[1]})`).join(', ');
  const prompt = `Classifica questi movimenti di un conto corrente italiano. Per le uscite usa una tra: ${outC}. Per le entrate usa una tra: ${inC}.
Rispondi solo con un oggetto JSON che associa il numero di ogni riga alla categoria, es. {"0":"spesa","1":"stipendio"}. Se non sei sicuro usa "uscite" o "entrate".
${list.map((m, i) => `${i}. [${m.kind === 'in' ? 'entrata' : 'uscita'}] ${m.desc}`).join('\n')}`;
  try {
    const d = await AI.json(prompt, {modelTier: 'quick'});
    let n = 0;
    list.forEach((m, i) => { const c = d && d[String(i)]; const mc = MCATS.find(x => x[0] === c); if (mc && mc[3] === m.kind && c !== m.cat) { m.cat = c; n++; } });
    list.forEach(m => { if (m.cat === 'uscite' || m.cat === 'entrate') m.src = 'csv-checked'; });
    save(); render(); toast(n ? `${n} movimenti classificati` : 'Nessuna categoria da cambiare');
  } catch (e) { const s = $('#aisort-st'); if (s) s.textContent = aiErr(e); }
}

    if (m) { [, sign, amt, desc] = m; } else { m = t.match(/^(.*?)\s+([+-])?\s*(\d+(?:[.,]\d{1,2})?)\s*(?:€|euro)?$/i); if (!m) return toast('Scrivi importo e descrizione, es. 30 farmacia'); [, desc, sign, amt] = m; }
    const kind = sign === '+' ? 'in' : 'out', cat = guessMcat(desc, kind), c = mcatOf(cat);
    desc = desc.trim() ? desc.trim().replace(/^./, x => x.toUpperCase()) : c[1];
    const mv = {id: uid(), src: 'man', date: today(), amount: parseMoney(amt), kind, cat, desc};

  move: (v, f) => {
    const c = mcatOf(v.cat);
    const data = {desc: String(v.desc || '').trim() || c[1], amount: parseMoney(v.amount), date: v.date || today(), cat: c[0], kind: c[3]};
    if (!data.amount) return toast('Scrivi un importo');
    const m = f.dataset.id && S.moves.find(x => x.id === f.dataset.id);
    if (m) Object.assign(m, data); else S.moves.push({id: uid(), src: 'man', ...data});
    ui.month = data.date.slice(0, 7);
    save(); render(); closeSheet(); toast(m ? 'Movimento aggiornato' : c[3] === 'in' ? 'Entrata aggiunta' : 'Spesa aggiunta');
  },
  settings: v => {
    S.settings.people = Math.max(1, Math.min(20, parseInt(v.people) || 1));
    S.settings.remindDays = parseInt(v.remindDays) || 5;
    S.settings.monthRem = !!v.monthRem;
    if ('dinnerTime' in v) { S.settings.dinner = !!v.dinner; S.settings.sunday = !!v.sunday; S.settings.dinnerTime = v.dinnerTime; S.settings.sundayTime = v.sundayTime; }
    const mods = {}; MODS.forEach(([m]) => { mods[m] = !!v['mod_' + m]; });
    if (Object.values(mods).some(Boolean)) S.settings.mods = mods;
    S.settings.diet = DIETS.map(([x]) => x).filter(x => v['diet_' + x]);
    S.settings.monthDay = Math.max(1, Math.min(28, parseInt(v.monthDay) || 3));
    if (LN) { S.settings.notif = !!v.notif; S.settings.notifHour = Math.max(0, Math.min(23, parseInt(v.notifHour) || 9)); }
    pref.set('theme', v.theme); applyTheme();
    save(); render(); closeSheet(); toast('Impostazioni salvate');
    if (LN && (S.settings.notif || S.settings.monthRem) && notifPerm !== 'granted' && notifPerm !== 'denied') askNotifs();
  },
  import: async (v, f) => {
    let txt = String(v.text || '').trim();
    const file = f.querySelector('input[type=file]').files[0];
    if (file) txt = await file.text();
    if (!txt) return toast('Scegli un file o incolla il testo della copia');
    let d; try { d = JSON.parse(txt); } catch (e) { return toast('Il testo non è una copia valida'); }
    if (!d || !Array.isArray(d.recipes) || !Array.isArray(d.bills)) return toast('Il testo non è una copia di Casa in Ordine');
    closeSheet(); withUndo('Dati ripristinati', () => { S = normalize(d); });
  }
};

/* ---------- avvio ---------- */
function applyTheme() { const t = pref.get('theme', 'auto'); if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  const f = e.target, fn = F[f.dataset.form]; if (!fn) return;
  e.preventDefault(); fn(Object.fromEntries(new FormData(f)), f);
});
document.addEventListener('input', e => {
  if (e.target.id === 'ri') { const pv = $('#ri-prev'); if (pv) pv.textContent = previewWhen(e.target.value); }
  if (e.target.id === 'rq') { ui.q = e.target.value; $('#rlist').innerHTML = recipeList(); }
  if (e.target.id === 'sq') { $('#slist').innerHTML = slotList(e.target.value, ui.slot && (S.menu[ui.slot.day] || {})[ui.slot.meal]); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.tk && tour.d) { tour.d[t.dataset.tk] = t.value; }
  if ((t.id === 'billphoto' || t.id === 'billphoto2') && t.files[0]) { const file = t.files[0]; t.value = ''; billFromPhoto(file); }
  if (t.id === 'receiptphoto' && t.files[0]) { const file = t.files[0]; t.value = ''; receiptFromPhoto(file); }
  if (t.id === 'csvfile' && t.files[0]) {
    const file = t.files[0]; t.value = '';
    try {
      const buf = await file.arrayBuffer();
      const res = /\.xlsx$/i.test(file.name) || new Uint8Array(buf.slice(0, 2)).join() === '80,75' ? parseBankRows(await readXlsx(buf)) : /\.xls$/i.test(file.name) ? {error: 'I file .xls del vecchio Excel non si leggono: aprilo e salvalo come .xlsx o CSV.'} : parseBankCSV(decodeText(buf));
      ui.csv = prepareImport(res);
    } catch (err) { ui.csv = {error: 'Non riesco a leggere il file.'}; }
    sheetCsv();
  }
  if (t.dataset && t.dataset.cm && ui.csv && ui.csv.rows) {
    const map = {...ui.csv.col, [t.dataset.cm]: +t.value};
    ui.csv = {...prepareImport(parseBankRows(ui.csv.rows, map)), colsOpen: true}; sheetCsv();
  }
});
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', window.scrollY > 4), {passive: true});
/* se l'app resta aperta oltre la mezzanotte, aggiorna scadenze e "oggi" */
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); autoPay(); render(); } });

applyTheme();
autoPay();
save();
render();
if (LN) notifStatus().then(() => render());
if (S.onboarded === false) startTour();
</script>
</body>
