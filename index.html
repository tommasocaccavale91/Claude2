<script>
(() => {
'use strict';
const SAVE = 'il_procuratore_v1';
const R = Math.random;
const rnd = (a, b) => a + R() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wpick = arr => { const t = arr.reduce((s, x) => s + x[1], 0); let r = R() * t; for (const x of arr) { if ((r -= x[1]) <= 0) return x[0]; } return arr[0][0]; };
const eur = n => {
  const s = n < 0 ? '−' : ''; n = Math.abs(n);
  if (n >= 1e6) return s + '€' + (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
  if (n >= 1e3) return s + '€' + Math.round(n / 1e3) + 'k';
  return s + '€' + Math.round(n);
};

/* ---------- world ---------- */
const CLUBS = [
  { name: 'Real Valdoro',        tier: 1, c1: '#F1ECDD', c2: '#C29A2E', pat: 'solid' },
  { name: 'Atletico Portoverde', tier: 1, c1: '#1F5A3D', c2: '#F1ECDD', pat: 'stripes' },
  { name: 'Olympia Castelmare',  tier: 1, c1: '#253A6E', c2: '#E8E1CC', pat: 'hoops' },
  { name: 'Dinamo Varska',       tier: 2, c1: '#8E2B2B', c2: '#1E1E22', pat: 'stripes' },
  { name: 'Union Rivabella',     tier: 2, c1: '#5B88B5', c2: '#F1ECDD', pat: 'halves' },
  { name: 'Sporting Lusenti',    tier: 2, c1: '#2F7A4E', c2: '#F1ECDD', pat: 'hoops' },
  { name: 'FC Nordhaven',        tier: 2, c1: '#2B2B30', c2: '#E3B23C', pat: 'stripes' },
  { name: 'Racing Montecorvo',   tier: 3, c1: '#6D2E5B', c2: '#F1ECDD', pat: 'solid' },
  { name: 'Calcio Pietrasanta',  tier: 3, c1: '#C9622A', c2: '#2A2A2E', pat: 'solid' },
  { name: 'Virtus Lagobruno',    tier: 3, c1: '#F1ECDD', c2: '#2C4F86', pat: 'hoops' },
  { name: 'Hellas Marenco',      tier: 3, c1: '#DDBB3A', c2: '#26408B', pat: 'halves' },
  { name: 'Pro Ventoria',        tier: 4, c1: '#A33A2F', c2: '#F1ECDD', pat: 'stripes' },
  { name: 'Audace Collefiore',   tier: 4, c1: '#3F7F8C', c2: '#F1ECDD', pat: 'solid' },
  { name: 'Fortitudo Sabbiadoro',tier: 4, c1: '#E2C27A', c2: '#3A2A1E', pat: 'stripes' },
  { name: 'Sangiorgese',         tier: 4, c1: '#2D5E9E', c2: '#C8352C', pat: 'halves' },
  { name: 'Robur Valtorta',      tier: 4, c1: '#5A6B3A', c2: '#F1ECDD', pat: 'hoops' }
].map((c, i) => ({ ...c, id: i, level: [0, 80, 74, 68, 62][c.tier] + [-1, 0, 1][i % 3] }));
const TIERNAME = ['', 'Prima fascia', 'Seconda fascia', 'Terza fascia', 'Quarta fascia'];

const ROLES = { POR: 'Portiere', DIF: 'Difensore', CEN: 'Centrocampista', ATT: 'Attaccante' };
const NATS = [['ITA', 50], ['ARG', 6], ['BRA', 7], ['FRA', 6], ['ESP', 6], ['POR', 4], ['NED', 4], ['SEN', 4], ['URU', 3], ['CRO', 3], ['SRB', 3], ['NGA', 4]];
const POOLS = {
  IT: { f: 'Luca Marco Andrea Matteo Lorenzo Davide Simone Federico Riccardo Giacomo Tommaso Alessio Nicolò Pietro Gabriele Edoardo Filippo Samuele Manuel Daniele Emanuele Salvatore Gennaro Ciro Vincenzo Michele Stefano Mattia'.split(' '),
        l: "Russo Ferrari Esposito Bianchi Romano Colombo Ricci Marino Greco Bruno Gallo Conti De_Luca Mancini Costa Giordano Rizzo Lombardi Moretti Barbieri Fontana Santoro Mariani Rinaldi Caruso Galli Martini Leone Longo Gentile Vitale Serra Coppola De_Santis D'Angelo Marchetti Parisi Cattaneo Pellegrini Palumbo Sala Fabbri Bellini Orlando".split(' ') },
  ES: { f: 'Mateo Santiago Thiago Facundo Nicolás Joaquín Diego Álvaro Iker Pablo Rodrigo Gonzalo João Gonçalo Rafael Vinícius Gabriel Lucas Bruno Enzo'.split(' '),
        l: 'Fernández González Rodríguez López Martínez Pereira Silva Sousa Almeida Romero Acosta Benítez Ríos Medina Herrera Cabral Moreira Lima Correa Ferreyra'.split(' ') },
  FR: { f: 'Théo Hugo Mathis Noah Enzo Moussa Ibrahima Cheikh Ousmane Samuel Chinedu Emeka Adama Yannick Victor'.split(' '),
        l: 'Diallo Ndiaye Traoré Dubois Moreau Laurent Girard Bonnet Mensah Okafor Adeyemi Sarr Camara Faye Lemoine'.split(' ') },
  SL: { f: 'Luka Ivan Marko Nikola Filip Stefan Dušan Mateo Josip'.split(' '), l: 'Kovač Petrović Jovanović Babić Marić Horvat Ilić Novak Perić'.split(' ') },
  NL: { f: 'Daan Sem Jesse Milan Bram Stijn Ruben Thijs'.split(' '), l: 'de_Jong van_Dijk Bakker Visser Smit de_Vries Mulder Bos'.split(' ') }
};
const GROUP = { ITA: 'IT', ARG: 'ES', ESP: 'ES', URU: 'ES', POR: 'ES', BRA: 'ES', FRA: 'FR', SEN: 'FR', NGA: 'FR', CRO: 'SL', SRB: 'SL', NED: 'NL' };
const SKINS = ['#F1D4BA', '#E2B38E', '#C88E63', '#9A6440', '#6A4229'];
const HAIRC = ['#2A201A', '#4A3322', '#7A5232', '#B98B4E', '#161616', '#8B857A'];
const TRAITS = { Ambizioso: 'Vuole giocare ad alto livello. Soffre se resta in un club piccolo.', Leale: 'Difficile da strappare alla tua agenzia.', Mercenario: 'Segue i soldi. I rivali lo tentano facilmente.', Professionista: 'Umore stabile, poche pretese.' };
const MONTHS = ['Ago', 'Ago', 'Ago', 'Ago', 'Set', 'Set', 'Set', 'Set', 'Ott', 'Ott', 'Ott', 'Ott', 'Nov', 'Nov', 'Nov', 'Nov', 'Dic', 'Dic', 'Dic', 'Dic', 'Gen', 'Gen', 'Gen', 'Gen', 'Feb', 'Feb', 'Feb', 'Feb', 'Mar', 'Mar', 'Mar', 'Mar', 'Apr', 'Apr', 'Apr', 'Apr', 'Mag', 'Mag'];
const WEEKS = 38;
const UPG = {
  office: { name: 'Ufficio', max: 5, cost: [0, 0, 60000, 200000, 600000, 1500000], desc: l => `Fino a ${CAP[l]} assistiti · spese ${eur(OFFICE_COST[l])}/sett.` },
  scout: { name: 'Rete osservatori', max: 5, cost: [0, 0, 40000, 150000, 400000, 1000000], desc: l => `${4 + l * 2} talenti per rapporto · stima potenziale ±${Math.round(errFor(l) / 2)}` },
  legal: { name: 'Studio legale', max: 4, cost: [50000, 180000, 500000, 1200000], desc: l => l ? `Tetto dei club più alto del ${l * 5}% · stima del tetto ${['', 'larga', 'buona', 'precisa', 'esatta'][l]}` : 'Nessun legale: tratti alla cieca.' }
};
const CAP = [0, 3, 5, 8, 12, 16];
const OFFICE_COST = [0, 400, 1200, 3000, 6500, 12000];
const errFor = l => Math.max(1, 13 - l * 2.4);

/* ---------- state ---------- */
let S = null;
const ui = { tab: 'home', sheet: null, confirm: null, toast: null, ask: 0 };

const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) {} };
const load = () => { try { const d = JSON.parse(localStorage.getItem(SAVE) || 'null'); return d && d.v === 1 ? d : null; } catch (e) { return null; } };

const P = id => S.players[id];
const clients = () => S.clients.map(P).filter(Boolean);
const club = p => p.club == null ? null : CLUBS[p.club];
const fullName = p => `${p.first} ${p.last}`.replace(/_/g, ' ');
const shortName = p => `${p.first[0]}. ${p.last.replace(/_/g, ' ')}`;
const inWindow = (w = S.week) => (w >= 1 && w <= 5) || (w >= 21 && w <= 24);
const seasonLabel = () => `${2025 + S.season}/${String(26 + S.season).padStart(2, '0')}`;
const weekLabel = (w = S.week) => w > WEEKS ? 'Fine campionato' : `G${w} · ${MONTHS[w - 1]}`;
const isDeadline = (w = S.week) => w === 5 || w === 24;
const addRep = x => { S.rep = clamp(S.rep + (x > 0 ? x * (1 - S.rep / 125) : x), 0, 100); };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const RIVALS = [['Global Sport Management', 1.6e6], ['Stellar Calcio', 7.5e5], ['Agenzia Ferraresi', 3.2e5], ['Dal Monte & Figli', 1.3e5], ['Prime Talent Group', 5e4]];
const seasonMult = () => Math.pow(1.4, S.season - 1);
const board = () => [...S.rivals.map(x => ({ n: x.n, s: x.s })), { n: S.name, s: S.sEarn, me: true }].sort((a, b) => b.s - a.s);
const myRank = () => board().findIndex(x => x.me) + 1;
const repTitle = r => r < 15 ? 'Procuratore di provincia' : r < 30 ? 'Agente emergente' : r < 50 ? 'Nome conosciuto' : r < 75 ? 'Super agente' : 'Leggenda del mercato';

function value(p) {
  let v = 1e6 * Math.exp((p.ovr - 60) * 0.155);
  const gap = Math.max(0, p.pot - p.ovr);
  if (p.age <= 23) v *= 1 + gap * 0.045; else if (p.age <= 26) v *= 1 + gap * 0.02;
  if (p.age > 29) v *= Math.max(0.15, 1 - (p.age - 29) * 0.13);
  if (p.club != null && p.contract <= 1) v *= 0.7;
  return Math.max(50000, Math.round(v / 1e4) * 1e4);
}
function baseWage(ovr, tier) {
  const w = 2e6 * Math.exp((ovr - 75) * 0.155) * [0, 1.3, 1.1, 0.95, 0.8][tier];
  return Math.max(25000, Math.round(w / 1000) * 1000);
}
const weeklyCut = p => p.club == null ? 0 : p.wage * p.fee / 100 / WEEKS;
const weeklyIncome = () => clients().reduce((s, p) => s + weeklyCut(p), 0);

function makePlayer(o) {
  const nat = wpick(NATS), pool = POOLS[GROUP[nat]];
  const dark = nat === 'SEN' || nat === 'NGA', mixed = nat === 'BRA' || nat === 'FRA';
  const skin = dark ? ri(3, 4) : mixed ? ri(1, 4) : wpick([[0, 4], [1, 4], [2, 2]]);
  const p = {
    id: S.nid++, first: pick(pool.f), last: pick(pool.l), nat, age: o.age,
    role: o.role || wpick([['POR', 1], ['DIF', 3.5], ['CEN', 3.5], ['ATT', 3]]),
    ovr: o.ovr, ovrF: o.ovr, pot: Math.max(o.pot, o.ovr), club: o.club ?? null, wage: 0,
    contract: o.club == null ? 0 : ri(1, 4), fee: ri(6, 10), morale: ri(58, 80), form: 0,
    apps: 0, goals: 0, assists: 0, rsum: 0, inj: 0, trait: pick(Object.keys(TRAITS)),
    skin, hair: dark ? wpick([[1, 3], [3, 2], [0, 1]]) : ri(0, 4), hairC: dark ? 4 : ri(0, 5), stache: o.age > 22 && R() < 0.2,
    listed: false, yrs: 0, refused: false, renewReq: false, lowWeeks: 0
  };
  if (p.age > 31 && R() < 0.5) p.hairC = 5;
  if (p.club != null) p.wage = Math.round(baseWage(p.ovr, CLUBS[p.club].tier) * rnd(0.8, 1.1) / 1000) * 1000;
  scoutRange(p);
  return p;
}
function scoutRange(p, exact) {
  const err = exact ? 0 : errFor(S.up.scout);
  const off = Math.round(rnd(0, err));
  p.pLo = Math.max(p.ovr, p.pot - off); p.pHi = Math.max(p.pLo, p.pot - off + Math.round(err));
}
const potText = p => (p.yrs >= 1 || p.pLo === p.pHi) ? String(Math.max(p.pot, p.ovr)) : `${p.pLo}–${p.pHi}`;

function genMarket(extra) {
  for (const id of S.market) if (!S.clients.includes(id)) delete S.players[id];
  S.market = []; S.mktAge = 0;
  const n = 4 + S.up.scout * 2;
  for (let i = 0; i < n; i++) {
    let p;
    if (R() < 0.6) {
      const age = ri(16, 20), ovr = ri(44, 60);
      const potBoost = ri(6, 18) + Math.round(R() * R() * (10 + S.up.scout * 4));
      const pot = Math.min(94, ovr + potBoost + (20 - age));
      const cl = R() < 0.15 ? null : pick(CLUBS.filter(c => c.tier >= (pot > 82 ? 1 : 2))).id;
      p = makePlayer({ age, ovr, pot, club: cl });
    } else {
      const age = ri(22, 32);
      const ovr = Math.round(56 + Math.pow(R(), 1.8) * 24);
      const pot = age < 26 ? ovr + ri(0, 6) : ovr;
      const fits = CLUBS.filter(c => Math.abs(c.level - ovr) <= 6);
      const cl = R() < 0.18 ? null : pick(fits.length ? fits : CLUBS).id;
      p = makePlayer({ age, ovr, pot, club: cl });
    }
    p.bonus = signBonus(p);
    S.players[p.id] = p; S.market.push(p.id);
  }
  if (extra) S.market.unshift(extra.id);
  S.market.sort((a, b) => P(b).pHi - P(a).pHi);
}
const stature = p => Math.max(p.ovr, p.pot - 8);
const signBonus = p => Math.round((value(p) * 0.015 + 2000) / 500) * 500;
const recruitChance = (p, mult) => clamp(0.55 + (S.rep - (stature(p) - 50) * 1.8) * 0.025 + (mult - 1) * 0.22, 0.05, 0.95);

function news(t, k = '') { S.news.unshift({ w: weekLabel(), t, k }); if (S.news.length > 40) S.news.length = 40; }
function toast(t) { ui.toast = t; renderToast(); clearTimeout(toast.h); toast.h = setTimeout(() => { ui.toast = null; renderToast(); }, 2600); }

function newGame(name) {
  S = { v: 1, name, season: 1, week: 1, money: 40000, rep: 10, nid: 1, oid: 1, players: {}, clients: [], market: [], offers: [], news: [],
    up: { scout: 1, office: 1, legal: 0 }, stats: { earned: 0, deals: 0, fees: 0 }, sEarn: 0, sDeals: 0, sRep: 10, debt: 0,
    event: null, mktAge: 0, report: [], over: false, sum: null,
    rivals: RIVALS.map(([n, t]) => ({ n, t, s: 0 })), ach: {}, daily: { last: null, streak: 0, best: 0 },
    rec: { maxFee: 0, tier1: false, wonder: false, award: false, top1: false, deadline: false, grow: 0 }, sRec: { tier1: false, youth: false, maxFee: 0 } };
  const t4 = CLUBS.filter(c => c.tier === 4), t3 = CLUBS.filter(c => c.tier === 3);
  const a = makePlayer({ age: 18, ovr: 55, pot: 77, club: pick(t4).id, role: 'ATT' }); a.contract = 2; a.fee = 8; a.morale = 72; a.trait = 'Ambizioso';
  const b = makePlayer({ age: 27, ovr: 65, pot: 66, club: pick(t3).id, role: 'CEN' }); b.contract = 1; b.fee = 7; b.trait = 'Professionista';
  for (const p of [a, b]) { scoutRange(p, true); p.ovr0 = p.ovr; S.players[p.id] = p; S.clients.push(p.id); }
  genMarket();
  news(`Apri lo studio con due assistiti: <b>${fullName(a)}</b>, talento grezzo, e <b>${fullName(b)}</b>, in scadenza a fine stagione.`);
  news('Il mercato estivo è aperto fino alla G5. Proponi i tuoi giocatori ai club o cerca nuovi talenti.');
  genObjectives();
  save();
}

/* ---------- challenges, achievements, rivals ---------- */
const OBJ = {
  deals:  { txt: o => `Chiudi ${o.target} affari in stagione`, prog: () => S.sDeals },
  earn:   { txt: o => `Incassa ${eur(o.target)} in stagione`, prog: () => S.sEarn, money: 1 },
  fee:    { txt: o => `Chiudi un trasferimento da almeno ${eur(o.target)}`, prog: () => S.sRec.maxFee, money: 1 },
  tier1:  { txt: () => 'Porta un assistito in un club di prima fascia', prog: () => S.sRec.tier1 ? 1 : 0 },
  youth:  { txt: () => 'Trasferisci un under 21 in un club di prima o seconda fascia', prog: () => S.sRec.youth ? 1 : 0 },
  roster: { txt: o => `Arriva a ${o.target} assistiti`, prog: () => S.clients.length },
  goals:  { txt: o => `Un tuo assistito segna ${o.target} gol in stagione`, prog: () => Math.max(0, ...clients().map(p => p.goals)) },
  rating: { txt: () => 'Un assistito con media voto 7.0+ (min. 10 presenze)', prog: () => clients().some(p => p.apps >= 10 && p.rsum / p.apps >= 7) ? 1 : 0 },
  rank:   { txt: o => `Chiudi la stagione tra i primi ${o.target} procuratori`, prog: () => myRank(), end: 1 }
};
function genObjectives() {
  const m = seasonMult();
  const pool = [
    { t: 'deals', target: 2 + Math.min(S.season - 1, 3) + Math.floor(S.rep / 30), w: 1.2 },
    { t: 'earn', target: Math.round(45000 * m / 1000) * 1000, w: 1.2 },
    { t: 'fee', target: Math.round(1.5e6 * m / 1e5) * 1e5, w: 1.4 },
    { t: 'tier1', target: 1, w: S.rep < 20 ? 1.8 : 1.2 },
    { t: 'youth', target: 1, w: 1.3 },
    { t: 'goals', target: 10, w: 1 },
    { t: 'rating', target: 1, w: 1 },
    { t: 'rank', target: S.season === 1 ? 4 : 3, w: 1.5 }
  ];
  if (S.clients.length + 2 <= CAP[S.up.office]) pool.push({ t: 'roster', target: S.clients.length + 2, w: 0.8 });
  S.obj = [];
  while (S.obj.length < 3) { const o = pick(pool); if (!S.obj.some(x => x.t === o.t)) S.obj.push({ t: o.t, target: o.target, money: Math.round(14000 * m * o.w / 1000) * 1000, rep: +(o.w).toFixed(1), done: false }); }
}
function completeObj(o) {
  o.done = true; S.money += o.money; addRep(o.rep);
  news(`Sfida completata: <b>${OBJ[o.t].txt(o)}</b>. Premio ${eur(o.money)}.`, 'good');
  toast(`Sfida completata · +${eur(o.money)}`); buzz([30, 60, 30]);
}
const ACH = [
  ['first', 'Prima stretta di mano', 'Chiudi il primo affare', () => S.stats.deals >= 1, 5000, 0.5],
  ['wonder', 'Occhio lungo', 'Firma un talento con potenziale reale 85+', () => S.rec.wonder, 15000, 1],
  ['tier1', 'Salotto buono', 'Porta un assistito in un club di prima fascia', () => S.rec.tier1, 20000, 1],
  ['deadline', 'Sul gong', "Chiudi un trasferimento nell'ultimo giorno di mercato", () => S.rec.deadline, 15000, 1],
  ['grow', 'Bottega artigiana', "Un assistito migliora di 12 punti da quando l'hai firmato", () => S.rec.grow >= 12, 25000, 1],
  ['streak7', 'Abitudinario', 'Sette caffè del mattino di fila', () => S.daily.best >= 7, 10000, 1],
  ['squad8', 'Scuderia piena', 'Rappresenta 8 giocatori nello stesso momento', () => S.clients.length >= 8, 30000, 1],
  ['fee10', 'Colpo da dieci', 'Un trasferimento da almeno €10M', () => S.rec.maxFee >= 1e7, 50000, 2],
  ['award', 'Notte dei premi', 'Un assistito vince il premio di miglior giocatore', () => S.rec.award, 30000, 2],
  ['million', 'Primo milione', 'Raggiungi €1M in cassa', () => S.money >= 1e6, 0, 3],
  ['top1', "Procuratore dell'anno", 'Chiudi una stagione primo in classifica', () => S.rec.top1, 150000, 3],
  ['fee40', 'Affare del secolo', 'Un trasferimento da almeno €40M', () => S.rec.maxFee >= 4e7, 250000, 3],
  ['vet', 'Lunga carriera', 'Completa cinque stagioni', () => S.season >= 6, 80000, 2],
  ['legend', 'Leggenda', 'Raggiungi 75 di reputazione', () => S.rep >= 75, 300000, 0]
];
function progress() {
  for (const o of S.obj || []) if (!o.done && !OBJ[o.t].end && OBJ[o.t].prog() >= o.target) completeObj(o);
  for (const [id, name] of ACH) {
    const a = ACH.find(x => x[0] === id);
    if (!S.ach[id] && a[3]()) { S.ach[id] = 1; news(`Traguardo sbloccato: <b>${name}</b>. Ritira il premio in Ufficio.`, 'good'); }
  }
}
const achReady = () => Object.values(S.ach).filter(v => v === 1).length;
function rivalsWeek() {
  const before = S.prevRank || myRank(), m = seasonMult();
  for (const x of S.rivals) {
    let w = x.t * m / WEEKS * rnd(0.3, 1.4);
    if (R() < 0.05) { const big = x.t * m * rnd(0.08, 0.18); w += big; if (x.t >= 3e5) news(`${esc(x.n)} chiude un colpo e incassa ${eur(big)}.`); }
    x.s += Math.round(w);
  }
  const after = myRank();
  if (after < before) news(`Sorpasso! Sali al <b>${after}° posto</b> nella classifica dei procuratori.`, 'good');
  else if (after > before && after <= 3) news(`Ti hanno superato: scendi al ${after}° posto in classifica.`, 'bad');
  S.prevRank = after;
}
function migrate(d) {
  if (!d) return d;
  d.rivals = d.rivals || RIVALS.map(([n, t]) => ({ n, t, s: 0 }));
  d.ach = d.ach || {}; d.daily = d.daily || { last: null, streak: 0, best: 0 };
  d.rec = d.rec || { maxFee: 0, tier1: false, wonder: false, award: false, top1: false, deadline: false, grow: 0 };
  d.sRec = d.sRec || { tier1: false, youth: false, maxFee: 0 };
  S = d; if (!S.obj) genObjectives();
  for (const p of clients()) if (p.ovr0 == null) p.ovr0 = p.ovr;
  return S;
}
function claimDaily() {
  if (S.daily.last === dayKey()) return;
  S.daily.streak = S.daily.last === dayKey(Date.now() - 864e5) ? S.daily.streak + 1 : 1;
  S.daily.best = Math.max(S.daily.best, S.daily.streak); S.daily.last = dayKey();
  const day = ((S.daily.streak - 1) % 7) + 1;
  const g = Math.round(1200 * day * (1 + (S.season - 1) * 0.5) / 100) * 100;
  S.money += g;
  if (day === 7) {
    const age = ri(16, 18), ovr = ri(50, 58);
    const k = makePlayer({ age, ovr, pot: Math.min(93, ovr + ri(26, 34)), club: pick(CLUBS.filter(c => c.tier >= 3)).id });
    k.bonus = signBonus(k); S.players[k.id] = k; S.market.unshift(k.id);
    news(`Settimo caffè: il barista ti parla di <b>${fullName(k)}</b>, ${age} anni. Lo trovi nel Mercato.`, 'good');
  }
  toast(`Caffè del mattino · +${eur(g)}`); buzz(25);
  progress(); save(); render();
}

/* ---------- weekly simulation ---------- */
function advance() {
  if (S.event || S.over) return;
  if (S.week > WEEKS) { seasonEnd(); return; }
  const report = [];
  for (const p of clients()) {
    const c = club(p);
    if (p.inj > 0) { p.inj--; report.push({ id: p.id, s: 'inj' }); develop(p, false); continue; }
    if (!c) { p.morale -= 1.2; report.push({ id: p.id, s: 'free' }); develop(p, false); continue; }
    const diff = p.ovr - c.level;
    const played = R() < clamp(0.55 + diff * 0.08 + (p.form * 0.05), 0.06, 0.97);
    if (played) {
      const rating = clamp(6.3 + diff * 0.04 + p.form * 0.35 + gauss() * 0.65, 4.5, 10);
      const gch = { POR: 0, DIF: 0.04, CEN: 0.12, ATT: 0.32 }[p.role] * clamp(1 + diff * 0.04, 0.4, 1.8);
      const ach = { POR: 0.01, DIF: 0.05, CEN: 0.16, ATT: 0.12 }[p.role];
      let g = 0, a = 0;
      if (R() < gch) g++; if (R() < gch * 0.25) g++; if (R() < ach) a++;
      const r = Math.round(clamp(rating + g * 0.6 + a * 0.3, 4.5, 10) * 10) / 10;
      p.apps++; p.goals += g; p.assists += a; p.rsum += r;
      p.form = clamp(p.form * 0.6 + (r - 6.5) * 0.5, -1.5, 1.5);
      p.morale += 1.2;
      report.push({ id: p.id, s: 'play', r, g, a });
      if (R() < 0.014) { p.inj = ri(1, 6); news(`<b>${fullName(p)}</b> si ferma per infortunio: fuori ${p.inj} settimane.`, 'bad'); }
    } else {
      p.form *= 0.8;
      p.morale -= p.trait === 'Ambizioso' ? 2.5 : p.trait === 'Professionista' ? 0.8 : 1.5;
      report.push({ id: p.id, s: 'bench' });
    }
    if (p.trait === 'Ambizioso' && p.ovr - c.level >= 5) p.morale -= 0.8;
    develop(p, played);
  }
  for (const p of clients()) {
    p.morale = clamp(p.morale, 0, 100);
    p.lowWeeks = p.morale < 12 ? p.lowWeeks + 1 : 0;
    if (p.lowWeeks >= 4) { dropClient(p, `<b>${fullName(p)}</b> era scontento da settimane e ha lasciato la tua agenzia.`); S.rep = Math.max(0, S.rep - 2); }
  }
  S.report = report;

  S.week++;
  const inc = Math.round(weeklyIncome()), cost = OFFICE_COST[S.up.office];
  S.money += inc - cost; S.sEarn += inc; S.stats.earned += inc;
  S.lastNet = inc - cost;

  S.offers = S.offers.filter(o => {
    if (o.exp < S.week) { news(`L'offerta di <b>${CLUBS[o.club].name}</b> per ${shortName(P(o.pid))} è scaduta.`); return false; }
    return true;
  });
  genOffers();
  rivalsWeek();
  if (isDeadline()) news('<b>Ultimo giorno di mercato.</b> Le offerte di trasferimento scadono stasera: più club si fanno avanti.', 'bad');
  if (S.week === 21) news('Si apre la sessione invernale di mercato (fino alla G24).');
  if (S.week === 6 || S.week === 25) news('Mercato chiuso. Solo gli svincolati possono firmare.');

  if (++S.mktAge >= 6) { genMarket(); news('Nuovo rapporto dei tuoi osservatori: talenti aggiornati nel Mercato.'); }
  S.debt = S.money < 0 ? S.debt + 1 : 0;
  if (S.debt === 1) news('Conto in rosso. Hai 8 settimane per rientrare prima della chiusura dello studio.', 'bad');
  if (S.debt >= 8) { S.over = true; ui.sheet = { k: 'over' }; }
  maybeEvent();
  progress();
  if (S.event) ui.sheet = { k: 'event' };
  save(); render();
}

function develop(p, played) {
  let d = 0;
  const gap = p.pot - p.ovrF;
  if (p.age <= 21) d = gap * 0.012 * (played ? 1.35 : 0.6) * rnd(0.5, 1.5);
  else if (p.age <= 24) d = gap * 0.009 * (played ? 1.3 : 0.6) * rnd(0.5, 1.5);
  else if (p.age <= 28) d = gap * 0.005 * rnd(0.5, 1.5);
  else if (p.age >= 31) d = -rnd(0, 0.035) * (p.age - 29);
  p.ovrF = clamp(p.ovrF + d, 30, 95);
  const before = p.ovr; p.ovr = Math.round(p.ovrF);
  if (p.ovr0 != null) S.rec.grow = Math.max(S.rec.grow, p.ovr - p.ovr0);
  if (p.ovr > before && p.ovr % 3 === 0) news(`<b>${fullName(p)}</b> cresce: ora è valutato <b>${p.ovr}</b>.`, 'good');
}

function genOffers() {
  for (const p of clients()) {
    if (p.inj > 2) continue;
    const mine = S.offers.filter(o => o.pid === p.id);
    const c = club(p);
    if (c && p.contract <= 1 && !mine.some(o => o.type === 'renew')) {
      const wants = p.ovr >= c.level - 6;
      if (R() < (p.renewReq ? (wants ? 0.55 : 0.15) : (wants ? 0.07 : 0.02))) { addOffer(p, c, 'renew'); p.renewReq = false; }
    }
    if (mine.filter(o => o.type !== 'renew').length >= 2) continue;
    let ch = 0;
    if (!c) ch = 0.16 + S.rep * 0.0015;
    else if (inWindow()) ch = (0.035 + S.rep * 0.0012 + (p.listed ? 0.16 : 0) + Math.max(0, p.ovr - c.level) * 0.02 + p.form * 0.03) * (isDeadline() ? 1.8 : 1);
    if (R() >= ch) continue;
    const ceil = p.ovr + 5 + (p.age <= 21 ? (p.pot - p.ovr) * 0.35 : 0);
    const cands = CLUBS.filter(k => k.id !== p.club && k.level <= ceil && k.level >= p.ovr - 12 && !mine.some(o => o.club === k.id));
    if (!cands.length) continue;
    const ws = cands.map(k => [k, 1 + Math.max(0, k.level - p.ovr + 8)]);
    addOffer(p, wpick(ws), c ? 'transfer' : 'free');
  }
}
function addOffer(p, k, type) {
  const youth = p.age <= 21 ? (p.pot - p.ovr) * 0.25 : 0;
  let wage = Math.round(baseWage(p.ovr + youth, k.tier) * rnd(0.85, 1.12) / 1000) * 1000;
  if (type === 'renew') wage = Math.max(Math.round(p.wage * rnd(1.02, 1.12) / 1000) * 1000, wage);
  const fee = type === 'transfer' ? Math.round(value(p) * rnd(0.85, 1.3) / 1e4) * 1e4 : 0;
  const years = p.age < 24 ? ri(4, 5) : p.age < 30 ? ri(3, 4) : ri(1, 2);
  const max = Math.round(wage * (1.04 + R() * 0.24 + S.up.legal * 0.05 + S.rep * 0.001) / 1000) * 1000;
  const spread = max * [0.5, 0.3, 0.18, 0.08, 0][S.up.legal];
  const lo = Math.round((max - spread * R()) / 1000) * 1000;
  S.offers.push({ id: S.oid++, pid: p.id, club: k.id, type, fee, wage, cur: wage, max, years, exp: type === 'transfer' ? Math.min(S.week + 2, S.week <= 5 ? 5 : 24) : S.week + 2, pat: 3, log: [], hLo: lo, hHi: Math.round((lo + spread) / 1000) * 1000 });
  const what = type === 'renew' ? 'propone il rinnovo a' : type === 'free' ? 'vuole tesserare lo svincolato' : `offre ${eur(fee)} per`;
  news(`<b>${k.name}</b> ${what} <b>${fullName(p)}</b>. Vai a Trattative.`, 'good');
}

function dropClient(p, msg) {
  S.clients = S.clients.filter(id => id !== p.id);
  S.offers = S.offers.filter(o => o.pid !== p.id);
  delete S.players[p.id];
  if (msg) news(msg, 'bad');
}

/* ---------- events ---------- */
function maybeEvent() {
  const cl = clients();
  if (!cl.length || R() > 0.17) return;
  const opts = [];
  const stars = cl.filter(p => p.ovr >= 64 || p.pot >= 78); if (stars.length) opts.push(['poach', pick(stars)]);
  const sad = cl.filter(p => p.morale < 40 && p.club != null); if (sad.length) opts.push(['unhappy', pick(sad)], ['unhappy', pick(sad)]);
  const fam = cl.filter(p => p.ovr >= 68 && p.club != null); if (fam.length) opts.push(['sponsor', pick(fam)]);
  const owned = cl.filter(p => p.club != null && p.wage > 0); if (owned.length) opts.push(['bung', pick(owned)]);
  const far = cl.filter(p => p.nat !== 'ITA' && p.age <= 22 && p.club != null); if (far.length) opts.push(['homesick', pick(far)]);
  opts.push(['press', pick(cl)], ['tip', null]);
  const [t, p] = pick(opts);
  S.event = { t, pid: p ? p.id : null };
}
function eventView(ev) {
  const p = ev.pid != null ? P(ev.pid) : null;
  const n = p ? `<b>${esc(fullName(p))}</b>` : '';
  switch (ev.t) {
    case 'poach': {
      const cost = Math.max(2000, Math.round(value(p) * 0.012 / 1000) * 1000);
      return { title: 'Uno squalo in tribuna', text: `Un procuratore rivale ha avvicinato ${n} promettendogli un ingaggio più ricco. ${p.trait === 'Mercenario' ? 'Sai che i soldi gli parlano forte.' : p.trait === 'Leale' ? 'Di solito ti è fedele.' : ''}`,
        ch: [[`Premio fedeltà · ${eur(cost)}`, 'loyal', S.money < cost], ['Fidati del rapporto', 'trust']], cost };
    }
    case 'unhappy': return { title: 'Musi lunghi', text: `${n} è scontento: ${club(p) && p.ovr - club(p).level >= 4 ? 'si sente sprecato in questa squadra.' : 'gioca poco e lo fa notare.'}`,
      ch: [['Mettilo sul mercato', 'list'], ['Chiedigli pazienza', 'calm']] };
    case 'sponsor': return { title: 'Contratto di immagine', text: `Un marchio di scarpini vuole ${n} come testimonial per la prossima campagna. A te spetta il 20% dell'accordo.`,
      ch: [[`Firma · +${eur(Math.round(p.wage * 0.05 / 500) * 500)} per te`, 'sponsor'], ['Rifiuta: deve pensare al campo', 'nosponsor']] };
    case 'press': return { title: 'Il giornalista chiama', text: `Un quotidiano sportivo vuole un tuo commento sul futuro di ${n}.`,
      ch: [['«Merita un palcoscenico più grande»', 'hype'], ['«Parliamo solo di campo»', 'humble']] };
    case 'bung': {
      const x = Math.max(3000, Math.round(p.wage * 0.08 / 500) * 500);
      return { title: 'Una busta sotto il tavolo', text: `Il ds di ${esc(club(p).name)} ti offre ${eur(x)} in contanti se convinci ${n} ad accettare un taglio dello stipendio. Nessuno lo saprà. Forse.`,
        ch: [[`Intasca la busta · +${eur(x)}`, 'bung'], ['Rifiuta e avvisa il giocatore', 'clean']], cost: x };
    }
    case 'homesick': return { title: 'Nostalgia di casa', text: `${n} fatica ad ambientarsi: chiama casa ogni sera e in campo si vede.`,
      ch: [['Fai arrivare la famiglia · €3k', 'family', S.money < 3000], ['Portalo a cena e parlaci tu', 'talk']] };
    case 'tip': return { title: 'La soffiata', text: 'Un vecchio osservatore di fiducia ti chiama: ha visto un ragazzo di cui nessuno parla ancora. Vuole un rimborso spese per il dossier.',
      ch: [['Compra il dossier · €1.5k', 'tip', S.money < 1500], ['Non ora', 'none']] };
  }
}
function resolveEvent(act) {
  const ev = S.event; if (!ev) return;
  const p = ev.pid != null ? P(ev.pid) : null;
  const v = eventView(ev);
  S.event = null; ui.sheet = null;
  if (p && !S.clients.includes(p.id)) { render(); return; }
  switch (act) {
    case 'loyal': S.money -= v.cost; p.morale += 18; news(`Premio fedeltà pagato: <b>${fullName(p)}</b> resta con te.`, 'good'); break;
    case 'trust': {
      const ch = clamp({ Leale: 0.08, Mercenario: 0.55, Ambizioso: 0.32, Professionista: 0.22 }[p.trait] - (p.morale - 50) / 200, 0.03, 0.8);
      if (R() < ch) { dropClient(p, `<b>${fullName(p)}</b> ha firmato con l'agenzia rivale. Una brutta giornata.`); S.rep = Math.max(0, S.rep - 2); }
      else { p.morale += 6; news(`<b>${fullName(p)}</b> ha rifiutato il rivale: «Il mio procuratore è uno solo».`, 'good'); }
      break;
    }
    case 'list': p.listed = true; p.morale += 12; news(`Hai messo <b>${fullName(p)}</b> sul mercato.${inWindow() ? '' : ' Le offerte arriveranno alla riapertura.'}`); break;
    case 'calm': if (p.trait === 'Leale' || p.trait === 'Professionista') { p.morale += 8; news(`<b>${fullName(p)}</b> ti dà fiducia.`); } else { p.morale -= 6; news(`<b>${fullName(p)}</b> non l'ha presa bene.`, 'bad'); } break;
    case 'sponsor': { const g = Math.round(p.wage * 0.05 / 500) * 500; S.money += g; S.sEarn += g; S.stats.earned += g; addRep(0.3); p.morale += 4; news(`Accordo con lo sponsor per <b>${fullName(p)}</b>: +${eur(g)}.`, 'good'); break; }
    case 'nosponsor': p.form = clamp(p.form + 0.4, -1.5, 1.5); p.morale += 2; break;
    case 'hype': addRep(0.6); p.listed = p.club != null; p.morale += p.trait === 'Leale' ? -4 : 5; news(`La tua intervista su <b>${fullName(p)}</b> fa rumore. I club prendono nota.`); break;
    case 'humble': addRep(0.2); p.morale += 3; break;
    case 'bung':
      S.money += v.cost; p.morale -= 10; p.wage = Math.round(p.wage * 0.92 / 1000) * 1000;
      if (R() < 0.35) { addRep(-6); news(`<b>Scandalo:</b> un giornale pubblica la storia della busta. ${fullName(p)} è furioso e la tua reputazione crolla.`, 'bad'); p.morale -= 25; }
      else news(`Busta intascata. ${fullName(p)} ha accettato il taglio senza sapere niente.`);
      break;
    case 'clean': p.morale += 12; addRep(0.8); news(`Hai rifiutato la busta e l'hai detto a <b>${fullName(p)}</b>. Si fida di te più che mai.`, 'good'); break;
    case 'family': S.money -= 3000; p.morale += 18; p.form = clamp(p.form + 0.3, -1.5, 1.5); news(`La famiglia di <b>${fullName(p)}</b> lo ha raggiunto. Torna a sorridere.`, 'good'); break;
    case 'talk': if (R() < 0.55) { p.morale += 8; news(`La cena con <b>${fullName(p)}</b> è servita.`, 'good'); } else { p.morale -= 4; news(`<b>${fullName(p)}</b> resta giù di morale.`, 'bad'); } break;
    case 'tip': {
      S.money -= 1500;
      const age = ri(16, 18), ovr = ri(50, 58);
      const k = makePlayer({ age, ovr, pot: Math.min(93, ovr + ri(24, 34)), club: pick(CLUBS.filter(c => c.tier >= 3)).id });
      k.bonus = signBonus(k); S.players[k.id] = k; S.market.unshift(k.id);
      progress();
      news(`Dossier ricevuto: <b>${fullName(k)}</b>, ${age} anni. Lo trovi in cima al Mercato.`, 'good');
      break;
    }
  }
  save(); render();
}

/* ---------- negotiation ---------- */
function finalize(o, wage) {
  const p = P(o.pid), k = CLUBS[o.club], prev = club(p);
  let gain = 0, msg;
  if (o.type === 'transfer') {
    gain = Math.round(o.fee * 0.03);
    p.morale += (k.level > prev.level ? 16 : -4) + (wage > p.wage * 1.3 ? 6 : 0);
    if (p.trait === 'Ambizioso' && k.level < prev.level) p.morale -= 14;
    addRep(clamp(0.4 + o.fee / 4e6, 0.4, 4));
    S.stats.fees += o.fee;
    S.rec.maxFee = Math.max(S.rec.maxFee, o.fee); S.sRec.maxFee = Math.max(S.sRec.maxFee, o.fee);
    if (isDeadline()) S.rec.deadline = true;
    if (p.age <= 20 && k.tier <= 2) S.sRec.youth = true;
    msg = `Affare chiuso: <b>${fullName(p)}</b> passa a <b>${k.name}</b> per ${eur(o.fee)}. Commissione: ${eur(gain)}.`;
  } else if (o.type === 'free') {
    gain = Math.round(wage * 0.1);
    p.morale += 15; addRep(0.5);
    msg = `<b>${fullName(p)}</b> firma con <b>${k.name}</b> da svincolato. Bonus alla firma per te: ${eur(gain)}.`;
  } else {
    gain = Math.round(wage * 0.03);
    p.morale += 8; addRep(0.25);
    msg = `Rinnovo firmato: <b>${fullName(p)}</b> resta a <b>${k.name}</b> fino al ${2025 + S.season + o.years}. Bonus: ${eur(gain)}.`;
  }
  if (o.type !== 'renew' && k.tier === 1) { S.rec.tier1 = true; S.sRec.tier1 = true; }
  p.club = k.id; p.wage = wage; p.contract = o.years; p.listed = false; p.renewReq = false;
  p.morale = clamp(p.morale, 0, 100);
  S.money += gain; S.sEarn += gain; S.stats.earned += gain; S.stats.deals++; S.sDeals++;
  S.rep = clamp(S.rep, 0, 100);
  S.offers = S.offers.filter(x => x.id !== o.id && !(x.pid === p.id && (o.type !== 'renew' || x.type === 'renew')));
  news(msg, 'good');
  ui.sheet = null; buzz(40); progress(); save(); render();
  if (!ui.toast) toast(`Firmato · +${eur(gain)}`);
}
function pushAsk(o, ask) {
  o.log.push({ me: true, t: `Chiedi ${eur(ask)} l'anno.` });
  if (ask <= o.cur) { finalize(o, ask); return; }
  if (ask <= o.max) { o.log.push({ t: 'Il direttore sportivo stringe la mano: accordo.' }); finalize(o, ask); return; }
  o.pat--;
  if (o.pat <= 0) {
    S.offers = S.offers.filter(x => x.id !== o.id);
    S.rep = Math.max(0, S.rep - 1);
    news(`<b>${CLUBS[o.club].name}</b> ha interrotto la trattativa per ${fullName(P(o.pid))}: richieste troppo alte.`, 'bad');
    ui.sheet = null; save(); render(); toast('Trattativa saltata'); return;
  }
  const counter = Math.round(Math.min(o.max, o.cur + (ask - o.cur) * rnd(0.3, 0.6)) / 1000) * 1000;
  o.cur = Math.max(o.cur, counter);
  o.log.push({ t: o.pat === 1 ? `Ultima offerta: ${eur(o.cur)}. Poi ci alziamo dal tavolo.` : `Possiamo arrivare a ${eur(o.cur)}.` });
  ui.ask = o.cur; save(); render();
}

/* ---------- season end ---------- */
function seasonEnd() {
  const sum = { label: seasonLabel(), earned: S.sEarn, deals: S.sDeals, rep: S.rep - S.sRep, lines: [] };
  const cl = clients();
  const ranked = cl.filter(p => p.apps >= 12).sort((a, b) => b.rsum / b.apps - a.rsum / a.apps);
  if (ranked[0] && ranked[0].rsum / ranked[0].apps >= 7.0) {
    const b = ranked[0]; addRep(2); b.morale += 10; S.rec.award = true;
    sum.lines.push(`<b>${fullName(b)}</b> vince il premio di miglior giocatore della stagione (media ${(b.rsum / b.apps).toFixed(2)}).`);
  }
  const yng = cl.filter(p => p.age <= 21 && p.apps >= 10).sort((a, b) => b.rsum / b.apps - a.rsum / a.apps)[0];
  if (yng && yng !== ranked[0] && yng.rsum / yng.apps >= 6.8) { addRep(1.2); sum.lines.push(`<b>${fullName(yng)}</b> è il miglior giovane del campionato.`); }
  const top = cl.filter(p => p.role === 'ATT').sort((a, b) => b.goals - a.goals)[0];
  if (top && top.goals >= 12) sum.lines.push(`<b>${fullName(top)}</b> chiude con ${top.goals} gol.`);
  const rank = myRank(), m = seasonMult();
  sum.rank = rank;
  if (rank === 1) { const prize = Math.round(60000 * m / 1000) * 1000; S.money += prize; addRep(3); S.rec.top1 = true; sum.lines.unshift(`<b>Procuratore dell'anno!</b> Chiudi primo in classifica: premio ${eur(prize)}.`); }
  else if (rank <= 3) { addRep(1); sum.lines.unshift(`Chiudi ${rank}° nella classifica dei procuratori.`); }
  else sum.lines.unshift(`Chiudi ${rank}° nella classifica dei procuratori. ${board()[0].n} resta davanti a tutti.`);
  for (const o of S.obj) if (!o.done && OBJ[o.t].end && OBJ[o.t].prog() <= o.target) completeObj(o);
  sum.obj = S.obj.filter(o => o.done).length;
  for (const p of cl) {
    p.age++; p.yrs++; p.apps = p.goals = p.assists = p.rsum = 0; p.form = 0;
    if (p.age >= 33 && R() < (p.age - 32) * 0.22) { sum.lines.push(`<b>${fullName(p)}</b> si ritira a ${p.age} anni. Grazie di tutto.`); dropClient(p); continue; }
    if (p.club != null) {
      p.contract--;
      if (p.contract <= 0) { sum.lines.push(`<b>${fullName(p)}</b> è svincolato da ${club(p).name}: trovagli una squadra.`); p.club = null; p.wage = 0; p.morale -= 12; }
    }
    if (p.age >= 31) p.pot = Math.min(p.pot, p.ovr);
  }
  S.offers = S.offers.filter(o => o.type !== 'renew' && P(o.pid) && (o.type !== 'transfer' || P(o.pid).club != null));
  S.rep = clamp(S.rep, 0, 100);
  for (const x of S.rivals) x.s = 0;
  S.prevRank = 0;
  S.sRec = { tier1: false, youth: false, maxFee: 0 };
  S.season++; S.week = 1; S.sEarn = 0; S.sDeals = 0; S.sRep = S.rep; S.report = [];
  genMarket(); genObjectives(); progress();
  news(`Inizia la stagione ${seasonLabel()}. Mercato estivo aperto e tre nuove sfide sul tavolo.`);
  S.sum = sum; ui.sheet = { k: 'season' };
  save(); render();
}

/* ---------- art ---------- */
function portrait(p) {
  const c = club(p) || { c1: '#8C8F86', c2: '#E9E4D6', pat: 'solid' };
  const sk = SKINS[p.skin], hc = HAIRC[p.hairC], uid = 'p' + p.id + Math.floor(R() * 1e6);
  const shirt = 'M6 122 C8 97 22 88 38 84 L50 93 L62 84 C78 88 92 97 94 122Z';
  let pat = '';
  if (c.pat === 'stripes') for (let x = 10; x < 100; x += 16) pat += `<rect x="${x}" y="80" width="7" height="45" fill="${c.c2}"/>`;
  if (c.pat === 'hoops') for (let y = 90; y < 125; y += 12) pat += `<rect x="0" y="${y}" width="100" height="6" fill="${c.c2}"/>`;
  if (c.pat === 'halves') pat = `<rect x="50" y="80" width="50" height="45" fill="${c.c2}"/>`;
  const back = p.hair === 2 ? `<path d="M33 50 C32 33 42 29 50 29 C59 29 68 33 67 50 L69 76 C64 74 61 71 61 66 L39 66 C39 71 36 74 31 76Z" fill="${hc}"/>` : '';
  const hairTop = [
    `<path d="M34.5 54 C33 36 43 32 50 32 C58 32 67 36 65.5 54 C63 45 57 41.5 50 41.5 C43 41.5 37 45 34.5 54Z" fill="${hc}"/>`,
    `<g fill="${hc}"><circle cx="37" cy="45" r="7"/><circle cx="44" cy="38" r="8.5"/><circle cx="56" cy="38" r="8.5"/><circle cx="63" cy="45" r="7"/><circle cx="50" cy="35" r="8"/></g>`,
    `<path d="M34 55 C32 35 43 31 50 31 C58 31 68 35 66 55 C64 46 60 42 54 41 C50 44 42 45 34 55Z" fill="${hc}"/>`,
    `<path d="M35 50 C35 38 43 35 50 35 C57 35 65 38 65 50 C62 44 57 42 50 42 C43 42 38 44 35 50Z" fill="${hc}" opacity=".55"/>`,
    `<path d="M34.5 55 C32 36 42 31 52 32 C61 33 67 38 65.5 53 C64 46 61 43 56 42 C49 42 42 40 38 43 C36 46 35 50 34.5 55Z" fill="${hc}"/><path d="M42 33 C46 38 47 41 47 42" stroke="${sk}" stroke-width="1" fill="none" opacity=".5"/>`
  ][p.hair];
  const stache = p.stache ? `<path d="M43 65 C46 62.5 54 62.5 57 65 C54 66.5 46 66.5 43 65Z" fill="${hc}"/>` : '';
  return `<svg viewBox="0 0 100 122" aria-hidden="true"><defs><clipPath id="${uid}"><path d="${shirt}"/></clipPath>
<radialGradient id="${uid}g" cx=".5" cy=".38" r=".7"><stop offset="0" stop-color="#F6F0DF"/><stop offset="1" stop-color="#DCCFAE"/></radialGradient></defs>
<rect width="100" height="122" fill="url(#${uid}g)"/><circle cx="50" cy="52" r="34" fill="${c.c1}" opacity=".16"/>
${back}<rect x="43" y="68" width="14" height="20" rx="5" fill="${sk}"/><path d="M43 78 Q50 83 57 78 L57 82 Q50 87 43 82Z" fill="#000" opacity=".12"/>
<path d="${shirt}" fill="${c.c1}"/><g clip-path="url(#${uid})">${pat}<path d="${shirt}" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="2"/></g>
<path d="M36 84.5 L50 97 L64 84.5" stroke="${c.c2 === c.c1 ? '#2A241C' : c.c2}" stroke-width="4" fill="none" stroke-linejoin="round"/>
<path d="M36 84.5 L50 97 L64 84.5" stroke="${c.c1}" stroke-width="1.2" fill="none" opacity=".5"/>
<ellipse cx="34.5" cy="57" rx="3" ry="4.5" fill="${sk}"/><ellipse cx="65.5" cy="57" rx="3" ry="4.5" fill="${sk}"/>
<ellipse cx="50" cy="55" rx="15.5" ry="18.5" fill="${sk}"/>
<path d="M36 60 Q50 76 64 60 Q62 73 50 73.5 Q38 73 36 60Z" fill="#000" opacity=".06"/>
${hairTop}
<path d="M41 50.5 L46.5 50" stroke="${hc}" stroke-width="1.6" stroke-linecap="round"/><path d="M53.5 50 L59 50.5" stroke="${hc}" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="44" cy="55" r="1.5" fill="#2A211C"/><circle cx="56" cy="55" r="1.5" fill="#2A211C"/>
<path d="M50 56 L48.6 62 L51 62" stroke="#000" stroke-opacity=".18" stroke-width="1" fill="none"/>
${stache}<path d="M46 67.5 Q50 69.3 54 67.5" stroke="#5a3a2c" stroke-opacity=".55" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>`;
}
const crest = `<svg class="crest" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 L36 7 V19 C36 29 29 35 20 38 C11 35 4 29 4 19 V7Z" fill="#D9A23B"/><path d="M20 5.5 L33 9.5 V19 C33 27.5 27 32.5 20 35 C13 32.5 7 27.5 7 19 V9.5Z" fill="#1F4D3A"/><circle cx="20" cy="20" r="7.5" fill="#F2EDDE"/><path d="M20 13.2 L22.3 17.5 L20 20 L17.7 17.5Z M14.6 22.6 L17.7 17.5 L20 20 L18.2 24.6Z M25.4 22.6 L22.3 17.5 L20 20 L21.8 24.6Z" fill="#1F4D3A"/></svg>`;
const ICONS = {
  home: '<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>',
  clients: '<circle cx="9" cy="8.5" r="3.3" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M3 20c.6-3.8 3-5.8 6-5.8s5.4 2 6 5.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M15.5 5.6a3 3 0 0 1 0 5.8M17.6 14.6c1.8.7 3 2.5 3.4 5.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  market: '<circle cx="7" cy="14" r="3.6" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="17" cy="14" r="3.6" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M10.6 13.4h2.8M5 10.6 7.5 5h2l.8 4M19 10.6 16.5 5h-2l-.8 4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>',
  deals: '<path d="M7 3h8l4 4v14H7z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M10 11h6M10 14.5h6M10 18h3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>',
  office: '<path d="M4 20V8l8-4 8 4v12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M2.5 20h19M8 11v6M12 11v6M16 11v6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>'
};
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CUP = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 16h20v8a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="currentColor" opacity=".22"/><path d="M8 16h20v8a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8zM28 19h2.5a3.5 3.5 0 0 1 0 7H27M6 35h24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 6c-1.5 2 1.5 3 0 6M19 5c-1.5 2 1.5 3 0 6M24 6c-1.5 2 1.5 3 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const medal = (on, tier) => { const c = on ? ['#B07A3A', '#B9BCC0', '#D9A23B', '#D9A23B'][tier > 2 ? 3 : Math.max(0, Math.ceil(tier) - 1)] : '#9AA39C';
  return `<svg class="medal" viewBox="0 0 36 42" aria-hidden="true"><path d="M10 2h6l4 12h-6zM26 2h-6l-4 12h6z" fill="${on ? '#1F4D3A' : '#9AA39C'}"/><circle cx="18" cy="27" r="12" fill="${c}"/><circle cx="18" cy="27" r="8.5" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/><path d="M18 21.5l1.7 3.5 3.8.5-2.8 2.6.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.6 3.8-.5z" fill="#fff" fill-opacity=".85"/></svg>`; };
const moraleColor = m => m >= 60 ? 'var(--good)' : m >= 35 ? 'var(--gold-bg)' : 'var(--red)';
const moraleWord = m => m >= 80 ? 'Entusiasta' : m >= 60 ? 'Sereno' : m >= 35 ? 'Inquieto' : m >= 15 ? 'Scontento' : 'Furioso';

/* ---------- views ---------- */
const $app = document.getElementById('app');

function render() {
  if (!S) { $app.innerHTML = introView(); return; }
  const tabs = [['home', 'Agenzia'], ['clients', 'Assistiti'], ['market', 'Mercato'], ['deals', 'Trattative'], ['office', 'Ufficio']];
  const body = { home: homeView, clients: clientsView, market: marketView, deals: dealsView, office: officeView }[ui.tab]();
  const next = S.week > WEEKS ? 'Chiudi la stagione' : 'Gioca la giornata';
  $app.innerHTML = `
<header class="mast"><div class="wrap">${crest}
  <div class="id"><h1>${esc(S.name)}</h1><div class="sub">${seasonLabel()} · ${repTitle(S.rep)}</div></div>
  <div class="cash"><b class="${S.money < 0 ? 'neg' : ''}">${eur(S.money)}</b><span>in cassa</span></div></div></header>
<main class="wrap">${body}</main>
<nav class="dock">
  <div class="adv"><div class="wrap"><div class="when"><b>${weekLabel()}</b><span>${isDeadline() ? 'Chiusura mercato!' : inWindow() ? 'Mercato aperto' : 'Mercato chiuso'} · ${S.lastNet == null ? 'stagione al via' : (S.lastNet >= 0 ? '+' : '') + eur(S.lastNet) + ' ultima sett.'}</span></div>
  <button class="btn pri" data-a="advance">${next} ›</button></div></div>
  <div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${ui.tab === k ? 'on' : ''}" data-a="tab" data-v="${k}" aria-label="${l}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}${k === 'deals' && S.offers.length ? `<span class="badge">${S.offers.length}</span>` : ''}${k === 'office' && achReady() ? `<span class="badge">${achReady()}</span>` : ''}</button>`).join('')}</div>
</nav>
${sheetView()}<div id="toastSlot"></div>`;
  renderToast();
}
function renderToast() { const s = document.getElementById('toastSlot'); if (s) s.innerHTML = ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : ''; }

function introView() {
  const had = !!load();
  return `<section class="intro"><div class="circle"></div><div class="halfway"></div><div class="wrap">
  <div class="kicker">Calciomercato · dal 2026</div>
  <h1>Il<br><em>Procuratore</em></h1>
  <p>Scopri ragazzi sconosciuti, portali nei grandi club e tratta ogni euro dei loro contratti. La tua fetta è la commissione.</p>
  <div class="field"><label for="agencyName">Nome della tua agenzia</label><input id="agencyName" maxlength="26" placeholder="Es. Studio Bellavista" value="Studio Bellavista" autocomplete="off"></div>
  <div class="btns"><button class="btn pri" data-a="start">Apri lo studio</button>${had ? '<button class="btn ghost" style="color:var(--on-pitch);border-color:rgba(242,237,222,.35)" data-a="continue">Continua carriera</button>' : ''}</div>
</div></section>`;
}

function homeView() {
  const open = inWindow();
  const left = S.week <= 5 ? 6 - S.week : S.week <= 24 && S.week >= 21 ? 25 - S.week : 0;
  const reopen = S.week < 21 ? 21 - S.week : Math.max(1, WEEKS + 2 - S.week);
  const inc = Math.round(weeklyIncome()), cost = OFFICE_COST[S.up.office];
  const rep = S.report.map(r => {
    const p = P(r.id); if (!p) return '';
    const right = r.s === 'play' ? `<span class="small muted">${r.g ? r.g + (r.g > 1 ? ' gol' : ' gol') : ''}${r.g && r.a ? ' · ' : ''}${r.a ? r.a + ' assist' : ''}</span><span class="rate ${r.r >= 7.5 ? 'g' : r.r < 5.8 ? 'b' : ''}">${r.r.toFixed(1)}</span>`
      : `<span class="small muted">${{ bench: 'In panchina', inj: 'Infortunato', free: 'Senza squadra' }[r.s]}</span>`;
    return `<div class="rep-row"><span class="mid"><b>${esc(shortName(p))}</b> <span class="muted small">${club(p) ? esc(club(p).name) : ''}</span></span>${right}</div>`;
  }).join('');
  return `
<section class="hero"><div class="lines"></div><div class="in">
  <div class="row"><div><div class="label">Stagione ${seasonLabel()} · ${S.week > WEEKS ? 'campionato concluso' : `giornata ${S.week} di ${WEEKS}`}</div>
  <div class="big num" style="font-family:var(--f-display)">${eur(S.money)}</div></div>
  <span class="chip ${isDeadline() ? 'dead' : open ? 'open' : 'closed'}"><span class="dot"></span>${isDeadline() ? 'Ultimo giorno di mercato' : open ? `Mercato aperto · ${left} sett.` : `Riapre tra ${reopen} sett.`}</span></div>
  <div style="margin-top:14px"><div class="label" style="display:flex;justify-content:space-between"><span>Reputazione · ${repTitle(S.rep)}</span><span class="num">${Math.floor(S.rep)}/100</span></div>
  <div class="repbar"><i style="width:${clamp(S.rep, 2, 100)}%"></i></div></div>
</div>
<div class="stats3"><div><b>+${eur(inc)}</b><span>Commissioni/sett.</span></div><div><b>−${eur(cost)}</b><span>Spese/sett.</span></div><div><b>${S.clients.length}/${CAP[S.up.office]}</b><span>Assistiti</span></div></div></section>

${S.offers.length ? `<button class="panel pad" data-a="tab" data-v="deals" style="display:flex;align-items:center;gap:12px;text-align:left;border-color:var(--gold-bg)">
  <span class="ovr hi"><b>${S.offers.length}</b><span>OFF.</span></span><span style="flex:1"><b>${S.offers.length === 1 ? 'Un club ti aspetta al tavolo' : S.offers.length + ' offerte sul tavolo'}</b><br><span class="small muted">Scadono in fretta: tratta prima di giocare la giornata.</span></span><span aria-hidden="true">›</span></button>` : ''}

${S.daily.last !== dayKey() ? (() => { const day = (S.daily.last === dayKey(Date.now() - 864e5) ? S.daily.streak : 0) % 7 + 1; const g = Math.round(1200 * day * (1 + (S.season - 1) * 0.5) / 100) * 100;
  return `<div class="coffee">${CUP}<div style="flex:1;min-width:0"><b>Il caffè del mattino</b><div class="small muted">Giorno ${day} di 7${day === 7 ? ' · più una soffiata sul mercato' : ''}</div><div class="cups">${[1, 2, 3, 4, 5, 6, 7].map(i => `<i class="${i <= day ? 'on' : ''}"></i>`).join('')}</div></div><button class="btn pri" data-a="daily">+${eur(g)}</button></div>`; })() : ''}

<div class="h2">Sfide di stagione <span class="count">${S.obj.filter(o => o.done).length}/3</span></div>
<div class="panel list">${S.obj.map(o => { const d = OBJ[o.t], pr = d.prog();
  const bin = o.target === 1 && !d.end && !d.money;
  const pv = d.end ? `Valutata a fine stagione · ora sei ${pr}°` : bin ? (o.done ? 'Completata' : 'Da fare') : d.money ? `${eur(Math.min(pr, o.target))} / ${eur(o.target)}` : `${Math.min(pr, o.target)} / ${o.target}`;
  const pct = o.done ? 100 : d.end ? clamp((7 - pr) / (7 - o.target) * 100, 5, 100) : clamp(pr / o.target * 100, 0, 100);
  return `<div class="obj ${o.done ? 'done' : ''}"><span class="ck">${CHECK}</span><div class="mid"><div class="tx">${d.txt(o)}</div>${o.done ? '' : `<div class="prog"><i style="width:${pct}%"></i></div>`}<div class="pv">${pv}</div></div><div class="rw">+${eur(o.money)}<br>+${o.rep} rep</div></div>`; }).join('')}</div>

${S.report.length ? `<div class="h2">Ultima giornata</div><div class="panel list">${rep}</div>` : ''}
<div class="h2">Classifica procuratori</div>
<div class="panel list">${board().map((x, i) => `<div class="br ${x.me ? 'me' : ''}"><span class="pos">${i + 1}</span><span class="bn">${esc(x.n)}</span><span class="num small">${eur(x.s)}</span></div>`).join('')}</div>
<p class="small muted" style="margin:-8px 0 0">Commissioni incassate in stagione. Chi chiude primo a maggio diventa procuratore dell'anno.</p>
<div class="h2">Notiziario</div>
<div class="panel list">${S.news.slice(0, 14).map(n => `<div class="news ${n.k}"><span class="w">${n.w}</span><span class="t">${n.t}</span></div>`).join('')}</div>`;
}

function playerRow(p, action = 'player') {
  const c = club(p);
  const pills = (p.inj ? `<span class="pill inj">Inf. ${p.inj}s</span>` : '') + (!c ? '<span class="pill free">Svincolato</span>' : '') +
    (p.listed ? '<span class="pill list">Sul mercato</span>' : '') + (c && p.contract <= 1 ? '<span class="pill exp">Scade</span>' : '');
  return `<button class="row-p" data-a="${action}" data-v="${p.id}">
  <span class="mini">${portrait(p)}</span>
  <span class="mid"><span class="nm">${esc(fullName(p))}${pills}</span>
  <span class="meta">${p.role} · ${p.age} anni · ${c ? `<span class="clubdot" style="background:${c.c1}"></span>${esc(c.name)}` : 'nessun club'}</span>
  <span class="mbar"><i style="width:${p.morale}%;background:${moraleColor(p.morale)}"></i></span></span>
  <span class="ovr ${p.ovr >= 75 ? 'hi' : ''}"><b>${p.ovr}</b><span>OVR</span></span></button>`;
}

function clientsView() {
  const cl = clients().sort((a, b) => b.ovr - a.ovr);
  return `<div class="h2">Scuderia <span class="count">${cl.length}/${CAP[S.up.office]}</span></div>
  ${cl.length ? `<div class="panel list">${cl.map(p => playerRow(p)).join('')}</div>` :
    `<div class="panel empty"><b>Nessun assistito</b>Vai al Mercato e convinci un talento a firmare con te.</div>`}
  <p class="small muted" style="margin:0">La barra sotto il nome è l'umore. Sotto il 12% per quattro settimane, il giocatore se ne va.</p>`;
}

function marketView() {
  const full = S.clients.length >= CAP[S.up.office];
  const cards = S.market.map(P).filter(p => p && !S.clients.includes(p.id)).map(p => {
    const c = club(p), b1 = p.bonus, c1 = recruitChance(p, 1), c2 = recruitChance(p, 2);
    return `<div class="panel mk"><div class="top"><span class="mini">${portrait(p)}</span>
      <span style="flex:1;min-width:0"><span class="nm" style="font:700 16px/1.15 var(--f-body);display:block">${esc(fullName(p))}</span>
      <span class="meta small muted">${ROLES[p.role]} · ${p.age} anni · ${p.nat}</span><br>
      <span class="small muted">${c ? `<span class="clubdot" style="background:${c.c1}"></span>${esc(c.name)}` : 'Svincolato'}</span></span>
      <span class="ovr ${p.ovr >= 75 ? 'hi' : ''}"><b>${p.ovr}</b><span>OVR</span></span></div>
      <div class="kv"><div><span>Potenziale</span><b>${potText(p)}</b></div><div><span>Valore</span><b>${eur(value(p))}</b></div><div><span>Commiss.</span><b>${p.fee}%</b></div></div>
      ${p.refused ? `<div class="refused">Ha scelto un'altra agenzia.</div>` :
      `<div class="btns"><button class="btn green" data-a="recruit" data-v="${p.id}" data-m="1" ${full || S.money < b1 ? 'disabled' : ''}>${eur(b1)} · ${Math.round(c1 * 100)}%</button>
      <button class="btn ghost" data-a="recruit" data-v="${p.id}" data-m="2" ${full || S.money < b1 * 2 ? 'disabled' : ''}>${eur(b1 * 2)} · ${Math.round(c2 * 100)}%</button></div>`}</div>`;
  }).join('');
  const tripCost = 2500 * S.up.scout;
  return `<div class="panel pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div style="flex:1;min-width:180px"><b>Rapporto osservatori</b><div class="small muted">Prossimo tra ${6 - S.mktAge} sett. · offri un premio alla firma: se rifiuta non paghi nulla.</div></div>
    <button class="btn ghost" data-a="trip" ${S.money < tripCost ? 'disabled' : ''}>Nuovo giro · ${eur(tripCost)}</button></div>
  ${full ? `<div class="warn">Scuderia al completo (${CAP[S.up.office]}). Amplia l'ufficio per firmare altri giocatori.</div>` : ''}
  <div class="h2">Talenti segnalati <span class="count">${S.market.length}</span></div>${cards || '<div class="panel empty"><b>Nessuno in lista</b>Manda gli osservatori in giro.</div>'}`;
}

function dealsView() {
  if (!S.offers.length) return `<div class="h2">Trattative</div><div class="panel empty"><b>Tavolo vuoto</b>${inWindow() ? 'Proponi i tuoi assistiti ai club dalla loro scheda: le offerte arrivano nelle prossime giornate.' : 'Il mercato è chiuso. Arrivano solo rinnovi e offerte per gli svincolati.'}</div>`;
  return `<div class="h2">Offerte sul tavolo <span class="count">${S.offers.length}</span></div><div class="panel list">${S.offers.map(o => {
    const p = P(o.pid), k = CLUBS[o.club];
    const label = { transfer: `Trasferimento · ${eur(o.fee)}`, free: 'Svincolato', renew: 'Rinnovo' }[o.type];
    return `<button class="row-p" data-a="nego" data-v="${o.id}"><span class="mini">${portrait(p)}</span>
    <span class="mid"><span class="nm">${esc(fullName(p))}</span><span class="meta"><span class="clubdot" style="background:${k.c1}"></span>${esc(k.name)} · ${label}</span>
    <span class="meta">${eur(o.cur)}/anno · ${o.years} anni · scade ${o.exp - S.week <= 0 ? 'questa settimana' : `tra ${o.exp - S.week + 1} sett.`}</span></span><span aria-hidden="true" class="muted">›</span></button>`;
  }).join('')}</div><p class="small muted" style="margin:0">Guadagni il 3% del cartellino nei trasferimenti, il 10% del primo anno di stipendio sugli svincolati e la tua percentuale sullo stipendio ogni settimana.</p>`;
}

function officeView() {
  const ups = ['office', 'scout', 'legal'].map(k => {
    const u = UPG[k], l = S.up[k], maxed = l >= u.max, cost = maxed ? 0 : u.cost[k === 'legal' ? l : l + 1];
    return `<div class="panel up"><div class="hd"><h4>${u.name}</h4><span class="lv">${Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</span></div>
    <div class="small muted">${u.desc(l)}</div>
    ${maxed ? '<div class="tiny" style="color:var(--gold)">Livello massimo</div>' : `<div class="small">Prossimo: ${u.desc(l + 1)}</div><button class="btn green full" data-a="upg" data-v="${k}" ${S.money < cost ? 'disabled' : ''}>Investi ${eur(cost)}</button>`}</div>`;
  }).join('');
  return `<div class="h2">Investimenti</div>${ups}
  <div class="h2">Traguardi <span class="count">${Object.keys(S.ach).length}/${ACH.length}</span></div>
  <div class="panel list">${ACH.map(([id, name, desc, , money, rep]) => { const st = S.ach[id];
    return `<div class="ach ${st ? '' : 'locked'}">${medal(!!st, rep)}<div class="mid"><b>${name}</b><div class="small muted">${desc}</div><div class="rw" style="text-align:left;margin-top:3px">${money ? '+' + eur(money) : ''}${money && rep ? ' · ' : ''}${rep ? '+' + rep + ' rep' : ''}</div></div>
    ${st === 1 ? `<button class="btn pri" data-a="claim" data-v="${id}">Ritira</button>` : st === 2 ? `<span class="ck" style="background:var(--good);border-color:var(--good);color:#fff">${CHECK}</span>` : ''}</div>`; }).join('')}</div>
  <div class="h2">Carriera</div><div class="panel season"><div><b>${S.season}</b><span>Stagione</span></div><div><b>${S.stats.deals}</b><span>Affari</span></div><div><b class="num" style="font-size:18px;line-height:26px">${eur(S.stats.earned)}</b><span>Guadagni</span></div><div><b class="num" style="font-size:18px;line-height:26px">${eur(S.stats.fees)}</b><span>Cartellini</span></div></div>
  <div class="h2">Partita</div><div class="panel pad" style="display:flex;flex-direction:column;gap:10px">
  <div class="small muted">Il salvataggio è automatico su questo dispositivo, a ogni giornata.</div>
  <button class="btn danger" data-a="reset">${ui.confirm === 'reset' ? 'Tocca ancora per cancellare tutto' : 'Ricomincia da zero'}</button></div>`;
}

/* ---------- sheets ---------- */
function sheetView() {
  const s = ui.sheet; if (!s) return '';
  if (s.k === 'event' && S.event && S.event.pid != null && !P(S.event.pid)) { S.event = null; ui.sheet = null; return ''; }
  let inner = '', closable = true;
  if (s.k === 'player') inner = playerSheet(P(s.id));
  if (s.k === 'nego') inner = negoSheet(S.offers.find(o => o.id === s.id));
  if (s.k === 'event' && S.event) { closable = false; const v = eventView(S.event);
    inner = `<h3>${v.title}</h3><p class="lead">${v.text}</p>${S.event.pid != null ? `<div class="panel list">${playerRow(P(S.event.pid), 'noop')}</div>` : ''}
    <div class="body">${v.ch.map(([l, a, dis]) => `<button class="btn ${a === v.ch[0][1] ? 'pri' : 'ghost'} full" data-a="ev" data-v="${a}" ${dis ? 'disabled' : ''}>${esc(l)}</button>`).join('')}</div>`; }
  if (s.k === 'season' && S.sum) { const m = S.sum;
    inner = `<h3>Fine stagione ${m.label}</h3><p class="lead">Si chiude un altro anno in giacca e cravatta.</p><div class="body">
    <div class="panel season" style="grid-template-columns:repeat(3,1fr)"><div><b class="num" style="font-size:18px;line-height:26px">${eur(m.earned)}</b><span>Commissioni</span></div><div><b>${m.deals}</b><span>Affari</span></div><div><b>${m.rep >= 0 ? '+' : ''}${Math.round(m.rep)}</b><span>Reputazione</span></div></div>
    <div class="panel season" style="grid-template-columns:repeat(2,1fr)"><div><b>${m.rank}°</b><span>In classifica</span></div><div><b>${m.obj}/3</b><span>Sfide vinte</span></div></div>
    ${m.lines.length ? `<div class="panel list">${m.lines.map(l => `<div class="news"><span class="t">${l}</span></div>`).join('')}</div>` : ''}
    <button class="btn pri full" data-a="close">Via alla nuova stagione</button></div>`; }
  if (s.k === 'over') { closable = false;
    inner = `<h3>Studio chiuso</h3><p class="lead">Otto settimane in rosso: la banca ha chiuso i rubinetti. Hai chiuso ${S.stats.deals} affari e incassato ${eur(S.stats.earned)} in carriera.</p><button class="btn pri full" data-a="hardreset">Ricomincia</button>`; }
  if (!inner) return '';
  return `<div class="scrim" ${closable ? 'data-a="close" data-self="1"' : ''}><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
}

function playerSheet(p) {
  if (!p) return '';
  const c = club(p), mine = S.clients.includes(p.id);
  const avg = p.apps ? (p.rsum / p.apps).toFixed(2) : '–';
  const hasRenew = S.offers.some(o => o.pid === p.id && o.type === 'renew');
  const canRenew = c && p.contract <= 2 && !hasRenew && !p.renewReq;
  return `<div class="card-wrap">
  <div class="tcard" style="--cb:${c ? c.c1 : '#1F4D3A'};--cf:${c ? (c.c2 === c.c1 ? '#2A241C' : c.c2) : '#F2EDDE'}"><div class="frame">${portrait(p)}<div class="o">${p.ovr}<small>${p.role}</small></div></div>
  <div class="nb">${esc(p.last.replace(/_/g, ' '))}</div><div class="cl">${c ? esc(c.name) : 'Svincolato'}</div></div>
  <div class="facts"><div class="wide"><span>Nome</span><b style="font-family:var(--f-body);font-weight:700;font-size:16px;white-space:normal">${esc(fullName(p))}</b></div>
  <div><span>Età</span><b>${p.age}</b></div><div><span>Nazione</span><b>${p.nat}</b></div>
  <div><span>Potenziale</span><b>${potText(p)}</b></div><div><span>Valore</span><b>${eur(value(p))}</b></div>
  <div><span>Stipendio</span><b>${c ? eur(p.wage) : '–'}</b></div><div><span>Contratto</span><b>${c ? (p.contract <= 0 ? '–' : 'fino al ' + (2025 + S.season + p.contract)) : '–'}</b></div>
  <div><span>Tua quota</span><b>${p.fee}%</b></div><div><span>Ti rende</span><b>${eur(p.wage * p.fee / 100)}/a</b></div></div></div>
  <div class="body" style="margin-top:16px">
  <div class="panel season"><div><b>${p.apps}</b><span>Presenze</span></div><div><b>${p.goals}</b><span>Gol</span></div><div><b>${p.assists}</b><span>Assist</span></div><div><b>${avg}</b><span>Media</span></div></div>
  <div class="panel pad" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between"><b>${moraleWord(p.morale)}</b><span class="num small">${Math.round(p.morale)}%</span></div>
  <div class="mbar" style="width:100%;height:6px"><i style="width:${p.morale}%;background:${moraleColor(p.morale)}"></i></div>
  <div class="small muted"><b style="color:var(--ink)">${p.trait}.</b> ${TRAITS[p.trait]}${p.inj ? ` Infortunato: rientra tra ${p.inj} settimane.` : ''}</div></div>
  ${mine ? `<div class="btns">
    ${c ? `<button class="btn ${p.listed ? 'ghost' : 'green'}" data-a="list" data-v="${p.id}">${p.listed ? 'Togli dal mercato' : 'Proponi ai club'}</button>` : ''}
    ${canRenew ? `<button class="btn ghost" data-a="renew" data-v="${p.id}">Chiedi il rinnovo</button>` : ''}
  </div>
  ${c && !inWindow() && p.listed ? '<div class="small muted">Mercato chiuso: le offerte arriveranno alla riapertura.</div>' : ''}
  ${p.renewReq ? '<div class="small muted">Hai chiesto un rinnovo: il club risponderà nelle prossime settimane.</div>' : ''}
  <button class="btn danger full" data-a="release" data-v="${p.id}">${ui.confirm === 'rel' + p.id ? 'Confermi? Perdi reputazione' : 'Termina la procura'}</button>` : ''}
  </div>`;
}

function negoSheet(o) {
  if (!o) return '';
  const p = P(o.pid), k = CLUBS[o.club], prev = club(p);
  const lo = o.cur, hi = Math.max(o.cur + 1000, Math.round(o.wage * 2 / 1000) * 1000);
  if (!ui.ask || ui.ask < lo || ui.ask > hi) ui.ask = Math.round(Math.min(hi, lo * 1.15) / 1000) * 1000;
  const type = { transfer: 'Trasferimento', free: 'Firma da svincolato', renew: 'Rinnovo di contratto' }[o.type];
  const warn = o.type === 'transfer' && prev && k.level < prev.level ? `<div class="warn">${esc(fullName(p))} scenderebbe in un club meno prestigioso.${p.trait === 'Ambizioso' ? ' Da ambizioso, la prenderà male.' : ''}</div>` : '';
  const oneoff = o.type === 'transfer' ? `3% del cartellino: <b>${eur(o.fee * 0.03)}</b>` : o.type === 'free' ? 'bonus firma 10% del primo anno' : 'bonus rinnovo 3% del primo anno';
  return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span class="mini">${portrait(p)}</span>
  <div style="min-width:0"><div class="tiny muted">${type}</div><h3 style="margin:2px 0 0">${esc(k.name)}</h3><div class="small muted">${esc(fullName(p))} · ${TIERNAME[k.tier]}</div></div></div>
  <div class="body">
  <div class="deal"><div><span>${o.type === 'transfer' ? 'Cartellino' : 'Durata'}</span><b>${o.type === 'transfer' ? eur(o.fee) : o.years + ' anni'}</b></div>
  <div><span>Offerta attuale</span><b>${eur(o.cur)}/a</b></div>
  ${o.type === 'transfer' ? `<div><span>Durata</span><b>${o.years} anni</b></div>` : ''}<div><span>Pazienza del ds</span><b class="pat">${[0, 1, 2].map(i => `<i class="${i < o.pat ? '' : 'off'}"></i>`).join('')}</b></div>
  ${o.type !== 'transfer' ? `<div><span>Stip. attuale</span><b>${p.wage ? eur(p.wage) : '–'}</b></div>` : ''}</div>
  ${warn}
  <div class="ask"><div class="tiny" style="opacity:.75">La tua richiesta di stipendio</div>
    <div class="v num" id="askV" style="font-family:var(--f-display)">${eur(ui.ask)}<span style="font-size:18px;opacity:.7"> /anno</span></div>
    <div class="c" id="askC">Per te: ${eur(ui.ask * p.fee / 100)} l'anno (${p.fee}%) + ${oneoff}</div>
    <input type="range" id="askR" min="${lo}" max="${hi}" step="1000" value="${ui.ask}" aria-label="Richiesta di stipendio">
    ${S.up.legal ? `<div class="c">Il tuo legale stima il tetto del club tra <b>${eur(o.hLo)}</b> e <b>${eur(o.hHi)}</b>.</div>` : '<div class="c">Senza un legale non sai fin dove si spinge il club.</div>'}</div>
  ${o.log.length ? `<div class="log">${o.log.slice(-4).map(l => `<div class="${l.me ? 'me' : ''}">${esc(l.t)}</div>`).join('')}</div>` : ''}
  <button class="btn pri full" data-a="ask" data-v="${o.id}">Chiedi questa cifra</button>
  <div class="btns"><button class="btn green" data-a="accept" data-v="${o.id}">Accetta ${eur(o.cur)}</button><button class="btn ghost" data-a="decline" data-v="${o.id}">Rifiuta</button></div>
  </div>`;
}

/* ---------- input ---------- */
document.addEventListener('input', e => {
  if (e.target.id !== 'askR') return;
  ui.ask = +e.target.value;
  const o = ui.sheet && S.offers.find(x => x.id === ui.sheet.id); if (!o) return;
  const p = P(o.pid);
  document.getElementById('askV').innerHTML = `${eur(ui.ask)}<span style="font-size:18px;opacity:.7"> /anno</span>`;
  const c = document.getElementById('askC'); c.innerHTML = c.innerHTML.replace(/Per te: [^ ]+/, 'Per te: ' + eur(ui.ask * p.fee / 100));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet && ['player', 'nego', 'season'].includes(ui.sheet.k)) { ui.sheet = null; render(); } });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.self && e.target !== el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a !== 'reset' && a !== 'release') ui.confirm = null;
  switch (a) {
    case 'start': { const n = (document.getElementById('agencyName').value || '').trim() || 'Studio Bellavista'; newGame(n); ui.tab = 'home'; render(); window.scrollTo(0, 0); break; }
    case 'continue': migrate(load()); if (S && S.event) ui.sheet = { k: 'event' }; render(); break;
    case 'tab': ui.tab = v; ui.sheet = null; render(); window.scrollTo(0, 0); break;
    case 'advance': advance(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'player': ui.sheet = { k: 'player', id: +v }; render(); break;
    case 'nego': ui.sheet = { k: 'nego', id: +v }; ui.ask = 0; render(); break;
    case 'close': if (ui.sheet && ui.sheet.k === 'season') S.sum = null; ui.sheet = null; save(); render(); break;
    case 'ev': resolveEvent(v); break;
    case 'daily': claimDaily(); break;
    case 'claim': { const a = ACH.find(x => x[0] === v); if (!a || S.ach[v] !== 1) return; S.ach[v] = 2; S.money += a[4]; addRep(a[5]); toast(`${a[1]} · premio ritirato`); buzz([30, 50, 30]); progress(); save(); render(); break; }
    case 'recruit': {
      const p = P(+v), m = +el.dataset.m, cost = p.bonus * m;
      if (S.clients.length >= CAP[S.up.office] || S.money < cost) return;
      if (R() < recruitChance(p, m)) {
        S.money -= cost; S.clients.push(p.id); S.market = S.market.filter(id => id !== p.id); p.morale = ri(68, 85); p.ovr0 = p.ovr; scoutRange(p); if (p.pot >= 85) S.rec.wonder = true;
        news(`<b>${fullName(p)}</b> firma la procura con te. Premio pagato: ${eur(cost)}.`, 'good'); toast(`${shortName(p)} è dei tuoi`);
      } else { p.refused = true; toast(`${shortName(p)} ha detto no`); }
      progress(); save(); render(); break;
    }
    case 'trip': { const c = 2500 * S.up.scout; if (S.money < c) return; S.money -= c; genMarket(); toast('Nuovo rapporto in arrivo'); save(); render(); break; }
    case 'upg': {
      const u = UPG[v], l = S.up[v], cost = u.cost[v === 'legal' ? l : l + 1];
      if (l >= u.max || S.money < cost) return;
      S.money -= cost; S.up[v]++;
      if (v === 'scout') for (const id of S.market) scoutRange(P(id));
      news(`Investimento: ${u.name} al livello ${S.up[v]}.`, 'good'); toast(`${u.name} · livello ${S.up[v]}`); save(); render(); break;
    }
    case 'list': { const p = P(+v); p.listed = !p.listed; if (p.listed) { p.morale += p.trait === 'Leale' ? -3 : 3; news(`Hai proposto <b>${fullName(p)}</b> ai club.`); } save(); render(); break; }
    case 'renew': { const p = P(+v); p.renewReq = true; news(`Hai chiesto a ${club(p).name} di parlare del rinnovo di <b>${fullName(p)}</b>.`); save(); render(); break; }
    case 'release': {
      if (ui.confirm !== 'rel' + v) { ui.confirm = 'rel' + v; render(); return; }
      const p = P(+v); ui.confirm = null; ui.sheet = null; S.rep = Math.max(0, S.rep - 1);
      dropClient(p, `Hai interrotto la procura con <b>${fullName(p)}</b>.`); save(); render(); break;
    }
    case 'ask': { const o = S.offers.find(x => x.id === +v); if (o) pushAsk(o, ui.ask); break; }
    case 'accept': { const o = S.offers.find(x => x.id === +v); if (o) finalize(o, o.cur); break; }
    case 'decline': { S.offers = S.offers.filter(x => x.id !== +v); ui.sheet = null; save(); render(); toast('Offerta rifiutata'); break; }
    case 'reset': if (ui.confirm !== 'reset') { ui.confirm = 'reset'; render(); return; } /* falls through */
    case 'hardreset': try { localStorage.removeItem(SAVE); } catch (err) {} S = null; ui.sheet = null; ui.confirm = null; ui.tab = 'home'; render(); break;
  }
});

/* ---------- boot ---------- */
function start(data) {
  S = (data && data.S) || null;
  if (S) migrate(S);
  if (S && S.event) ui.sheet = { k: 'event' };
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
