  <div class="panel list">${m.lines.map(l => `<div class="news"><span class="t">${l}</span></div>`).join('')}</div>
  <button class="btn pri full" data-a="close">Via alla nuova stagione</button></div>`;
}
function endingSheet() {
  return `<h3>Presidente della Lega</h3><p class="lead">Hai completato la scalata: dallo studio di provincia al vertice del calcio.</p><div class="body">
  <div class="panel season"><div><b>${S.season}</b><span>Stagioni</span></div><div><b>${S.trophies || 0}</b><span>Scudetti</span></div><div><b>${S.stats.deals}</b><span>Affari</span></div><div><b>${Object.keys(S.album).length}</b><span>Figurine</span></div></div>
  <p class="small muted" style="margin:0">Puoi continuare a guidare il tuo club. Ogni estate proporrai una riforma alla Lega.</p>
  <button class="btn pri full" data-a="close">Continua</button></div>`;
}
function leaguePanel() {
  if (!S.tab) return '';
  const st = standings(), mine = hlClubs();
  const rows = st.filter((id, i) => i < 4 || mine.has(id)).map(id => { const i = st.indexOf(id), t = S.tab[id], c = CLUBS[id];
    return `<div class="br ${mine.has(id) ? 'me' : ''}"><span class="pos" style="${i === 0 ? 'color:var(--gold)' : i >= st.length - 3 ? 'color:var(--red)' : ''}">${i + 1}</span><span class="bn"><span class="clubdot" style="background:${c.c1}"></span>${esc(c.name)}</span><span class="num small muted">${t.p} G</span><span class="num small" style="min-width:42px;text-align:right"><b>${t.pts}</b> pt</span></div>`; }).join('');
  const inB = clients().filter(p => club(p) && club(p).tier === 5).length;
  return `<div class="h2">Campionato</div><div class="panel list">${rows}<button class="row-p" data-a="table" style="justify-content:center;font-weight:700">Classifica completa ›</button></div>${inB ? `<p class="small muted" style="margin:-8px 0 0">${inB === 1 ? 'Un tuo assistito gioca' : inB + ' tuoi assistiti giocano'} in Serie B.</p>` : ''}`;
}
function tableSheet() {
  const st = standings(), mine = hlClubs();
  return `<h3>Classifica</h3><p class="lead">Serie A · ${Math.min(S.week - 1, WEEKS)} giornate su ${WEEKS}. La prima vince lo scudetto, le ultime tre scendono in Serie B.</p>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>Pt</th></tr></thead><tbody>${st.map((id, i) => { const t = S.tab[id], c = CLUBS[id];
    return `<tr class="${mine.has(id) ? 'mine' : ''} ${i === 0 ? 'top' : i >= st.length - 3 ? 'rel' : ''}"><td>${i + 1}</td><td><span class="clubdot" style="background:${c.c1}"></span>${esc(c.name)}</td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf - t.ga > 0 ? '+' : ''}${t.gf - t.ga}</td><td>${t.pts}</td></tr>`; }).join('')}</tbody></table></div>`;
}
const COIN = '<svg viewBox="0 0 54 54" aria-hidden="true"><circle cx="27" cy="27" r="25" fill="#D9A23B"/><circle cx="27" cy="27" r="19.5" fill="none" stroke="#1F4D3A" stroke-width="2" stroke-dasharray="3 3"/><path d="M27 15l3.6 7.4 8.1 1.1-5.9 5.7 1.4 8-7.2-3.8-7.2 3.8 1.4-8-5.9-5.7 8.1-1.1z" fill="#1F4D3A"/></svg>';
function albumView() {
  const cards = Object.values(S.album).sort((a, b) => b.peak - a.peak);
  const n = cards.length, next = AM.find(([t]) => n < t), slots = next ? Math.min(6, next[0] - n) : 0;
  return `<div class="panel pad crbox">${COIN}<div style="flex:1;min-width:0"><div class="big" style="font-size:40px">${S.cr} <span style="font-size:20px">${S.cr === 1 ? 'credito' : 'crediti'}</span></div>
  <div class="small muted">Li guadagni completando l'album, ritirando i traguardi, vincendo tutte le sfide di stagione e col settimo caffè.</div></div></div>
  <div class="h2">Album <span class="count">${n} figurine</span></div>
  ${next ? `<p class="small muted" style="margin:0">Prossimo premio a ${next[0]} figurine: +${next[1]} ${next[1] === 1 ? 'credito' : 'crediti'}. Ci sono bonus anche per la prima figurina d'argento (70+), d'oro (80+) e leggenda (88+).</p>` : ''}
  <div class="album">${cards.map(c => { const x = rarity(c);
    return `<button class="acard ${c.active ? '' : 'off'}" style="--rar:${RARC[x]}" data-a="card" data-v="${c.id}" aria-label="${esc(fullName(c))}">${portrait(c)}<span class="o">${c.peak}</span><div class="n">${esc(c.last.replace(/_/g, ' '))}</div><div class="rr">${RAR[x]}</div></button>`; }).join('')}${'<div class="slot">?</div>'.repeat(slots)}</div>
  <div class="h2">Bottega</div>
  <div class="panel list">${SHOP.map(([id, name, desc, cost]) => `<div class="shop"><div class="mid"><b>${name}</b><div class="small muted">${typeof desc === 'function' ? desc() : desc}</div></div><button class="btn ${S.cr >= cost ? 'pri' : 'ghost'}" data-a="buy" data-v="${id}" ${S.cr < cost ? 'disabled' : ''}>${cost} cr.</button></div>`).join('')}</div>`;
}
function cardSheet(c) {
  if (!c) return '';
  const x = rarity(c), k = c.club != null ? CLUBS[c.club] : null;
  return `<div class="card-wrap"><div class="tcard" style="--cb:${RARC[x]};--cf:#F2EDDE;box-shadow:0 0 0 3px ${RARC[x]},0 12px 22px -12px rgba(0,0,0,.55)"><div class="frame">${portrait(c)}<div class="o">${c.peak}<small>${c.role}</small></div></div>
  <div class="nb">${esc(c.last.replace(/_/g, ' '))}</div><div class="cl">${RAR[x]}</div></div>
  <div class="facts"><div class="wide"><span>Nome</span><b style="font-family:var(--f-body);font-weight:700;font-size:16px;white-space:normal">${esc(fullName(c))}</b></div>
  <div><span>Nazione</span><b>${c.nat}</b></div><div><span>Ruolo</span><b>${c.role}</b></div>
  <div><span>Picco</span><b>${c.peak}</b></div><div><span>Stato</span><b>${c.ret ? 'Ritirato' : c.active ? 'Assistito' : 'Ex'}</b></div>
  <div class="wide"><span>Club al top</span><b style="font-family:var(--f-body);font-weight:600;white-space:normal">${k ? esc(k.name) : '–'}</b></div>
  <div class="wide"><span>Con te</span><b>${2025 + c.from}–${2026 + c.to}</b></div></div></div>
  <div class="body" style="margin-top:16px"><div class="panel season" style="grid-template-columns:repeat(3,1fr)"><div><b>${c.apps}</b><span>Presenze</span></div><div><b>${c.goals}</b><span>Gol</span></div><div><b>${c.deals}</b><span>Affari</span></div></div></div>`;
}

/* ---------- input ---------- */
document.addEventListener('input', e => {
  const SL = { bfR: ['fee', 'bfV'], bwR: ['ask', 'bwV'], saR: ['ask', 'saV'] };
  if (SL[e.target.id]) { const [key, out] = SL[e.target.id]; ui[key] = +e.target.value; document.getElementById(out).textContent = eur(ui[key]); return; }
  if (e.target.id === 'feeR') { ui.fee = +e.target.value; document.getElementById('feeV').textContent = eur(ui.fee); document.getElementById('feeC').textContent = 'Per te: ' + eur(ui.fee * 0.03); return; }
  if (e.target.id !== 'askR') return;
  ui.ask = +e.target.value;
  const o = ui.sheet && S.offers.find(x => x.id === ui.sheet.id); if (!o) return;
  const p = P(o.pid);
  document.getElementById('askV').innerHTML = `${eur(ui.ask)}<span style="font-size:18px;opacity:.7"> /anno</span>`;
  const c = document.getElementById('askC'); c.innerHTML = c.innerHTML.replace(/Per te: [^ ]+/, 'Per te: ' + eur(ui.ask * p.fee / 100));
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet && ['player', 'nego', 'season', 'table', 'card', 'ending'].includes(ui.sheet.k)) { ui.sheet = null; render(); } });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.dataset.self && e.target !== el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a !== 'reset' && a !== 'release' && a !== 'releasesq') ui.confirm = null;
  switch (a) {
    case 'start': { const n = (document.getElementById('agencyName').value || '').trim() || 'Studio Bellavista'; newGame(n); ui.tab = 'home'; render(); window.scrollTo(0, 0); break; }
    case 'continue': migrate(load()); if (S && S.event) ui.sheet = { k: 'event' }; render(); break;
    case 'tab': ui.tab = v; ui.sheet = null; render(); window.scrollTo(0, 0); break;
    case 'advance': advance(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'player': ui.sheet = { k: 'player', id: +v }; render(); break;
    case 'nego': ui.sheet = { k: 'nego', id: +v }; ui.ask = 0; ui.fee = 0; render(); break;
    case 'table': ui.sheet = { k: 'table' }; render(); break;
    case 'card': ui.sheet = { k: 'card', id: +v }; render(); break;
    case 'buy': buy(v); break;
    case 'bstart': { const ex = S.offers.find(o => o.type === 'buy' && o.pid === +v); ui.fee = 0; ui.ask = 0; if (ex) { ui.sheet = { k: 'nego', id: ex.id }; render(); } else startBuy(+v); break; }
    case 'bfee': { const o = S.offers.find(x => x.id === +v); if (o) pushBuyFee(o, ui.fee); break; }
    case 'bwage': { const o = S.offers.find(x => x.id === +v); if (o) pushBuyWage(o, ui.ask); break; }
    case 'bacc': { const o = S.offers.find(x => x.id === +v); if (o) pushBuyWage(o, o.wAsk); break; }
    case 'sask': { const o = S.offers.find(x => x.id === +v); if (o) pushSell(o, ui.ask); break; }
    case 'sacc': { const o = S.offers.find(x => x.id === +v); if (o) doSell(o, o.fee); break; }
    case 'job': acceptJob(+v); break;
    case 'backagent': backToAgent(); break;
    case 'buyclub': buyClub(+v); break;
    case 'inject': { const x = +v; if (S.money < x) return; S.money -= x; S.budget += x; news(`Versi ${eur(x)} nelle casse del club.`); toast(`+${eur(x)} al club`); save(); render(); break; }
    case 'fac': { const l = S.fac[v], c = facCost(l + 1); if (l >= 5 || S.budget < c) return; S.budget -= c; S.fac[v]++; news(`${FAC[v][0]} al livello ${S.fac[v]}.`, 'good'); toast(`${FAC[v][0]} · livello ${S.fac[v]}`); save(); render(); break; }
    case 'tripc': { const c = tripCostClub(); if (S.budget < c) return; S.budget -= c; genClubMarket(); toast('Nuovo rapporto degli osservatori'); save(); render(); break; }
    case 'renewsq': { const p = P(+v); if (!p) return; const ask = renewAsk(p);
      if (p.morale < 30) { toast(`${shortName(p)} non vuole rinnovare`); return; }
      if (S.role === 'ds' && wagesTotal() - p.wage + ask > S.wcap) { toast('Sfori il monte ingaggi'); return; }
      p.wage = ask; p.contract = 3; p.rAsk = null; p.morale = clamp(p.morale + 8, 0, 100); news(`Rinnovo: <b>${fullName(p)}</b> firma fino al ${2028 + S.season} a ${eur(ask)} l'anno.`, 'good'); toast('Rinnovo firmato'); save(); render(); break; }
    case 'releasesq': { if (ui.confirm !== 'rs' + v) { ui.confirm = 'rs' + v; render(); return; }
      const p = P(+v); if (!p) return; const c = releaseCost(p); S.budget -= c; ui.confirm = null; ui.sheet = null; news(`Hai svincolato <b>${fullName(p)}</b> (costo ${eur(c)}).`); removeSquad(p); save(); render(); break; }
    case 'fee': { const o = S.offers.find(x => x.id === +v); if (o) pushFee(o, ui.fee); break; }
    case 'cla': { const o = S.offers.find(x => x.id === +v); if (!o) return; o.cl = o.cl || {}; o.cl[el.dataset.k] = !o.cl[el.dataset.k]; save(); render(); break; }
    case 'close': if (ui.sheet && ui.sheet.k === 'season') S.sum = null; ui.sheet = null; if (S && S.event) ui.sheet = { k: 'event' }; save(); render(); break;
    case 'ev': resolveEvent(v); break;
    case 'daily': claimDaily(); break;
    case 'claim': { const a = ACH.find(x => x[0] === v); if (!a || S.ach[v] !== 1) return; S.ach[v] = 2; S.money += a[4]; addRep(a[5]); const crd = a[5] ? Math.ceil(a[5]) : 3; S.cr += crd; toast(`${a[1]} · premio ritirato · +${crd} cr.`); buzz([30, 50, 30]); progress(); save(); render(); break; }
    case 'recruit': {
      const p = P(+v), m = +el.dataset.m, cost = p.bonus * m; if (!p) return;
      if (S.clients.length >= CAP[S.up.office] || S.money < cost) return;
      if (R() < recruitChance(p, m)) {
        S.money -= cost; S.clients.push(p.id); S.market = S.market.filter(id => id !== p.id); p.morale = ri(68, 85); p.ovr0 = p.ovr; scoutRange(p); addCard(p); if (p.pot >= 85) S.rec.wonder = true;
        news(`<b>${fullName(p)}</b> firma la procura con te. Premio pagato: ${eur(cost)}.`, 'good'); toast(`${shortName(p)} è dei tuoi`);
      } else { p.refused = true; toast(`${shortName(p)} ha detto no`); }
      progress(); save(); render(); break;
    }
    case 'trip': { const c = 2500 * S.up.scout; if (S.money < c) return; S.money -= c; genMarket(); toast('Nuovo rapporto in arrivo'); save(); render(); break; }
    case 'upg': {
      const u = UPG[v], l = S.up[v], cost = u.cost[v === 'legal' ? l : l + 1];
      if (l >= u.max || S.money < cost) return;
      S.money -= cost; S.up[v]++;
      if (v === 'scout') for (const id of S.market) scoutRange(P(id));
      news(`Investimento: ${u.name} al livello ${S.up[v]}.`, 'good'); toast(`${u.name} · livello ${S.up[v]}`); save(); render(); break;
    }
    case 'list': { const p = P(+v); p.listed = !p.listed; if (p.listed) { p.morale += p.trait === 'Leale' ? -3 : 3; news(`Hai proposto <b>${fullName(p)}</b> ai club.`); } save(); render(); break; }
    case 'renew': { const p = P(+v); p.renewReq = true; news(`Hai chiesto a ${club(p).name} di parlare del rinnovo di <b>${fullName(p)}</b>.`); save(); render(); break; }
    case 'release': {
      if (ui.confirm !== 'rel' + v) { ui.confirm = 'rel' + v; render(); return; }
      const p = P(+v); ui.confirm = null; ui.sheet = null; S.rep = Math.max(0, S.rep - 1);
      dropClient(p, `Hai interrotto la procura con <b>${fullName(p)}</b>.`); save(); render(); break;
    }
    case 'ask': { const o = S.offers.find(x => x.id === +v); if (o) pushAsk(o, ui.ask); break; }
    case 'accept': { const o = S.offers.find(x => x.id === +v); if (!o) return;
      if (o.cur > capOf(o)) { o.pat--; o.log.push({ t: `Con queste clausole non arriviamo a ${eur(o.cur)}. Toglietene qualcuna.` }); if (o.pat <= 0) collapse(o, 'troppe clausole.'); else { save(); render(); } }
      else finalize(o, o.cur); break; }
    case 'decline': { S.offers = S.offers.filter(x => x.id !== +v); ui.sheet = null; save(); render(); toast('Offerta rifiutata'); break; }
    case 'reset': if (ui.confirm !== 'reset') { ui.confirm = 'reset'; render(); return; } /* falls through */
    case 'hardreset': try { localStorage.removeItem(SAVE); } catch (err) {} S = null; ui.sheet = null; ui.confirm = null; ui.tab = 'home'; render(); break;
  }
});

/* ---------- boot ---------- */
function start(data) {
  S = (data && data.S) || null;
  if (S) migrate(S);
  if (S && S.event) ui.sheet = { k: 'event' };
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
